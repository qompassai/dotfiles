options {
  port 5000;
  timeout 60;
  ppp		/usr/sbin/pppd;            
  ifconfig	/sbin/ifconfig;
  route		/sbin/route;
  firewall	/sbin/ipchains;
  ip		/sbin/ip;
}
cobra {
  passwd  "$(pass show vtundcobra/p)";
  device tun1;
  persist yes;
  up {
	ifconfig "%% 10.3.0.2 pointopoint 10.3.0.1 mtu 1450";
  };
}
cobra {
  passwd  "$(pass show vtundcobra/p2)";
  device tun1;
  persist yes;
  up {
	ip "link set %% up multicast off mtu 1450";
	ip "-family inet addr add 10.3.0.2 peer 10.3.0.1 dev %%";
  };
}
lion {
  passwd  "$(pass show vtundlion/p)";
  type  ether;
  device tap1;
  up {
	ifconfig "%% 10.1.0.2 netmask 255.255.255.0";
  };
  down {
	ifconfig "%% down";
  };
}
viper {
  passwd  "$(pass show vtundviper/p)";
  up {
	ppp "noipdefault";
  };
}
backup {
  passwd "$(pass show vtund/backup/p)";
  up {
	program /bin/sh "-c 'cd /tmp; tar xf -";
  };
}
sz {
  passwd  "$(pass show vtundsq/p)";
  up {
	program  /bin/sh "-c 'cd /tmp; rz'";
  };
}
