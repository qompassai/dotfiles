# =============================================================================
# ifupdown-ng -- global behaviour configuration (ifupdown-ng.conf)
# =============================================================================
# What this is: the main configuration file for ifupdown-ng, the network
# device manager (AUR package `ifupdown-ng`; backwards compatible with
# Debian/Alpine ifup/ifdown, with a dependency-solver for bring-up order).
# ELI5: the house rules for the electrician -- whether to allow helper
# scripts, auto-pick tools, or learn the hostname by itself.
# Every setting below is a boolean (0/1); all seven are explicitly set to
# their documented defaults, so this file is behaviour-neutral as shipped.
# Executor-specific options are NOT here -- they live in
# /etc/network/interfaces stanzas (see interfaces(5) / ifupdown-executor(7)).
# Source: upstream ifupdown-ng dist/ifupdown-ng.conf.example and
# doc/ADMIN-GUIDE.md "ifupdown-ng Configuration" (accessed 2026-09-28;
# https://github.com/ifupdown-ng/ifupdown-ng).
# Real location: /etc/network/ifupdown-ng.conf (optional; absent == all
# defaults, which is what this file spells out).
# ---
# allow_addon_scripts:
# Enable support for /etc/network/if-X.d addon scripts (legacy compat;
# disable for performance when only native executors are used).
allow_addon_scripts = 1

# allow_any_iface_as_template:
# Let any interface act as a template for another interface. Presently
# the default, but deprecated -- disable to require inheritance from
# explicitly declared templates.
allow_any_iface_as_template = 1

# auto_executor_selection:
# Automatically select executors from the config options present. Disable
# to require explicit `use` statements per interface.
auto_executor_selection = 1

# compat_create_interfaces:
# Create interfaces when compat_* settings are active and creation is
# needed for full compliance (e.g. inheriting bridge VLAN settings to a
# bridge port with no stanza of its own).
compat_create_interfaces = 1

# compat_ifupdown2_bridge_ports_inherit_vlans:
# Behave like ifupdown2: bridge-vids / bridge-pvid set on a bridge are
# inherited by all member ports unless set explicitly on the port.
compat_ifupdown2_bridge_ports_inherit_vlans = 1

# implicit_template_conversion:
# Auto-convert legacy template-declared-as-iface stanzas to proper
# templates. If disabled, inheritance still works against non-template
# interfaces without converting them.
implicit_template_conversion = 1

# use_hostname_for_dhcp:
# Default the `hostname` property for DHCP interfaces to the system
# hostname (equivalent to `hostname $(hostname)` without writing it).
use_hostname_for_dhcp = 1
