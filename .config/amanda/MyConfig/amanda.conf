############################################################
org "MyConfig"
infofile "/etc/amanda/MyConfig/curinfo"
logdir "/etc/amanda/MyConfig"
indexdir "/etc/amanda/MyConfig/index"
dumpuser "amandabackup"
tpchanger "chg-disk:/var/lib/amanda/vtapes/MyConfig"
labelstr "MyData[0-9][0-9]"
autolabel "MyData%%" EMPTY VOLUME_ERROR
tapecycle 4
dumpcycle 3 days
amrecover_changer "changer"
tapetype "TEST-TAPE"
define tapetype TEST-TAPE {
  length 100 mbytes
  filemark 4 kbytes
}
define dumptype simple-gnutar-local {
    auth "local"
    compress none
    program "GNUTAR"
}
holdingdisk hd1 {
    directory "/var/lib/amanda/holdings/MyConfig"
    use 50 mbytes
    chunksize 1 mbyte
}
define dumptype simple-gnutar-remote {
    auth "ssh"
    ssh_keys ""
    compress none
    program "GNUTAR"
}
