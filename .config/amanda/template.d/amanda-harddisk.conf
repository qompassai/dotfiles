# /qompassai/dotfiles/.config/amanda/template.d/amanda-harddisk.conf
# Qompass AI Amanda Hard-Disk Config
# Copyright (C) 2026 Qompass AI, All rights reserved
#############################################################
org "DailySet1"
mailto "amandabackup"
dumpcycle 1 week
runspercycle 5
tapecycle 10 tapes
runtapes 1
define changer my_vtapes {
    tpchanger "chg-disk:/var/lib/amanda/vtapes/DailySet1"
    property "num-slot" "10"
    property "auto-create-slot" "yes"
}
tpchanger "my_vtapes"
tapetype HARDDISK
labelstr "^DailySet1-[0-9][0-9]*$"
dtimeout 1800 
ctimeout 30
etimeout 300
define dumptype global {
        comment "Global definitions"
        auth "bsdtcp"
}
define application-tool app_amgtar {
    comment "amgtar"
    plugin  "amgtar"
    #property "GNUTAR-PATH" "/path/to/gtar"
    #property "GNUTAR-LISTDIR" "/path/to/gnutar_list_dir"
}
define dumptype gui-base {
	global
	program "APPLICATION"
        application "app_amgtar"
        comment "gui base dumptype dumped with tar"
        compress none
        index yes
}
define tapetype HARDDISK {
    comment "Virtual Tapes"
    length 5000 mbytes
    part_size 500 mbytes
    part_cache_type none
}
includefile "./advanced.conf"
includefile "/etc/amanda/template.d/dumptypes"
includefile "/etc/amanda/template.d/tapetypes"
