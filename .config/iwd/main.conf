[General]
EnableNetworkConfiguration=true
SystemdEncrypt=iwd-secret
RoamThreshold=-75
RoamThreshold5G=-80

[Network]
NameResolvingService=unbound
EnableIPv4=true
EnableIPv6=true
EnableLLMNR=true
EnableMulticastDNS=true
