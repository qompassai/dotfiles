#/qompassai/dotfiles/.config/meson/meson.ini

[binaries]
c = 'zig'
c_ld = 'zig'
cpp_ld = 'zig'
cpp = 'zig'
ar = 'zig'
pkg-config = 'pkg-config'
cmake = 'cmake'
llvm-config = 'llvm-config'

[built-in options]
buildtype = 'release'
b_lto = true
b_pie = true
b_sanitize = 'none'
optimization = 3
blas = 'mkl-dynamic-ilp64-tbb'
lapack = 'mkl-dynamic-ilp64-tbb'

[properties]
needs_exe_wrapper = false
c_args = [
    '-target', 'x86_64-linux-gnu',
    '-Doptimize=safe',
    '-fPIC',
    '-DMKL_ILP64',
    '-I/opt/intel/oneapi/mkl/latest/include',
    '-I/opt/intel/oneapi/tbb/latest/include'
]
cpp_args = [
    '-target', 'x86_64-linux-gnu',
    '-Doptimize=safe',
    '-fPIC',
    '-DMKL_ILP64',
    '-I/opt/intel/oneapi/mkl/latest/include',
    '-I/opt/intel/oneapi/tbb/latest/include'
]
link_args = [
    '-target', 'x86_64-linux-gnu',
    '-L/opt/intel/oneapi/mkl/latest/lib/intel64',
    '-L/opt/intel/oneapi/tbb/latest/lib/intel64',
    '-lmkl_intel_lp64',
    '-lmkl_tbb_thread',
    '-lmkl_core',
    '-ltbb',
    '-lpthread',
    '-lm',
    '-ldl'
]
c_link_args = [
    '-L/opt/intel/oneapi/mkl/latest/lib/intel64',
    '-L/opt/intel/oneapi/tbb/latest/lib/intel64',
    '-lmkl_intel_lp64',
    '-lmkl_tbb_thread',
    '-lmkl_core',
    '-ltbb'
]
cpp_link_args = [
    '-L/opt/intel/oneapi/mkl/latest/lib/intel64',
    '-L/opt/intel/oneapi/tbb/latest/lib/intel64',
    '-lmkl_intel_lp64',
    '-lmkl_tbb_thread',
    '-lmkl_core',
    '-ltbb'
]
warning_level = 3
werror = false
unity = 'off'
default_library = 'shared'
strip = true
cpp_std = 'c++20'
c_std = 'gnu17'
install_umask = 022

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

