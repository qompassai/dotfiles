#################################################
# References: https://wiki.archlinux.org/title/Trusted_Platform_Module/1.2
all_platform_classes = PC_11,PDA_12,SERVER_12,MOBILE_12
conformance_cred = /var/lib/tpm/conformance_credential
disable_ipv4 = 0
disable_ipv6 = 0
endorsement_cred = /var/lib/tpm/endorsement_credential
enforce_exclusive_transport = 0
firmware_log_file = /sys/kernel/security/tpm0/binary_bios_measurements
firmware_pcrs = 0,1,2,3,4,5
host_platform_class = PC_12
kernel_log_file = /sys/kernel/security/ima/binary_runtime_measurements
kernel_pcrs = 8,9,10
num_threads = 10
platform_cred = /var/lib/tpm/platform_credential
port = 30003
remote_ops = getpubkey selftest getcapability loadkey
system_ps_file = /var/lib/tpm/system.data
