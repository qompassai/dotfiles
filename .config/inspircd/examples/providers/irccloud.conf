# References: https://www.irccloud.com
<connect name="IRCCloud"
         parent="main"
         globalmax="100"
         localmax="100"
         useconnectban="no"
         useconnflood="no"
         usednsbl="no">
<connect name="IRCCloud (IPv4)"
         parent="IRCCloud"
         allow="5.254.36.56/29 5.254.36.104/29"
         uniqueusername="yes">
