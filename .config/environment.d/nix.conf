NIXPKGS_ALLOW_UNFREE=1
NIX_STATE_DIR=$HOME/.local/state/nix
NIX_LOG_DIR=$HOME/.local/state/nix/log
NIX_CONF_DIR=$HOME/.config/nix
XDG_DATA_DIRS=$HOME/.nix-profile/share:$HOME/.local/share:/usr/local/share:/usr/share
NIX_REMOTE=unix:///run/user/1000/nix/daemon-socket/socket
NIX_SHOW_TRACE=1
NIX_NETRC_FILE=$HOME/.config/nix/netrc
NIX_SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt

