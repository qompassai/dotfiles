CARGO_HOME=$HOME/.cargo
#CARGO_HOME=$XDG_DATA_HOME/.cargo
CARGO_INCREMENTAL=1
#CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_DEBUG=true
#CARGO_TARGET_DIR=$XDG_CACHE_HOME/cargo-target
