CC=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/compilers/bin/nvc
CMAKE_CUDA_ARCHITECTURES=89
CUDA_HOME=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/cuda
CUDA_NVCC_EXECUTABLE="sccache /opt/nvidia/hpc_sdk/Linux_x86_64/25.3/cuda/bin/nvcc"
CUDA_PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/cuda
CUDA_VISIBLE_DEVICES=0,1,2
CUDAFLAGS=-arch=sm_89
CUDAToolkit_ROOT=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/cuda
CXX=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/compilers/bin/nvc++
FC=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/compilers/bin/nvfortran
LD_LIBRARY_PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/cuda/lib64:/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/compilers/lib:/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/math_libs/lib64:/opt/optix-sdk/lib64${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}
LIBRARY_PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/cuda/lib64:/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/compilers/lib:/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/math_libs/lib64${LIBRARY_PATH:+:$LIBRARY_PATH}
NVCC_PREPEND_FLAGS=-Wno-error=attributes
NVCOMPILERS=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/compilers
NVHPC=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3
NVHPC_CUDA_FLAGS=-Wno-error=attributes
NVMATH=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/math_libs
OPTIX_INSTALL_DIR=/opt/optix-sdk
PATH=/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/cuda/bin:/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/compilers/bin:/opt/nvidia/hpc_sdk/Linux_x86_64/25.3/math_libs/bin:/opt/optix-sdk/bin${PATH:+:$PATH}

