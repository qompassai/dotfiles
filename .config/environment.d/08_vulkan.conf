# Reference: https://vulkan.lunarg.com/doc/view/1.3.261.1/linux/layer_configuration.html
VULKAN_SDK=$XDG_DATA_HOME/vulkan-sdk/x86_64
C_INCLUDE_PATH=$HOME/.local/share/vulkan-sdk/source/Vulkan-Loader/loader/generated:$HOME/.local/share/vulkan-sdk/source/Vulkan-ValidationLayers/layers/vulkan/generated:$C_INCLUDE_PATH
CMAKE_PREFIX_PATH=$VULKAN_SDK:$CMAKE_PREFIX_PATH
CPLUS_INCLUDE_PATH=$HOME/.local/share/vulkan-sdk/source/Vulkan-Loader/loader/generated:$HOME/.local/share/vulkan-sdk/source/Vulkan-ValidationLayers/layers/vulkan/generated:$CPLUS_INCLUDE_PATH
DISABLE_LAYER_AMD_SWITCHABLE_GRAPHICS_1=1
DXVK_CONFIG_FILE=$XDG_CONFIG_HOME/dxvk/dxvk.conf
DXVK_HDR=1
ENABLE_HDR_WSI=1
LD_LIBRARY_PATH=$VULKAN_SDK/lib:$LD_LIBRARY_PATH
LIBRARY_PATH=$VULKAN_SDK/lib:$LIBRARY_PATH
MESA_VK_WSI_LIST=wayland
PATH=$VULKAN_SDK/bin:$PATH
PKG_CONFIG_PATH=$VULKAN_SDK/lib/pkgconfig:$PKG_CONFIG_PATH
__VK_LAYER_NV_optimus=NVIDIA_only
VK_ADD_LAYER_PATH=$VULKAN_SDK/share/vulkan/implicit_layer.d
VK_ICD_FILENAMES=$VULKAN_SDK/share/vulkan/icd.d/intel_icd.x86_64.json:$VULKAN_SDK/share/vulkan/icd.d/nvidia_icd.json
VK_KHR_PRESENT_WAIT_ENABLED=1
VK_LAYER_PATH=$VULKAN_SDK/share/vulkan/explicit_layer.d
VK_ADD_LAYER_PATH=$VULKAN_SDK/share/vulkan/implicit_layer.d
#VK_LAYER_SETTINGS_PATH="$XDG_CONFIG_HOME/vulkan/settings.d"
VK_LOADER_DEBUG="warn,error,info"
VK_LOADER_DISABLE_LAYER_MESA=1
VK_LOADER_LAYERS_DISABLE=VK_LAYER_MESA_overlay:VK_LAYER_MESA_device_select:VK_LAYER_LUNARG_api_dump:VK_LAYER_LUNARG_monitor
VK_PRESENT_MODE=mailbox
VK_WSI_MODE=wayland
#env = VK_DEVICE_FILTER,intel
