#################################################
# References: https://wiki.archlinux.org/title/Netctl | https://arcanis.me/projects/netctl-gui | https://www.siberoloji.com/how-to-enable-and-use-networkmanager-on-arch-linux/ | https://unbound.docs.nlnetlabs.nl/en/latest/manpages/unbound-control.html
[Common]
CLOSETOTRAY="true"
LANGUAGE="en"
MAINUPDATE="1"
SKIPCOMPONENTS="false"
STARTTOTRAY="true"
SYSTRAY="true"
WIFIUPDATE="1"
[Helper]
CLOSE_HELPER="true"
#FORCE_SUDO="false"
HELPER_PATH="netctlgui-helper"
HELPER_SERVICE="netctlgui-helper.service"
USE_HELPER="true"
[netctl]
NETCTLAUTO_PATH="netctl-auto"
PROFILE_DIR="/etc/netctl/"
NETCTL_PATH="netctl"
NETCTLAUTO_SERVICE="netctl-auto"
SYSTEMCTL_PATH="systemctl"
[NetworkManager]
ENABLE_NM="true"
NMCLI_PATH="nmcli"
NMTUI_PATH="nmtui"
NM_SERVICE="NetworkManager"
[sudo]
#SUDO_PATH="kdesu"
[wpa_supplicant]
#CTRL_DIR="/run/wpa_supplicant"
#CTRL_GROUP="users"
#PID_FILE="/run/wpa_supplicant_$i.pid"
#WPACLI_PATH="wpa_cli"
#WPASUP_PATH="wpa_supplicant"
#WPA_DRIVERS="nl80211,wext"
[Other]
EDITOR_PATH="nvim"
IFACE_DIR="/sys/class/net/"
RFKILL_DIR="/sys/class/rfkill/"
#PREFERED_IFACE=""
