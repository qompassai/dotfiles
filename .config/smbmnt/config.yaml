#################################################
servers:
  myserver:
    ip: '$(pass show smbmnt/ip)'
    share: 'myfiles' 
    user: '$(pass show smbmnt/u)'
    password: '$(pass show smbmnt/p)' 
    version: '2.0'
    mnt: '/mnt/smbmnt' 
    dmp: 'true' 
    uim: 'true'
    cd: 'true' 
    permissions:
      file_mode: '0777'
      dir_mode: '0777'
      uid: '1000'
      gid: '1000'
