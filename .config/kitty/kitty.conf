# /qompassai/dotfiles/.config/kitty/kitty.conf
# Qompass AI Kitty Config
# Copyright (C) 2025 Qompass AI, All rights reserved
#################################################
# References: https://sw.kovidgoyal.net/kitty/conf.html

allow_remote_control yes
background #000000
background_opacity 0.9
bold_font auto
bold_italic_font auto
confirm_os_window_close 0
copy_on_select yes
cursor #dddddd
cursor_beam_thickness 1.5
cursor_blink_interval -1
cursor_shape beam
cursor_shape_unfocused hollow
cursor_stop_at_full_cell yes
cursor_trail 1
cursor_trail_color none
cursor_trail_start_threshold 2
cursor_underline_thickness 2.0
detect_urls yes
disable_ligatures never
dynamic_background_opacity 1
enable_audio_bell no
enable_kitty_graphics yes
escape_delay 10
font_family DaddyTimeMono Nerd Font Mono
font_size 13.0
foreground #dddddd
italic_font auto
linux_display_server auto
macos_hide_titlebar yes
macos_option_as_alt yes
map ctrl+c copy_or_interrupt
map ctrl+plus change_font_size all +1
map ctrl+equal change_font_size all +1
map ctrl+kp_add change_font_size all +1
map ctrl+minus change_font_size all -1
map ctrl+underscore change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0 change_font_size all 0
map ctrl+kp_0 change_font_size all 0
map ctrl+shift+v paste_from_clipboard
mouse_hide_wait 3.0
open_url_with default
#paste_actions strip_trailing_spaces,strip_leading_spaces
remote_control_password ''
scrollback_fill_enlarged_window no
scrollback_lines 2000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
scrollback_pager_history_size 0
scrollbar_gap 0.1
scrollbar_handle_color foreground
scrollbar_handle_opacity 0.5
scrollbar_hitbox_expansion 0.25
scrollbar_hover_width 1
scrollbar_interactive yes
scrollbar_jump_on_click yes
scrollbar_min_handle_height 1
scrollbar_radius 0.3
scrollbar_track_color foreground
scrollbar_track_hover_opacity 0.1
scrollbar_track_opacity 0
scrollbar_width 0.5
selection_foreground none
shell bash
show_hyperlink_targets yes
sync_to_monitor yes
tab_bar_edge bottom
tab_bar_min_tabs 2
tab_bar_style powerline
text_composition_strategy platform
text_fg_override_threshold 0
touch_scroll_multiplier 1.5
underline_hyperlinks hover
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
url_color #00afff
url_style underline
visual_bell_duration 0.15
visual_bell_opacity 0.7
wayland_titlebar_color system
wheel_scroll_min_lines 1
wheel_scroll_multiplier 5.0
window_logo_path none
window_logo_position left
window_logo_size 24.0
window_margin_width 21.75
window_padding_width 4
window_title_format "{title} — {shell}"
