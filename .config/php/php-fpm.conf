;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
daemonize = no
emergency_restart_interval = 0 
emergency_restart_threshold = 0
error_log = ${XDG_STATE_HOME:-$HOME/.local/state}/php/php-fpm.log
events.mechanism = epoll 
include = ${XDG_CONFIG_HOME:-$HOME/.config}/php/pool.d/*.conf 
log_buffering = no
log_level = notice
log_limit = 4096 
pid = ${XDG_RUNTIME_DIR:-/run/user/1000}/php-fpm.pid
process_control_timeout = 0
process.max = 16
process.priority = 0
rlimit_core = 0
rlimit_files = 1024
syslog.facility = user
syslog.ident = php-fpm
systemd_interval = 0
[www]
group = phaedrus
listen = ${XDG_RUNTIME_DIR:-/run/user/1000}/php-fpm-www.sock
listen.mode = 0660
listen.owner = phaedrus
listen.group = phaedrus
pm = ondemand
pm.max_children = 4
pm.max_requests = 500
pm.process_idle_timeout = 30s
user = phaedrus
php_admin_flag[log_errors] = on
php_admin_value[error_log] = ${XDG_STATE_HOME:-$HOME/.local/state}/php/www-error.log
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 60
php_value[upload_max_filesize] = 64M
php_value[post_max_size] = 80M
