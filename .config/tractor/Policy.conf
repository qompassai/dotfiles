connect_timeout=10
read_timeout=30
retry_attempts=5
rate_limit=512
max_failures=3
auto_blacklist_on_fail=yes
require_tls=yes
dead_bridge_grace_period=60
log_errors_to=../logs/errors.log
notify_on_bridge_failure=yes
