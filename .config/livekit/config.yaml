psrpc:
   max_attempts: 3
   timeout: 500ms
   backoff: 500ms
   buffer_size: 1000

audio:
   active_level: 30
   min_percentile: 40
   update_interval: 500
   smooth_intervals: 4
   active_red_encoding: true
# turn server
# turn:
