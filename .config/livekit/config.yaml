port: 7880

redis:
  address: redis.host:6379
  # db: 0
  # username: myuser
  # password: mypassword
  # To use sentinel remove the address key above and add the following
  # sentinel_master_name: livekit
  # sentinel_addresses:
  # - livekit-redis-node-0.livekit-redis-headless:26379
  # - livekit-redis-node-1.livekit-redis-headless:26379
  # If you use a different set of credentials for sentinel add
  # sentinel_username: user
  # sentinel_password: pass
  #
tls:
   enabled: true
   insecure: false
  #   server_name: myserver.com
  #   ca_cert_file: /path/to/ca.crt
  #   client_cert_file: /path/to/client.crt
  #   client_key_file: /path/to/client.key
  # cluster_addresses:
  # - livekit-redis-node-0.livekit-redis-headless:6379
  # - livekit-redis-node-1.livekit-redis-headless:6380

rtc:
  port_range_start: 50000
  port_range_end: 60000
  tcp_port: 7881
  use_external_ip: true
  use_ice_lite: true
  stun_servers:
  #- server1
  # turn_servers:
  #   - host: myhost.com
  #     port: 443
  #     # tls, tcp, or udp
  #     protocol: tls
  #     username: ""
  #     credential: ""
   congestion_control:
     enabled: true
     allow_pause: true
   allow_tcp_fallback: true
   packet_buffer_size_video: 500
   packet_buffer_size_audio: 200
   pli_throttle:
     low_quality: 500ms
     mid_quality: 1s
     high_quality: 1s
   enable_loopback_candidate: true
   interfaces:
     includes:
       - en0
     excludes:
       - docker0
   ips:
     includes:
       - 10.0.0.0/16
     excludes:
       - 192.168.1.0/24
   use_mdns: true
   strict_acks: true
   batch_io:
      batch_size: 128
      max_flush_interval: 2ms
   data_channel_max_buffered_amount: 0
   prometheus_port: 6789

keys:
  key1: secret1
  key2: secret2
logging:
   level: info
   pion_level: error
   json: false
   sample: false

