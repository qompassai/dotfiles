#####################################################
configs:
  - name: ~
    repo: ~
    fault_tolerant_mode: false
    last_backup_max_age: 0d
    storage:
      encryption: none
      encryption_passphrase: ~
      compression: auto,zstd,4
    retention:
      keep_last: 1
      keep_hourly: 0
      keep_daily: 7
      keep_weekly: 4
      keep_monthly: 3
      keep_yearly: 5
    exclude_patterns: []
