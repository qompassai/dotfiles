use_parallel_decompression="yes"
parallel_bzip2_prog="lbzip2"
rsyncable_opt_pigz=""
if [ -n "$(LC_ALL=C pigz --help 2>&1 | grep -Ew -- "--rsyncable")" ]; then
  rsyncable_opt_pigz="--rsyncable"
fi
extra_pigz_opt="--fast -b 1024 $rsyncable_opt_pigz"
extra_pbzip2_opt="-3"
extra_lbzip2_opt="-3"
extra_plzip_opt="-3"
extra_lz4mt_opt="-1"
