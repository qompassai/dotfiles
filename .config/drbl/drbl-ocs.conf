rsyncable_opt_gzip=""
if [ -n "$(LC_ALL=C gzip --help 2>&1 | grep -Ew -- "--rsyncable")" ]; then
  rsyncable_opt_gzip="--rsyncable"
fi
extra_gzip_opt="--fast $rsyncable_opt_gzip"
