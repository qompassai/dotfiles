data_dir = "$XDG_DATA_DIR/arti"
cache_dir = "$XDG_CACHE_DIR/arti"
[proxy]
socks = { enabled = true, port = 9150, address = "127.0.0.1" }
http = { enabled = false, port = 8118, address = "127.0.0.1" }
[logging]
level = "info"
file = "$XDG_CONFIG_DIR/arti/arti.log"
[bridges]
 enabled = true
 transport = "obfs4"
 bridges = [
   "obfs4 192.0.2.1:443 ...", 
 ]
[pt]
client_transport_plugin_dir = "/usr/bin"
