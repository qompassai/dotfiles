#####################################################
[context]
arch=amd64
kernel=6.17.8-zen1-1-zen
timeout=120
terminal=['foot', '-e']
font=DaddyTimeMono Nerd Font Mono
wm=Hyprland

[performance]
max_memory_gib=60
cpu_threads=16

[gpu]
primary=NVIDIA GeForce RTX 4070 Max-Q
secondary=Intel UHD Graphics
cuda_enabled=yes

[display]
monitors=4
resolution_primary=2560x1440@144Hz
resolution_secondary=3840x1080@60Hz

[disk]
boot_disks="/media/nvme0n1p1.vfat,/media/nvme1n1p1.vfat"
[locale]
language=en_US.UTF-8
[battery]
auto_suspend_percent=10
[update]
interval=never
[security]
luks_enabled=yes
[logging]
level=debug
success.symbol=✔
error.symbol=✘
