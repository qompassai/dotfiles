#/qompassai/dotfiles/.config/metasploit/openssl.conf
# Qompass AI Metasploit OpenSSL Config
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
openssl_conf            = default_config
HOME                    = ${ENV::HOME}
openssl_conf            = openssl_init
config_diagnostics      = 1

[openssl_init]                                   ### Qompassl initialization
engines                 = engine_section
oid                     = oid_section
providers               = provider_sect
random                  = random
ssl_conf                = ssl_configuration
[engine_section]                                # ENGINE Section
afalg                   = afalg_section
#capi                    = capi_section
gost                    = gost_section
pkcs11                  = pkcs11_section
#tpm2tss                 = tpm2tss_section
#loader_attic            = loader_attic_section
#padlock                = padlock_section # Only works if you run lscpu | grep -i padlock and get an output
[afalg_section]                                 # AFALG
engine_id               = afalg
dynamic_path            = /usr/lib/engines-3/afalg.so
init                    = 1
#default_algorithms      = ALL
#[capi_section]                                 # CAPI
#default_algorithms      = ALL
#init                    = 1
#engine_id               = capi
#dynamic_path            = /usr/lib/engines-3/capi.so
[gost_section]                                   #Gost
#default_algorithms      = ALL
dynamic_path            = /usr/lib/engines-3/gost.so
engine_id               = gost
init                    = 1
[pkcs11_section]
#default_algorithms      = ALL
dynamic_path            = /usr/lib/engines-3/libpkcs11.so
engine_id               = pkcs11
init                    = 1
#[tpm2tss_section]                                # TPM2 Engine
#default_algorithms      = ALL
#dynamic_path            = /usr/lib/engines-3/libtpm2tss.so
#engine_id               = tpm2tss
#init                    = 0
#[loader_attic_section]                           # Loader Attic
#default_algorithms      = ALL
#dynamic_path            = /usr/lib/engines-3/loader_attic.so
#engine_id               = loader_attic
#init                    = 1
[padlock_section]                                # Padlock
#default_algorithms      = ALL
dynamic_path            = /opt/qai/qompassl/lib64/engines-3/padlock.so
engine_id               = padlock
init                    = 1
[oid_section]
[qai_oid]
mldsa44 = 2.16.840.1.101.3.4.3.32
mldsa65 = 2.16.840.1.101.3.4.3.33
mldsa87 = 2.16.840.1.101.3.4.3.34
[provider_sect]
base                    = base_sect
default                 = default_sect
fips                    = fips_sect
gost                    = gost_sect
legacy                  = legacy_sect
oqsprovider             = oqs_sect
pkcs11                  = pkcs11_sect
#tpm2                   = tpm2_sect
[default_sect]                                   #Default Sect
activate                = 1
algorithms              = ALL
properties              = "provider=default", "security_level=2"
[base_sect]
activate                = 1
algorithms              = ALL
[fips_sect]
activate                = 1
module                  = /opt/qai/qompassl/lib64/ossl-modules/fips.so
properties              = "provider=fips", "security_level=2"
algorithms              = ALL:!X25519:!X448:!Ed25519:!Ed448
[legacy_sect]
activate                = 1
algorithms              = ALL
module                  = /usr/lib/ossl-modules/legacy.so
properties              = "provider=legacy", "security_level=2"
[oqs_sect]                                      #OQS-Provider
activate                = 1
module                  = /opt/qai/lib64/ossl-modules/oqsprovider.so
properties              = "provider=oqsprovider", "security_level=2"
[pkcs11_sect]
activate                = 1
algorithms              = ALL
module                  = /usr/lib/ossl-modules/pkcs11.so
properties              = "provider=pkcs11", "security_level=2"
[gost_sect]
activate                = 1
algorithms              = ALL
module                  = /usr/lib/ossl-modules/gostprov.so
properties              = "provider=gost", "security_level=2"
#[tpm2_sect]
#activate                = 0
#algorithms              = ALL
#module                  = /usr/lib/ossl-modules/tpm2.so
#properties              = "provider=tpm2", "security_level=1"
[ssl_configuration]                             #SSL Config
system_default          = system_default_sect
level3                  = tls_seclevel_3
fips                    = fips_ssl_sect
oqs                     = oqs_ssl_sect
tpm2                    = tpm2_ssl_sect
[system_default_sect]                            #System Default TLS
CipherString            = AES256-GCM-SHA384:AES256-SHA:AES256-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:DEFAULT:@STRENGTH:@SECLEVEL=2
Ciphersuites            = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
Groups                  = P-256:P-384:P-521:X25519:X448
MinProtocol             = TLSv1.2
MaxProtocol             = TLSv1.3
SignatureAlgorithms     = ECDSA+SHA256:ECDSA+SHA384:RSA-PSS+SHA256:RSA-PSS+SHA384:RSA-PSS+SHA256:RSA-PSS+SHA384:RSA+SHA256:RSA+SHA1
[tls_seclevel_3]                                #TLS Level 3 Sec
CipherString            = AES256-GCM-SHA384:AES256-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:DEFAULT:@STRENGTH:@SECLEVEL=3
CipherSuites            = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
Groups                  = X25519:P-256:P-384:P-521:X448:x25519_mlkem768:x25519_mlkem1024:p384_mlkem768:mlkem768:mlkem512:mlkem1024
MinProtocol             = TLSv1.2
MaxProtocol             = TLSv1.3
SignatureAlgorithms     = ECDSA+SHA256:ECDSA+SHA384:RSA-PSS+SHA256:RSA-PSS+SHA384
[fips_ssl_sect]                                  #FIPS SECT
CipherString            = FIPS:@STRENGTH:!eNULL:!aNULL
CipherSuites            = TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256
Groups                  = P-256:P-384:P-521
MinProtocol             = TLSv1.2
MaxProtocol             = TLSv1.3
SignatureAlgorithms     = ECDSA+SHA256:ECDSA+SHA384:RSA-PSS+SHA256:RSA-PSS+SHA384
[oqs_ssl_sect]                           #OQSProvider TLS
CipherString            = AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DEFAULT:@STRENGTH:@SECLEVEL=2
CipherSuites            = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
Groups                  = x25519_mlkem768:x25519_mlkem1024:p384_mlkem768:mlkem768:mlkem512:mlkem1024
MinProtocol             = TLSv1.2
MaxProtocol             = TLSv1.3
Properties              = provider=oqsprovider
SignatureAlgorithms     = mldsa44_ed25519:mldsa44_rsa2048:/mldsa65:mldsa65_p256:mldsa65_bp256:mldsa87_bp384:mldsa65_ed25519:mldsa87_ed448:mldsa44_pss2048:mldsa65_pss3072:mldsa65_rsa3072:/mldsa87:p384_mldsa65:p521_mldsa87:mldsa87_p384:/rsa3072_mldsa44:rsa3072_sphincssha2128fsimple:rsa3072_sphincssha2128ssimple:/sphincssha2128fsimple:sphincssha2128ssimple:p256_sphincssha2128fsimple:p256_sphincssha2128ssimple:/sphincssha2192fsimple:sphincssha2192ssimple:/sphincssha2256fsimple:sphincssha2256ssimple:/p384_sphincssha2192fsimple:p384_sphincssha2192ssimple:/p521_sphincssha2256fsimple:p521_sphincssha2256ssimple:/sphincsshake128fsimple:sphincsshake128ssimple:/sphincsshake192fsimple:sphincsshake192ssimple:/sphincsshake256fsimple:sphincsshake256ssimple:/p256_mayo1:p256_mayo2:p256_mldsa44:p256_falcon512:p256_falconpadded512:p256_sphincsshake128fsimple:p256_sphincsshake128ssimple:/p384_sphincsshake192fsimple:p384_sphincsshake192ssimple:/p521_sphincsshake256fsimple:p521_sphincsshake256ssimple:/rsa3072_sphincsshake128fsimple:rsa3072_sphincsshake128ssimple:/lms_sha256_h10_w1:lms_sha256_h20_w4:lms_sha256_h25_w8:/xmss_sha256_h10:xmss_sha256_h16:xmss_sha256_h20:/xmss_sha512_h10:xmss_sha512_h16:xmss_sha512_h20:/xmss_shake128_h10:xmss_shake128_h16:xmss_shake128_h20:/xmss_shake256_h10:xmss_shake256_h16:xmss_shake256_h20:/xmssmt_sha2_20_2_256:xmssmt_sha2_40_2_256:xmssmt_sha2_60_3_256:/mayo1:mayo2:mayo3:mayo5:/p384_mayo3:/p521_mayo5:/crossrsdp128balanced:crossrsdp128fast:crossrsdp128small:/crossrsdp192balanced:crossrsdp192fast:crossrsdp192small:/crossrsdp256small:/crossrsdpg128balanced:crossrsdpg128fast:crossrsdpg128small:/crossrsdpg192balanced:crossrsdpg192fast:crossrsdpg192small:/crossrsdpg256balanced:crossrsdpg256fast:crossrsdpg256small
[tpm2_ssl_sect]
CipherString        = DEFAULT:@SECLEVEL=2
CipherSuites        = TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256
Groups              = P-256:P-384:P-521:X25519:X448
MinProtocol         = TLSv1.2
MaxProtocol         = TLSv1.3
Properties          = provider=tpm2
SignatureAlgorithms = RSA-PSS+SHA256:ECDSA+SHA256
                        .include /etc/ssl/profiles/oid.cnf
                        .include /etc/ssl/profiles/algos/default_algos.cnf
                        .include /etc/ssl/profiles/algos/legacy_algos.cnf
[random]
random = CTR-DRBG           # or HASH-DRBG, HMAC-DRBG
cipher = AES-256-CTR        # Only for CTR-DRBG; default is AES-256-CTR
digest = SHA256             # Only for HASH-DRBG or HMAC-DRBG
seed = JITTER             # Or another source, e.g., rdrand, if available

[ ca ]                                           #CA Sect
default_ca	            = CA_default
[ CA_default ]
dir                     = /etc/pki/qompass-ca
certs		            = $dir/certs
crl_dir		            = $dir/crl
database	            = $dir/index.txt
serial		            = $dir/serial
crlnumber	            = $dir/crlnumber
new_certs_dir	        = $dir/newcerts
x509_extensions	        = usr_cert
name_opt 	            = ca_default
cert_opt 	            = ca_default
certificate	            = $dir/cacert.pem
default_days	        = 365
default_crl_days        = 30
default_md	            = sha256
preserve	            = yes
policy                  = policy_loose
[ policy_match ]        # Policy Match
countryName		        = match
stateOrProvinceName	    = match
organizationName	    = match
organizationalUnitName	= optional
commonName		        = supplied
emailAddress		    = optional
[ policy_loose ]
countryName             = optional
stateOrProvinceName     = optional
organizationName        = optional
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional
####################################################################
[ req ]
attributes		        = req_attributes
default_bits		    = 3072
default_md              = sha256
default_keyalg          = EC
default_keyfile         = privkey.pem
distinguished_name      = dn
prompt                  = no
req_extensions          = v3_req
x509_extensions         = v3_req
string_mask             = utf8only

[dn]                                             #Designated Name
C                       = US
ST                      = Washington
L                       = Spokane
O                       = Qompass AI
OU                      = Security
CN                      = qompass.ai
emailAddress            = map@qompass.ai

[ req_attributes ]

[ usr_cert ]
1.3.6.1.5.5.7.1.24      = DER:30:03:02:01:05

[alt_names]
DNS.1                   = qompass.ai
DNS.2                   = www.qompass.ai
DNS.3                   = api.qompass.ai
[ client_cert ]
basicConstraints        = CA:FALSE
nsCertType              = client, email
keyUsage                = critical, nonRepudiation, digitalSignature, keyEncipherment
extendedKeyUsage        = clientAuth, emailProtection
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid,issuer
[ ocsp ]
basicConstraints = CA:FALSE
keyUsage = critical, digitalSignature
extendedKeyUsage = critical, OCSPSigning
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer
[ req_attributes ]
challengePassword = A challenge password
unstructuredName = An optional company name
[ server_cert ]
basicConstraints        = CA:FALSE
keyUsage                = critical, digitalSignature, keyEncipherment
extendedKeyUsage        = critical, serverAuth, clientAuth
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid,issuer
authorityInfoAccess     = OCSP;URI:http://ocsp.qompass.ai
crlDistributionPoints   = URI:http://crl.qompass.ai/qompass.crl
1.3.6.1.5.5.7.1.24      = DER:30:03:02:01:05
[ crl_ext ]
authorityKeyIdentifier  = keyid:always
[ proxy_cert_ext ]
basicConstraints        = critical,CA:FALSE
keyUsage                = critical, digitalSignature, keyEncipherment
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid,issuer
proxyCertInfo           = critical,language:id-ppl-anyLanguage,pathlen:0,policy:foo
[ tsa ]
[ tsa_config1 ]
dir                     = /etc/pki/qompass-ca
serial                  = $dir/tsaserial
crypto_device           = builtin
signer_cert             = $dir/tsacert.pem
certs                   = $dir/cacert.pem
signer_key              = $dir/private/tsakey.pem
signer_digest           = sha256
default_policy          = tsa_policy1
other_policies          = tsa_policy2, tsa_policy3
digests                 = sha256, sha384, sha512
accuracy                = secs:1, millisecs:500, microsecs:100
clock_precision_digits  = 0
ordering                = yes
tsa_name                = yes
ess_cert_id_chain       = no
ess_cert_id_alg         = sha256
[ v3_ca ]                                        #V3_CA
basicConstraints        = critical,CA:true,pathlen:0
keyUsage                = critical,keyCertSign,cRLSign
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid:always,issuer
authorityInfoAccess     = OCSP;URI:http://ocsp.qompass.ai
crlDistributionPoints   = URI:http://crl.qompass.ai/qompass.crl
[ v3_req ]
basicConstraints = CA:FALSE
keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth, clientAuth
subjectKeyIdentifier = hash
subjectAltName = @alt_names
[ v3_tsacert ]                                  #V3 TSACERT
basicConstraints        = critical, CA:false
keyUsage                = critical, digitalSignature, nonRepudiation
extendedKeyUsage        = critical, timeStamping
subjectKeyIdentifier    = hash
authorityKeyIdentifier  = keyid,issuer
policyIdentifier        = tsa_cert_policy
