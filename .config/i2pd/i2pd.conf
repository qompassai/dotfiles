# tunconf = /var/lib/i2pd/tunnels.conf
# tunnelsdir = /var/lib/i2pd/tunnels.d
# certsdir = /var/lib/i2pd/certificates
# pidfile = /run/i2pd/i2pd.pid
logfile = /var/log/i2pd/i2pd.log
logclftime = true
daemon = true
# family =
# ifname =
# ifname4 =
# ifname6 =
# address4 =
# address6 =
# host = 1.2.3.4
# port = 4567
ipv4 = true
ipv6 = true
bandwidth = L
share = 100
notransit = true
floodfill = true
[ntcp2]
enabled = true
 published = true
port = 4567
[ssu2]
enabled = true
published = true
port = 4567

[http]
enabled = true
address = 127.0.0.1
port = 7070
webroot = /
auth = true
user = i2pd
pass = changeme
lang = english

[httpproxy]
enabled = true
address = 127.0.0.1
port = 4444
keys = http-proxy-keys.dat
addresshelper = true
outproxy = http://false.i2p

[socksproxy]
enabled = true
address = 127.0.0.1
port = 4447
keys = socks-proxy-keys.dat
outproxy.enabled = false
outproxy = 127.0.0.1
outproxyport = 9050

[sam]
enabled = false
address = 127.0.0.1
port = 7656
portudp = 7655
[bob]
enabled = false
address = 127.0.0.1
port = 2827
[i2cp]
enabled = false
address = 127.0.0.1
port = 7654

[i2pcontrol]
enabled = false
address = 127.0.0.1
port = 7650
password = itoopie

[precomputation]
elgamal = true

[upnp]
enabled = false
name = I2Pd

[meshnets]
yggdrasil = false
yggaddress =

[reseed]
verify = true
# urls = https://reseed.i2p-projekt.de/,https://i2p.mooo.com/netDb/,https://netdb.i2p2.no/
# yggurls = http://[324:71e:281a:9ed3::ace]:7070/
# file = /path/to/i2pseeds.su3
# file = https://legit-website.com/i2pseeds.su3
# zipfile = /path/to/netDb.zip
# threshold = 25

[addressbook]
defaulturl = http://shx5vqsw7usdaunyzr2qmes2fq37oumybpudrd4jjj4e4vk4uusa.b32.i2p/hosts.txt
subscriptions = http://reg.i2p/hosts.txt,http://identiguy.i2p/hosts.txt,http://stats.i2p/cgi-bin/newhosts.txt
[limits]
transittunnels = 5000
openfiles = 0
coresize = 0

[trust]
enabled = true
family = MyFamily
# routers =
hidden = true

[exploratory]
inbound.length = 2
inbound.quantity = 3
outbound.length = 2
outbound.quantity = 3

[persist]
profiles = true
addressbook = true

