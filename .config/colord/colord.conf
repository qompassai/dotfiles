#!/qompassai/dotfiles/.config/colord/colord.conf
# Qompass AI Colord Config
# Copyright (C) 2026 Qompass AI, All rights reserved
####################################################
# https://wiki.archlinux.org/title/ICC_profiles
[colord]
cache-size=32
database-backend=sqlite
debug=false
DisableAutomation=true
EnableNoSensorProfile=false
profile-path=/var/lib/colord/icc
run-service=true
Scope=user # system | user

[Match]
#VendorID=0x0000
#ModelID=0x0000

[Permissions]
AllowSystemProfiles=false
AllowUserProfiles=true

# sudo systemctl mask colord.service
# sudo systemctl stop colord.service
