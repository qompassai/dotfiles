####################################################
rc_parallel="NO"
rc_interactive="YES"
#rc_shell=/bin/sh
#rc_depend_strict="YES"
rc_logger="YES"
rc_log_path="/var/log/rc.log"
rc_verbose=no
#rc_env_allow=""
rc_start_wait=100
rc_nostop=""
rc_crashed_stop=NO
rc_crashed_start=YES
rc_nocolor=NO
unicode="YES"
rc_fuser_timeout=60
extra_net_fs_list="fuse fuse.glusterfs fuse.sshfs gfs glusterfs nfs4 ocfs2 shfs smbfs"
export SSD_NICELEVEL="0"
export SSD_OOM_SCORE_ADJ="0"
rc_ulimit="-u 30"
rc_config="$XDG_CONFIG_HOME/openrc/rc.conf"
rc_need="openvpn"
#rc_use="net.eth0"
rc_after="clock"
rc_before="local"
rc_provide="!net"
#rc_foo_config="/etc/foo"
#rc_foo_need="openvpn"
#rc_foo_after="clock"
#rc_foo_bar_config="/etc/foo-bar"
#rc_foo_bar_need="openvpn"
#rc_foo_bar_after="clock"
rc_net_tap0_provide="!net"
rc_sys=""
rc_default_runlevel="default"
rc_tty_number=12
rc_cgroup_mode="unified"
#rc_cgroup_controllers=""
#rc_cgroup_settings="
#memory.max 10485760
#pids.max max
rc_cgroup_settings=""
rc_controller_cgroups="YES"
rc_cgroup_memory_use_hierarchy="NO"
rc_cgroup_blkio=""
rc_cgroup_cpu=""
rc_cgroup_cpuacct=""
rc_cgroup_cpuset=""
rc_cgroup_devices=""
rc_cgroup_hugetlb=""
rc_cgroup_memory=""
rc_cgroup_net_cls=""
rc_cgroup_net_prio=""
rc_cgroup_pids=""
 rc_cgroup_cleanup="NO"
rc_send_sighup="NO"
rc_timeout_stopsec="90"
rc_send_sigkill="YES"
