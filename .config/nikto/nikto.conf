CLIOPTS=-g -a
SKIPPORTS=21 111
 # @VERSION 	- Nikto version
 # @TESTID 	- Test identifier
 # @EVASIONS 	- List of active evasions
USERAGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/74.0.3729.169 Safari/537.36
RFIURL=http://cirt.net/public/rfiinc.txt
#SKIPIDS=
NIKTODTD=docs/nikto.dtd
DEFAULTHTTPVER=1.1
UPDATES=yes
MAX_WARN=20
PROMPTS=yes
CIRT=107.170.99.251
#PROXYHOST=127.0.0.1
#PROXYPORT=
#PROXYUSER=
#PROXYPASS=
#STATIC-COOKIE=";
CHECKMETHODS=GET
# EXECDIR=/opt/nikto
# PLUGINDIR=/opt/nikto/plugins
# DBDIR=/opt/nikto/databases
# TEMPLATEDIR=/opt/nikto/templates
# DOCDIR=/opt/nikto/docs
@@EXTRAS=dictionary;siebel;embedded
@@DEFAULT=@@ALL;-@@EXTRAS;tests(report:500)
LW_SSL_ENGINE=auto
FAILURES=20
CHECK6HOST=ipv6.google.com
CHECK6PORT=443
