# /qompassai/dotfiles/.config/mautrix-googlechat/config.yaml
# Qompass AI Mautrix-GoogleChat Config
# Copyright (C) 2025 Qompass AI, All rights reserved
# References: https://github.com/devture/matrix-synapse-shared-secret-auth | https://magicstack.github.io/asyncpg/current/api/index.html#asyncpg.pool.create_pool | https://docs.python.org/3/library/sqlite3.html#sqlite3.connect | https://docs.mau.fi/bridges/general/end-to-bridge-encryption.html | https://spec.matrix.org/v1.3/client-server-api/#mroomencryption | https://docs.python.org/3.6/library/logging.config.html#configuration-dictionary-schema

homeserver:
    address: https://example.com
    domain: example.com
    verify_ssl: true
    software: standard
    http_retry_count: 4
    status_endpoint: null
    message_send_checkpoint_endpoint: null
    async_media: false
appservice:
    address: http://localhost:29320
    hostname: 0.0.0.0
    port: 29320
    max_body_size: 1
    #   SQLite:   sqlite:filename.db
    #   Postgres: postgres://username:password@hostname/dbname
    database: postgres://username:password@hostname/db
      database_opts:
        min_size: 1
        max_size: 10
    id: googlechat
    bot_username: googlechatbot
    bot_displayname: Google Chat bridge bot
    bot_avatar: mxc://maunium.net/BDIWAQcbpPGASPUUBuEGWXnQ
    ephemeral_events: true
    as_token: "This value is generated when generating the registration"
    hs_token: "This value is generated when generating the registration"

metrics:
    enabled: false
    listen_port: 8000
manhole:
    enabled: false
    path: /var/tmp/mautrix-googlechat.manhole
    whitelist:
    - 0
bridge:
    username_template: "googlechat_{userid}"
    displayname_template: "{full_name} (Google Chat)"
    command_prefix: "!gc"

    initial_chat_sync: 10
    invite_own_puppet_to_pm: false
    sync_with_custom_puppets: false
    sync_direct_chat_list: false
    double_puppet_server_map:
        example.com: https://example.com
    double_puppet_allow_discovery: false

    login_shared_secret_map:
        example.com: foobar
    update_avatar_initial_sync: true
    #
    encryption:
        allow: false
        default: false
        appservice: false
        require: false
        allow_key_sharing: false
        delete_keys:
            delete_outbound_on_ack: false
            dont_store_outbound: false
            ratchet_on_decrypt: false
            delete_fully_used_on_decrypt: false
            delete_prev_on_new_session: false
            delete_on_device_delete: false
            periodically_delete_expired: false
            delete_outdated_inbound: false
        verification_levels:
            receive: unverified
            send: unverified
            share: cross-signed-tofu
        rotation:
            enable_custom: false
            milliseconds: 604800000
            messages: 100
            disable_device_change_key_rotation: false
    delivery_receipts: false
    delivery_error_reports: true
    message_status_events: false
    federate_rooms: true
    backfill:
        invite_own_puppet: true
        initial_thread_limit: 10
        initial_thread_reply_limit: 500
        initial_nonthread_limit: 100
        missed_event_limit: 5000
        missed_event_page_size: 100
        disable_notifications: false

    resend_bridge_info: false
    unimportant_bridge_notices: false
    disable_bridge_notices: false
    private_chat_portal_meta: default
    provisioning:
        prefix: /_matrix/provision
        shared_secret: generate
    permissions:
        "example.com": "user"
        "@admin:example.com": "admin"
logging:
    version: 1
    formatters:
        colored:
            (): mautrix_googlechat.util.ColorFormatter
            format: "[%(asctime)s] [%(levelname)s@%(name)s] %(message)s"
        normal:
            format: "[%(asctime)s] [%(levelname)s@%(name)s] %(message)s"
    handlers:
        file:
            class: logging.handlers.RotatingFileHandler
            formatter: normal
            filename: /var/log/mautrix-googlechat/googlechat.log
            maxBytes: 10485760
            backupCount: 10
        console:
            class: logging.StreamHandler
            formatter: colored
    loggers:
        mau:
            level: DEBUG
        maugclib:
            level: INFO
        aiohttp:
            level: INFO
    root:
        level: DEBUG
        handlers: [file, console]
