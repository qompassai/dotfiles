###########################################################################
# Reference: https://docs.pipewire.org/page_man_pipewire_conf_5.html

context.objects = [
    { factory = adapter
        args = {
            audio.position                                 = [ FL FR ]
            factory.name                                   = support.null-audio-sink
            media.class                                    = Audio/Duplex
            node.description                               = "AudioRelay Mic&Sink"
            node.name                                      = audiorelay-virtual-mic-sink
        }
    }
    { factory = spa-node-factory
        args = {
            clock.interface                                = eth0
            clock.name                                     = clock.system.ptp0
            node.group                                     = pipewire.ptp0
            node.name                                      = PTP0-Driver
            object.export                                  = true
            priority.driver                                = 100000
            resync.ms                                      = 1.5
            factory.name                                   = support.node.driver
        }
    }
]

context.modules = [
    { name                                                 = libpipewire-module-rt
        flags                                              = [ ifexists nofail ]
        args  = {
            nice.level                                     = -11
            rt.prio                                        = 98
            rt.time.hard                                   = -1
            rt.time.soft                                   = -1
        }
        condition = [ { module.rt = !false } ]
    }
    { name = libpipewire-module-filter-chain
        args = {
            capture.props = {
                audio.allowed-rates  = [ 44100 48000 ]
                audio.channels       = 2
                audio.position       = [ FL FR ]
                device.api                                 = dsp
                device.icon-name                           = audio-speakers
                media.class                                = Audio/Sink
                node.name            = audio_effect.convolver
                node.virtual         = false
                priority.session     = 850
                state.default-volume = 0.343
            }
            filter.graph = {
                capture.volumes = [
                    { control = "ell:volume"  max = 0.0  min = -42.5  scale = cubic }
                    { control = "elr:volume"  max = 0.0  min = -42.5  scale = cubic }
                ]
                inputs  = [ "bassex:in_l" "bassex:in_r" ]
                links = [
                    { output = "bassex:out_l"    input = "ell:in" }
                    { output = "bassex:out_r"    input = "elr:in" }
                    { output = "convL:Out"       input = "woofer_bp:in_l" }
                    { output = "convR:Out"       input = "woofer_bp:in_r" }
                    { output = "ell:out"         input = "convL:In" }
                    { output = "elr:out"         input = "convR:In" }
                    { output = "woofer_bp:out_l" input = "woofer_lim:in_l" }
                    { output = "woofer_bp:out_r" input = "woofer_lim:in_r" }
                ]
                nodes = [
                    {
                        control = {
                            amt        = 1.45
                            blend      = 1.0
                            bypass     = 0
                            ceil       = 200.0
                            final_hp   = 120.0
                            floor      = 20.0
                            sat_second = 1.65
                            sat_third  = 2.20
                        }
                        name   = bassex
                        plugin = https://chadmed.au/bankstown
                        type   = lv2
                    }
                    {
                        config = {
                            channel                        = 0
                            filename = /usr/share/pipewire/pipewire.conf.d/gpd-pocket-4-mp-48k-l.wav
                            gain     = 1.0
                        }
                        label  = convolver
                        name   = convL
                        type   = builtin
                    }
                    {
                        config = {
                            channel  = 0
                            filename = /usr/share/pipewire/pipewire.conf.d/gpd-pocket-4-mp-48k-r.wav
                            gain     = 1.0
                        }
                        label  = convolver
                        name   = convR
                        type   = builtin
                    }
                    {
                        control = {
                            enabled                        = 1
                            fft     = 2
                            input   = 1.0
                        }
                        name   = ell
                        plugin = http://lsp-plug.in/plugins/lv2/loud_comp_mono
                        type   = lv2
                    }
                    {
                        control = {
                            enabled = 1
                            fft     = 2
                            input   = 1.0
                        }
                        name   = elr
                        plugin = http://lsp-plug.in/plugins/lv2/loud_comp_mono
                        type   = lv2
                    }
                    {
                        control = {
                            al_0  = 0.725
                            at_0  = 1.0
                            cbe_1 = 1
                            cbe_2 = 0
                            cbe_3 = 0
                            cbe_4 = 0
                            cbe_5 = 0
                            cbe_6 = 0
                            ce_0  = 1
                            ce_1  = 0
                            ce_2  = 0
                            ce_3  = 0
                            ce_4  = 0
                            ce_5  = 0
                            ce_6  = 0
                            cr_0  = 1.75
                            kn_0  = 0.125
                            mode  = 0
                            rt_0  = 100
                            sf_1  = 380.0
                            sla_0 = 5.0
                        }
                        name   = woofer_bp
                        plugin = http://lsp-plug.in/plugins/lv2/mb_compressor_stereo
                        type   = lv2
                    }
                    {
                        control = {
                            al  = 1.0
                            at  = 1.0
                            cr  = 15.0
                            kn  = 0.5
                            rt  = 100.0
                            sla = 5.0
                        }
                        name   = woofer_lim
                        plugin = http://lsp-plug.in/plugins/lv2/compressor_stereo
                        type   = lv2
                    }
                ]
                outputs = [ "woofer_lim:out_l" "woofer_lim:out_r" ]
            }
            media.name       = "GPD Pocket 4 Speakers"
            node.description = "GPD Pocket 4 Speakers"
            playback.props = {
                node.name    = effect_output.convolver
                node.passive = false
            }
        }
    }
    { name                                                 = libpipewire-module-access
        condition                                          = [ { module.access = !false } ]
    }
    { name = libpipewire-module-adapter
        condition = [ { module.adapter = !false } ]
    }
    { name = libpipewire-module-client-device
        condition = [ { module.client-device = !false } ]
    }
    { name = libpipewire-module-client-node
        condition = [ { module.client-node = !false } ]
    }
    { name = libpipewire-module-link-factory
        condition = [ { module.link-factory = !false } ]
    }
    { name = libpipewire-module-loopback
        args = {
            audio.position = [ FL FR ]
            capture.props  = {
                audio.channels   = 2
                audio.position   = [ FL FR ]
                audio.rate       = 44100
                media.class      = Audio/Sink
                node.description = "AudioRelay Speaker"
                node.latency     = 1024/48000
                node.name        = audiorelay_Speaker
                target.object    = ""
            }
            playback.props = {
                audio.channels   = 2
                audio.position   = [ FL FR ]
                audio.rate       = 44100
                media.class      = Audio/Source
                node.description = "Virtual Source"
                node.latency     = 1024/48000
                node.name        = audiorelay_source
                target.object    = ""
            }
        }
    }
    { name = libpipewire-module-metadata
        condition = [ { module.metadata = !false } ]
    }
    { name = libpipewire-module-portal
        flags     = [ ifexists nofail ]
        condition = [ { module.portal = !false } ]
    }
    { name = libpipewire-module-profiler
        condition = [ { module.profiler = !false } ]
    }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-raop-discover
        condition = [ { module.raop = !false } ]
    }
    { name = libpipewire-module-rtp-sap
        args = {
            local.ifname            = eth0
            net.loop                = false
            net.ttl                 = 32
            ptp.management-socket  = /var/run/ptp4lro
            sap.ip                  = 239.255.255.255
            sap.port                = 9875
            stream.rules = [
                {
                    matches = [ { rtp.session = "~.*" } ]
                    actions = {
                        create-stream = {
                            device.api        = aes67
                            media.class       = Audio/Source
                            node.group        = pipewire.ptp0
                            node.virtual      = false
                            sess.latency.msec = 3
                        }
                    }
                }
                {
                    matches = [ { sess.sap.announce = true } ]
                    actions = {
                        announce-stream = {}
                    }
                }
            ]
        }
    }
    { name = libpipewire-module-rtp-sink
        args = {
            audio.channels          = 2
            audio.format            = S24BE
            audio.rate              = 48000
            destination.ip          = 239.69.150.243
            destination.port        = 5004
            local.ifname            = eth0
            net.loop                = false
            net.mtu                 = 1280
            net.ttl                 = 32
            node.channel-names      = [ CH1 CH2 ]
            sess.latency.msec       = 3
            sess.max-ptime          = 1
            sess.media              = audio
            sess.min-ptime          = 1
            sess.name               = "PipeWire RTP stream"
            sess.ts-direct          = false
            sess.ts-offset          = 0
            sess.ts-refclk          = "ptp=traceable"
            stream.props = {
                device.api           = aes67
                media.class          = Audio/Sink
                node.always-process  = true
                node.group           = pipewire.ptp0
                node.name            = rtp-sink
                node.virtual         = false
                rtp.fetch-ts-refclk  = true
                rtp.ntp              = 0
                sess.sap.announce    = true
            }
        }
    }
    { name = libpipewire-module-spa-device-factory
        condition = [ { module.spa-device-factory = !false } ]
    }
    { name = libpipewire-module-spa-node-factory
        condition = [ { module.spa-node-factory = !false } ]
    }
]

