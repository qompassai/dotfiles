#########################################################################

alsa.rules = [
    {
        # DaVinci Resolve requests large ALSA buffers — 131072 bytes at 48kHz
        # stereo S32 = ~341ms, matching its internal engine latency requirement.
        matches = [ { application.process.binary = "resolve" } ]
        actions = {
            update-props = {
                alsa.buffer-bytes = 131072
            }
        }
    }
]
