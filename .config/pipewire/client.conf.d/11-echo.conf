# Reference: https://docs.pipewire.org/page_module_echo_cancel.html
context.modules                                            = [
  { name                                                   = libpipewire-module-echo-cancel
    args = {
      library.name                                         = aec/libspa-aec-webrtc
      aec.args = {
        analog_gain_control                                = false
        digital_gain_control                               = true
        agc_target_level                                   = 3
        agc_compression_gain                               = 9
        noise_suppression                                  = true
        extended_filter                                    = true
        delay_agnostic                                     = true
      }
      capture.props = {
        node.name                                          = echo-cancel-capture
        node.description                                   = "Echo Cancel Capture"
        audio.rate                                         = 48000
        audio.channels                                     = 2
        audio.position                                     = [
                             FL FR
                             ]
      }
      source.props = {
        node.name                                          = echo-cancel-source
        node.description                                   = "Echo Cancelled Mic"
      }
      sink.props = {
        node.name                                          = echo-cancel-sink
        node.description                                   = "Echo Cancel Sink"
        audio.rate                                         = 48000
        audio.channels                                     = 2
        audio.position                                     = [
                             FL FR
                             ]
      }
      playback.props = {
        node.name                                          = echo-cancel-playback
        node.description                                   = "Echo Cancel Playback"
      }
      monitor.mode                                         = false
    }
  }
]
