# Qompass AI PipeWire RNNoise Noise Cancellation Source
# Copyright (C) 2026 Qompass AI, All rights reserved
##########################################################################################################
# References: #   https://docs.pipewire.org/page_module_filter_chain.html |
# https://github.com/werman/noise-suppression-for-voice | https://manpages.opensuse.org/Tumbleweed/pipewire-modules-0_3/libpipewire-module-filter-chain.7.en.html
context.modules = [
    { name = libpipewire-module-filter-chain
        flags = [ nofail ]
        args = {
            audio.position                              = [ FL FR ]
            capture.props = {
                audio.rate                              = 48000
                node.name                               = effect_input.rnnoise
                node.passive                            = true
            }
            filter.graph = {
                nodes = [
                    {
                        control = {
                            "Retroactive VAD Grace (ms)"    = 0
                            "VAD Grace Period (ms)"         = 200
                            "VAD Threshold (%)"             = 90.0
                        }
                        label                               = noise_suppressor_mono
                        name    = rnnoise
                        plugin  = /usr/lib/ladspa/librnnoise_ladspa.so
                        type    = ladspa
                    }
                ]
            }
            media.name                                  = "Noise Canceling source"
            node.description                            = "Noise Canceling source"
            playback.props = {
                audio.rate                              = 48000
                media.class                             = Audio/Source
                node.name                               = effect_output.rnnoise
            }
        }
    }
]
