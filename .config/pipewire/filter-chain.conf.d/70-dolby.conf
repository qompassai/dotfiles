#########################################################################
context.modules = [
    { name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            capture.props = {
                audio.channels                             = 6
                audio.position                             = [ FL FR FC LFE SL SR ]
                media.class                                = Audio/Sink
                node.name                                  = effect_input.dolby_pro_logic_ii
            }
            filter.graph = {
                inputs  = [
                    "mixer_lt:In 1"
                    "mixer_rt:In 2"
                    "fc_copy:In"
                    "lfe_copy:In"
                    "sl_phased:In"
                    "sr_phased:In"
                ]
                links = [
                    { output = "fc_copy:Out"     input = "mixer_lt:In 3" }
                    { output = "fc_copy:Out"     input = "mixer_rt:In 3" }
                    { output = "lfe_copy:Out"    input = "mixer_lt:In 4" }
                    { output = "lfe_copy:Out"    input = "mixer_rt:In 4" }
                    { output = "sl_phased:Out"   input = "mixer_lt:In 5" }
                    { output = "sl_phased:Out"   input = "mixer_rt:In 5" }
                    { output = "sr_phased:Out"   input = "mixer_lt:In 6" }
                    { output = "sr_phased:Out"   input = "mixer_rt:In 6" }
                ]
                nodes = [
                    { label = copy  name = fc_copy   type = builtin }
                    { label = copy  name = lfe_copy  type = builtin }
                    {
                        control = {
                            "Gain 1"  = 1
                            "Gain 2"  = 0
                            "Gain 3"  = 0.7071067811865475
                            "Gain 4"  = 0.7071067811865475
                            "Gain 5"  = -0.8660254037844386
                            "Gain 6"  = -0.5
                        }
                        label   = mixer
                        name    = mixer_lt
                        type    = builtin
                    }
                    {
                        control = {
                            "Gain 1"  = 0
                            "Gain 2"  = 1
                            "Gain 3"  = 0.7071067811865475
                            "Gain 4"  = 0.7071067811865475
                            "Gain 5"  = 0.5
                            "Gain 6"  = 0.8660254037844386
                        }
                        label   = mixer
                        name    = mixer_rt
                        type    = builtin
                    }
                    {
                        config = {
                            filename  = /hilbert
                            length    = 90
                        }
                        label   = convolver
                        name    = sl_phased
                        type    = builtin
                    }
                    {
                        config = {
                            filename  = /hilbert
                            length    = 90
                        }
                        label   = convolver
                        name    = sr_phased
                        type    = builtin
                    }
                ]
                outputs = [ "mixer_lt:Out" "mixer_rt:Out" ]
            }
            media.name       = "Dolby Pro Logic II Sink"
            node.description = "Dolby Pro Logic II Sink"
            playback.props = {
                audio.channels  = 2
                audio.position  = [ FL FR ]
                node.name       = effect_output.dolby_pro_logic_ii
                node.passive    = true
            }
        }
    }
]

