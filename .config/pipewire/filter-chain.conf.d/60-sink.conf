# /qompassai/dotfiles/.config/pipewire/filter-chain.conf.d/60-sink.conf
# Qompass AI PipeWire LFE + FL/FR Mix Sinks
# Copyright (C) 2026 Qompass AI, All rights reserved
# References:
#   https://docs.pipewire.org/page_module_filter_chain.html
#########################################################################
context.modules = [
    { name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            capture.props = {
                audio.position                             = [ FL FR ]
                media.class                                = Audio/Sink
                node.name                                  = input_lfe
            }
            filter.graph = {
                inputs                                     = [ "copyIL:In" "copyIR:In" ]
                links = [
                    { output                               = "copyIL:Out"  input = "copyOL:In" }
                    { output                               = "copyIL:Out"  input = "mix:In 1" }
                    { output = "copyIR:Out"  input = "copyOR:In" }
                    { output = "copyIR:Out"  input = "mix:In 2" }
                    { output = "mix:Out"     input = "lpLFE:In" }
                ]
                nodes = [
                    { label = copy    name = copyIL  type = builtin }
                    { label = copy    name = copyIR  type = builtin }
                    { label = copy    name = copyOL  type = builtin }
                    { label = copy    name = copyOR  type = builtin }
                    {
                        control                            = { "Gain 1" = 0.5  "Gain 2" = 0.5 }
                        label                              = mixer
                        name                               = mix
                        type    = builtin
                    }
                    {
                        control = { "Freq" = 150.0 }
                        label   = bq_lowpass
                        name    = lpLFE
                        type    = builtin
                    }
                ]
                outputs = [ "copyOL:Out" "copyOR:Out" "lpLFE:Out" ]
            }
            media.name       = "LFE"
            node.description = "LFE"
            playback.props = {
                audio.position    = [ FL FR LFE ]
                node.name         = output_lfe
                node.passive      = true
                stream.dont-remix = true
            }
        }
    }

    # ── Mix Sink — FL+FR stereo in, summed mono FL out ───────────────────
    { name  = libpipewire-module-filter-chain
        flags = [ nofail ]
        args  = {
            capture.props = {
                audio.position  = [ FL FR ]
                media.class     = Audio/Sink
                node.name       = mix_input.mix-FL-FR-to-FL
            }
            filter.graph = {
                inputs  = [ "mix:In 1" "mix:In 2" ]
                nodes = [
                    {
                        control = { "Gain 1" = 0.5  "Gain 2" = 0.5 }
                        label   = mixer
                        name    = mix
                        type    = builtin
                    }
                ]
                outputs = [ "mix:Out" ]
            }
            media.name       = "Mix"
            node.description = "Mix"
            playback.props = {
                audio.position    = [ FL ]
                node.name         = mix_output.mix-FL-FR-to-FL
                node.passive      = true
                stream.dont-remix = true
            }
        }
    }
]

