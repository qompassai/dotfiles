# /qompassai/rust/cargo/config.toml
# Qompass AI Cargo Config
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
[alias]
b = "build"
c = "check"
r = "run"
rr = "run --release"
t = "test"
zig-x86_64-r = "zigbuild --release --target x86_64-unknown-linux-gnu"
zig-aarch64-r = "zigbuild --release --target aarch64-unknown-linux-gnu"
zig-aarch64-t = "zigbuild test --target aarch64-unknown-linux-gnu"
zigrun-aarch64 = "zigbuild run --target aarch64-unknown-linux-gnu"

[build]
build-dir = "target"
jobs = 4
incremental = true
rustc = "rustc"
rustc-wrapper = "sccache"
rustdoc = "rustdoc"
rustflags = ["-C", "target-cpu=native"]
target = "triple"
target-dir = "target"

[cache]
auto-clean-frequency = "1 day" 

[cargo-new]
vcs = "git"

[env]
SCCACHE_DIR = "/home/phaedrus/.cache/sccache"
SCCACHE_IDLE_TIMEOUT = "1200"
CARGO_INCREMENTAL = "0"
ZIG_GLOBAL_CACHE_DIR = "/home/phaedrus/.cache/zig"

[future-incompat-report]
frequency = 'always'

[http]
debug = false
timeout = 60
ssl-version = "tlsv1.3"
ssl-version.max = "tlsv1.3"

[net]
retry = 3
git-fetch-with-cli = true
offline = false

[registries.crates-io]
protocol = "sparse"

[resolver]
incompatible-rust-versions = "allow"

[target.aarch64-apple-darwin]
linker = "zig cc -target aarch64-macos-gnu"
runner = "…"
rustflags = ["…", "…"]

[target.x86_64-unknown-linux-gnu]
linker = "zig cc -target x86_64-linux-gnu"
runner = "…"
rustflags = ["…", "…"]

[target.aarch64-unknown-linux-gnu]
linker = "zig cc -target aarch64-linux-gnu"
runner = "…"
rustflags = ["-C", "link-arg=-target=aarch64-linux-gnu"]

[target.x86_64-apple-darwin]
linker = "zig cc -target x86_64-macos-gnu"
runner = "…"
rustflags = ["…", "…"]

[target.nvptx64-nvidia-cuda]
linker = "ptx-linker"
runner = "…"
rustflags = ["…", "…"]

[target.x86_64-unknown-linux-musl]
linker = "zig cc -target x86_64-linux-musl"

[target.x86_64-pc-windows-gnu]
linker = "zig cc -target x86_64-windows-gnu"
runner = "…"
rustflags = ["…", "…"]

[term]
color = 'auto'
hyperlinks = true
progress.term-integration = true
progress.when = 'auto'
progress.width = 80
unicode = true
verbose = true
quiet = false
