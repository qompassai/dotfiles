[exportd]
cache-use-ipaddr=n
debug="all|auth|call|general|parse"
manage-gids=n
state-directory-path=/var/lib/nfs
threads=4
ttl=1800
[exports]
rootdir=/export
all_squash=1
fsid=0
[exportfs]
debug=4

[general]
pipefs-directory=/var/lib/nfs/rpc_pipefs

[gssd]
allowed-enctypes=aes256-cts-hmac-sha384-192,aes128-cts-hmac-sha256-128,camellia256-cts-cmac,camellia128-cts-cmac,aes256-cts-hmac-sha1-96,aes128-cts-hmac-sha1-96
avoid-dns=1
cancel-timed-out-upcalls=1
context-timeout=60
cred-cache-directory=/tmp/krb5cc
keytab-file=/etc/krb5.keytab
limit-to-legacy-enctypes=0
preferred-realm=EXAMPLE.COM
rpc-timeout=10
rpc-verbosity=2
set-home=1
upcall-timeout=60
use-gss-proxy=1
use-machine-creds=1
use-memcache=1
verbosity=2

[lockd]
port=32803
udp-port=32769

[mountd]
cache-use-ipaddr=y
debug="all"
descriptors=4096
ha-callout=/usr/sbin/ha-callout.sh
manage-gids=y
port=20048
reverse-lookup=y
state-directory-path=/var/lib/nfs
threads=8
ttl=3600

[nfs4]
grace-period=90
lease-time=120

[nfsd]
debug=1
grace-time=180
host=
port=2049
rdma=y
rdma-port=20049
tcp=y
threads=128
udp=y
vers2=y
vers3=y
vers4=y
vers4.0=y
vers4.1=y
vers4.2=y

[nfsdcld]
debug=1
storagedir=/var/lib/nfs/nfsdcld

[nfsrahead]
nfs=65536
nfs4=65536

[sm-notify]
debug=1
force=1
lift-grace=y
outgoing-addr=192.0.2.10
outgoing-port=4000
retry-time=600

[statd]
debug=1
ha-callout=/usr/sbin/statd_ha_callout.sh
name=nfsstatd
no-notify=0
outgoing-port=4000
port=4000
state-directory-path=/var/lib/nfs/statd

[svcgssd]
# principal=nfs/server.example.com@EXAMPLE.COM
