####################################################
RIGHT seek +10
LEFT seek -10
DOWN seek -60
UP seek +60
PGUP seek 600
PGDWN seek -600
m mute
switch_audio
+ audio_delay 0.100
= audio_delay 0.100
- audio_delay -0.100
[ speed_mult 0.9091	
] speed_mult 1.1
{ speed_mult 0.5
} speed_mult 2.0
BS speed_set 1.0
q quit
ESC quit
ENTER pt_step 1 1
p pause
. frame_step
SPACE pause
HOME pt_up_step 1
END pt_up_step -1
> pt_step 1
< pt_step -1
INS alt_src_step 1
DEL alt_src_step -1
o osd
I osd_show_property_text "${filename}"
P osd_show_progression
z sub_delay -0.1
x sub_delay +0.1
9 volume -1
/ volume -1
0 volume 1
* volume 1
1 contrast -1
2 contrast 1
3 brightness -1
4 brightness 1
5 hue -1
6 hue 1
7 saturation -1
8 saturation 1
( balance -0.1
) balance +0.1
d frame_drop
D step_property deinterlace
r sub_pos -1
t sub_pos +1
#? sub_step +1	
#? sub_step -1
#? sub_scale +0.1
#? sub_scale -0.1
f vo_fullscreen
T vo_ontop
w panscan -0.1
e panscan +0.1
c capturing
s screenshot
h tv_step_channel 1
l tv_step_channel -1
n tv_step_norm
b tv_step_chanlist
JOY_RIGHT seek 10
JOY_LEFT seek -10
JOY_UP seek 60
JOY_DOWN seek -60
JOY_BTN0 pause
JOY_BTN1 osd
JOY_BTN2 volume 1
JOY_BTN3 volume -1
JOY_BTN4 set_menu main
AR_PLAY pause
AR_PLAY_HOLD quit
AR_NEXT seek 30
AR_NEXT_HOLD seek 120
AR_PREV seek -10
AR_PREV_HOLD seek -120
AR_MENU menu up
#AR_MENU menu cancel
AR_MENU_HOLD mute
AR_VUP volume 1
AR_VDOWN volume -1
y menu down
y menu ok
y menu cancel
y menu hide
y set_menu general_pref
UP    {dvdnav} dvdnav up
DOWN  {dvdnav} dvdnav down
LEFT  {dvdnav} dvdnav left
RIGHT {dvdnav} dvdnav right
ESC   {dvdnav} dvdnav menu
ENTER {dvdnav} dvdnav select
BS    {dvdnav} dvdnav prev
AR_VUP    {dvdnav} dvdnav up
AR_VDOWN  {dvdnav} dvdnav down
AR_PREV   {dvdnav} dvdnav left
AR_NEXT   {dvdnav} dvdnav right
AR_MENU   {dvdnav} dvdnav menu
AR_PLAY   {dvdnav} dvdnav select
? seek_chapter -1
? seek_chapter +1
F1 seek 10 1
F2 seek 20 1
F3 seek 30 1
F4 seek 40 1
F5 seek 50 1
F6 seek 60 1
F7 seek 70 1
F8 seek 80 1
F9 seek 90 1

CTRL-. osd_show_property_text "Playing: ${filename}"
