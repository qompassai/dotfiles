# /qompassai/dotfiles/.config/mplayer/mplayer.conf
# Qompass AI MPlayer Config
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
vo=xv
vo = sdl:aalib
fbmode = 640x480-120
fbmodeconfig = /etc/fb.modes
monitor-hfreq = 31.5k-50k,70k
monitor-vfreq = 50-90
monitor-dotclock = 30M-300M
fs=yes
vm=yes
bpp=0
zoom=yes
#monitoraspect=4:3
#monitoraspect=16:9
#ontop=yes
ao=oss
ao = sdl:esd
mixer = /dev/mixer
#af=lavcresample=44100
ao=alsa:device=spdif
ac=hwac3,hwdts,hwmpa,
user-agent=NSPlayer/4.1.0.3856
user-agent="QuickTime"
user-agent=RMA/1.0
bandwidth=2000000
user-agent="Winamp NSV Player/5.12 (ultravox/2.0)"
framedrop = yes
skin = Abyss
ffactor = 0.75
cache = 8192
cache-min = 20.0
cache-seek-min = 50
slang = en
alang = en
[protocol.dvdnav]
vc=ffmpeg12,
mouse-movements=yes
nocache=yes
[vo.vdpau]
vc=ffmpeg2vdpau,ffwmv3vdpau,ffvc1vdpau,ffh264vdpau,ffodivxvdpau,
vf-clr=yes
progbar-align=50
