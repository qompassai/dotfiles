charon {
    filelog {
        /var/log/charon.log {
            default = 2 
            ike = 2
            knl = 2
            cfg = 2
            mgr = 2
            enc = 2
            job = 2
            net = 2
            asn = 1
            append = yes
            flush_line = yes
            ike_name = yes
            json = yes               
            log_level = yes
            path = /var/log/charon.log
            time_format = %Y-%m-%d %H:%M:%S 
            time_precision = ms
        }
    }
    syslog {
        identifier = charon
        daemon {
            default = 1
            ike_name = yes
            log_level = yes
            map_level = -1
        }
    }
}

