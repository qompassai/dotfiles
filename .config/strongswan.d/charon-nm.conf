charon-nm {
    # ca_dir = <default>
    install_virtual_ip_on = lo
    mtu = 1400
    port = 0
    port_nat_t = 0
    retransmit_base = 1.4
    retransmit_timeout = 2.0
    retransmit_tries = 3
    routing_table = 210
    routing_table_prio = 210
    plugins {
        kernel-netlink {
            fwmark = !210
        }
        socket-default {
            fwmark = 210
        }
    }
    syslog {
        daemon {
            default = 1
        }
    }
}
