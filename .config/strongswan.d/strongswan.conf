# strongswan.conf - strongSwan configuration with OpenSSL 3.5.0 PQC support
# Updated: April 16, 2025

charon {
    load_modular = yes

    # Prefer configured proposals over received ones
    prefer_configured_proposals = yes

    # Enable crypto offloading to OpenSSL
    crypto_test {
        required = no
        on_add = yes
    }

    # Define post-quantum proposals
    proposal_pqc = yes

    # Default IKE proposals with post-quantum algorithms
    ike_proposals {
        # Hybrid proposal with X25519 and ML-KEM-768 (OpenSSL 3.5.0 PQC)
        pqc_hybrid = "X25519MLKEM768-aes256gcm16-prfsha384-prfsha256"

        # Traditional fallback proposals
        traditional = "aes256gcm16-prfsha384-ecp384,aes256gcm16-prfsha256-ecp256"
    }

    # Default ESP proposals
    esp_proposals {
        # Strong AEAD ciphers
        default = "aes256gcm16-ecp384,aes256gcm16-ecp256"
    }

    plugins {
        include strongswan.d/charon/*.conf

        # OpenSSL plugin configuration
        openssl {
            # Enable OpenSSL 3.5.0 features
            engine_id = "default"
            load_ciphers = yes
            fips_mode = no

            # Enable post-quantum algorithms
            use_post_quantum = yes
        }
    }
}

libstrongswan {
    plugins {
        # Core crypto plugins
        aes {
            load = yes
        }
        curve25519 {
            load = yes
        }
        hmac {
            load = yes
        }
        kdf {
            load = yes
        }
        openssl {
            load = yes
        }
        pem {
            load = yes
        }
        sha1 {
            load = yes
        }
        sha2 {
            load = yes
        }
        x509 {
            load = yes
        }

        # Disable legacy stroke plugin
        stroke {
            load = no
        }
    }
}

# VICI interface configuration for swanctl
charon-systemd {
    load = yes
    start-scripts {
        creds = /usr/sbin/swanctl --load-creds
        conns = /usr/sbin/swanctl --load-conns
    }
}

vici {
    load = yes
    socket = unix:///var/run/charon.vici
}

# Include all other configuration files
include strongswan.d/*.conf
