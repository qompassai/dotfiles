modules_force_load: nvidia,nvidia_modeset,nvidia_uvm,nvidia_drm
modules: -*,btrfs,nvme
strip: true
compression: zstd
extra_files: /usr/bin/fsck,/sbin/btrfs
vconsole: true
enable_lvm: false
enable_mdraid: true
enable_zfs: true
