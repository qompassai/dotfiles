# /qompassai/dotfiles/.config/maldet/maldet.conf
# Qompass AI Maldet Config
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
[ General Options ]
email_alert="1"
email_addr="$(pass show maldet/email)"
email_ignore_clean="1"
email_panel_user_alerts="0"
email_panel_from="$(pass show maldet/email)"
email_panel_replyto="$(pass maldet/email)"
email_panel_alert_subj="maldet alert from $(hostname)"
slack_alert="0"
slack_subj="maldet alert from $(hostname)"
slack_token="$(pass show maldet/slack)"
slack_channels="maldetreports"
telegram_alert="0"
telegram_file_caption="maldet alert from $(hostname)"
telegram_bot_token="TELEGRAM_BOT_TOKEN"
telegram_channel_id="TELEGRAM_CHANNEL_ID"
autoupdate_signatures="1"
autoupdate_version="1"
autoupdate_version_hashed="1"
cron_prune_days="21"
cron_daily_scan="1"
import_config_url=""
import_config_expire="43200"
import_custsigs_md5_url=""
import_custsigs_hex_url=""
[ SCAN OPTIONS ]
scan_max_depth="15"
scan_min_filesize="24"
scan_max_filesize="2048k"
scan_hexdepth="65536"
scan_hexfifo="1"
scan_hexfifo_depth="524288"
scan_clamscan="1"
scan_tmpdir_paths="/tmp /var/tmp /dev/shm /var/fcgi_ipc"
scan_user_access="0"
scan_cpunice="19"
scan_ionice="6"
scan_cpulimit="0"
scan_ignore_root="1"
scan_ignore_user=""
scan_ignore_group=""
scan_find_timeout="0"
scan_export_filelist="0"
quarantine_hits="0"
quarantine_clean="0"
quarantine_suspend_user="0"
quarantine_suspend_user_minuid="500"
quarantine_on_error="1"
[ MONITORING OPTIONS ]
default_monitor_mode="users"
# default_monitor_mode="/etc/maldet/monitor_paths"
inotify_base_watches="16384"
inotify_sleep="15"
inotify_reloadtime="3600"
inotify_minuid="500"
inotify_docroot="public_html,public_ftp"
inotify_cpunice="18"
inotify_ionice="6"
inotify_cpulimit="0"
inotify_verbose="0"
scan_clamd_remote="0"
remote_clamd_config="/etc/clamd.d/clamd.remote.conf"
remote_clamd_max_retry="5"
remote_clamd_retry_sleep="3"
enable_statistic="0"
elk_host=""
elk_port=""
elk_index=""
string_length="150000"
