###################################################
daemon undervolt:once
daemon power
daemon tjoffset
enable yes
# hwphint force load:single:0.8 performance balance_performance
hwphint switch power:core:gt:8 performance balance_performance
interval 5000
power package 45 35
# power package 45/0.002 35/28
# power package 45/0.002:disabled 35/28:enabled
tjoffset -20
undervolt 0 'CPU' 0
undervolt 1 'GPU' 0
undervolt 2 'CPU Cache' 0
undervolt 3 'System Agent' 0
undervolt 4 'Analog I/O' 0
