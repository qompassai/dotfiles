#################################################
# Reference: https://arthurdejong.org/nss-pam-ldapd/nslcd.conf.5
base dc=example,dc=com
bind_timelimit 30
binddn cn=proxyuser,dc=example,dc=com
bindpw secret
#idle_timelimit 3600
idle_timelimit 3600
ldap_version 3
logsyslog yes
pagesize 1000
referrals off
ssl start_tls
threads 5
timelimit 30
uid nslcd
gid nslcd
uri ldap://127.0.0.1/
uri ldaps://127.0.0.1/
uri ldapi://%2fvar%2frun%2fldapi_sock/
serverhost ldap.example.com
reconnect_sleeptime 1
reconnect_retrytime 10
tls_cacertdir /etc/ssl/certs
tls_cacertfile /etc/ssl/ca.cert
tls_cert /etc/ssl/certs/ldap-client.pem
tls_checkpeer yes
tls_ciphers TLSv1
tls_crlcheck all
tls_key /etc/ssl/private/ldap-client.key
tls_randfile /var/run/egd-pool
tls_reqcert never
base group   ou=Groups,dc=example,dc=com
base passwd  ou=People,dc=example,dc=com
base shadow  ou=People,dc=example,dc=com
filter group  (objectClass=group)
filter passwd (objectClass=User)
filter passwd (&(objectClass=user)(!(objectClass=computer))(uidNumber=*)(unixHomeDirectory=*))
filter shadow (objectClass=User)
scope base
scope one
scope sub
scope group onelevel
scope hosts sub
filter shadow (&(objectClass=user)(!(objectClass=computer))(uidNumber=*)(unixHomeDirectory=*))
map group  gidNumber      objectSid:S-1-5-21-3623811015-3361044348-30300820
map group  member         posixMember
#map group  member         msSFU30PosixMember
#map group  uniqueMember   member
#map passwd gecos          displayName
#map passwd gecos          msSFUName
#map passwd gecos          sAMAccountName
#map passwd homeDirectory  msSFUHomeDirectory
#map passwd homeDirectory  msSFU30HomeDirectory
#map passwd homeDirectory  unixHomeDirectory
map passwd loginShell     "/bin/bash"
map passwd uid            cn
map passwd uid            msSFU30Name
map passwd uid            msSFUName
map passwd uid            sAMAccountName
map passwd uidNumber      objectSid:S-1-5-21-3623811015-3361044348-30300820
map passwd userPassword   msSFU30Password
map passwd userPassword   msSFUPassword
map shadow uid            msSFUName
map shadow uid            sAMAccountName
map shadow userPassword   msSFU30Password
map shadow userPassword   msSFUPassword
map shadow shadowLastChange pwdLastSet
pam_authc_search (uid=${user})
pam_authz_search (uid=${user})
pam_password md5
pam_password exop
pam_password crypt
pam_password clear
rootpwmoddn cn=admin,dc=example,dc=com
rootpwmodpw adminsecret
bind_timelimit 30
bindpwcmd "/usr/local/bin/getpw.sh"
cache credentials
krb5_ccname /tmp/krb5cc_%{uid}
nss_min_uid 1000
nss_enum_cache_timeout 3600
nss_initgroups_ignoreusers root,ldap
reconnect_maxsleeptime 300
sasl_mech DIGEST-MD5
sasl_realm EXAMPLE.COM
sasl_authcid binduser
sasl_authzid authorizationID
validnames /^[a-zA-Z0-9._-]+$/
reconnect_retrytime 10
idle_timelimit 3600
