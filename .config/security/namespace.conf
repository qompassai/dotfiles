/tmp        /tmp-inst/               level         root,wheel
/var/tmp    /var/tmp/tmp-inst/       level         root,wheel
$HOME/tmp   $HOME/.inst/tmp/         user          *
/home/$USER /home/.inst/$USER/       user          root,wheel
/run/user/$USER /run/inst/$USER/    user         *
$HOME/.cache $HOME/.inst/cache/      user         *
/secure     /secure-inst/            level         root,wheel
