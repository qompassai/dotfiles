defaults:
  - _self_
hydra:
  searchpath:
    - file://~/.config/hydra/conf
    - pkg://hydra.conf
  run:
    dir: ${oc.env:HOME}/.local/share/hydra/outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ${oc.env:HOME}/.local/share/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
    name: ${hydra.job.override_dirname}
