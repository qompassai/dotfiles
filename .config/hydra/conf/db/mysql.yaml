# @package _global_
database:
  driver: mysql
  host: localhost
  port: 3306
  name: myapp_db
  user: ${oc.env:MYSQL_USER,myapp_user}
  password: ${oc.env:MYSQL_PASSWORD,password}
  charset: utf8mb4
  pool_size: 10
  timeout: 30
