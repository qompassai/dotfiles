public_key: "rp-public-key"
secret_key: "rp-secret-key"
listen:
  - "[::]:9999"
verbosity: "Quiet"

peers:
  - public_key: "rp-peer-public-key"
    endpoint: "my-peer.test:9999"
    key_out: "rp-key-out"
    exchange_command:
      - wg
      - set
      - wg0
      - peer
      - "<PEER_ID>"
      - preshared-key
      - /dev/stdin

