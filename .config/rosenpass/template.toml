# Main server keys (replace with your own)
public_key = 'CHANGE-ME-rpk'
secret_key = 'CHANGE-ME-rsk'
# Listen address (default: all IPv6 on port 9999)
listen = ["[::]:9999"]
# Logging verbosity: Quiet | Info | Debug
verbosity = "Quiet"
# ---- Add your peers here ----
[[peers]]
public_key = 'peer1-rpk'
endpoint = 'peer1.example.com:9999'
key_out = '$XDG_RUNTIME_DIR/rosenpass/peer1.key'
allowed_ips = ['10.66.66.5/32', 'fd00:db8::5/128']
exchange_command = [
  'wg', 'set', 'peer1', 'peer', 'PEER1-WG-PUBLIC-KEY', 'preshared-key', '/dev/stdin'
]

[[peers]]
public_key = 'peer2-rpk'
endpoint = 'peer2.example.com:9999'
key_out = '$XDG_RUNTIME_DIR/rosenpass/peer2.key'
allowed_ips = ['10.66.66.6/32', 'fd00:db8::6/128']
exchange_command = [
  'wg', 'set', 'wg1', 'peer', 'PEER2-WG-PUBLIC-KEY', 'preshared-key', '/dev/stdin'
]

# Add more [[peers]] blocks as needed.
