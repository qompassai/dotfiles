public_key = 'primo-rpk'
secret_key = 'primo-rsk'
listen = ["[::]:9999"]
verbosity = "Quiet"

[[peers]]
public_key = 'caffe-rpk'
endpoint = 'caffe.example.com:9999'
key_out = '$XDG_RUNTIME_DIR/rosenpass/caffe.key'
allowed_ips = ['10.66.66.3/32', 'fd00:db8::3/128']
exchange_command = [
  'wg',
  'set',
  'wg1',
  'peer',
  "<CAFFE-WG-PUBLIC-KEY>",
  'preshared-key',
  '/dev/stdin'
]

[[peers]]
public_key = 'doppio-rpk'
endpoint = 'doppio.example.com:9999'
key_out = '$XDG_RUNTIME_DIR/rosenpass/doppio.key'
allowed_ips = ['10.66.66.4/32', 'fd00:db8::4/128']
exchange_command = [
  'wg',
  'set',
  'wg1',
  'peer',
  '<DOPPIO-WG-PUBLIC-KEY>',
  "preshared-key",
  "/dev/stdin"
]

[[peers]]
public_key = 'pensare-rpk'
endpoint = 'pensare.example.com:9999'
key_out = '$XDG_RUNTIME_DIR/rosenpass/pensare.key'
allowed_ips = ['10.66.66.5/32', 'fd00:db8::5/128']
exchange_command = [
  'wg',
  'set',
  'wg1',
  'peer',
  'PENSARE-WG-PUBLIC-KEY',
  'preshared-key',
  '/dev/stdin'
