;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
database=/var/lib/mumble-server/mumble-server.sqlite
sqlite_wal=0
;dbDriver=QMYSQL
;dbUsername=
;dbPassword=
;dbHost=
;dbPort=
;dbPrefix=mumble-server_
;dbOpts=
dbus=session
dbusservice=net.sourceforge.mumble.murmur
ice="tcp -h 127.0.0.1 -p 6502"
;icesecretread=
icesecretwrite=
logfile=
;pidfile=
welcometext="<br />Welcome to this server running <b>Mumble</b>.<br />Enjoy your stay!<br />"
;welcometextfile=
port=64738
;host=
serverpassword=
bandwidth=558000
timeout=30
users=100
usersperchannel=0
messageburst=5
messagelimit=1
pluginmessagelimit=1
pluginmessageburst=5
allowping=true
opusthreshold=0
channelnestinglimit=10
;channelcountlimit=1000
;channelname=[ \\-=\\w\\#\\[\\]\\{\\}\\(\\)\\@\\|]+
;username=[-=\\w\\[\\]\\{\\}\\(\\)\\@\\|\\.]+
;defaultchannel=0
rememberchannel=true
rememberchannelduration=0
textmessagelength=5000
imagemessagelength=131072
allowhtml=true
logdays=31
;registerName=Mumble Server
;registerPassword=secret
;registerUrl=http://www.mumble.info/
;registerHostname=
;registerLocation=
; See http://developer.apple.com/networking/bonjour/index.html for more information
bonjour=true
;sslCert=
;sslKey=
;sslPassPhrase=
;sslCA=
sslDHParams=@ffdhe8192
; https://www.openssl.org/docs/apps/ciphers.html#CIPHER-LIST-FORMAT).
sslCiphers=EECDH+AESGCM:EDH+aRSA+AESGCM:DHE-RSA-AES256-SHA:DHE-RSA-AES128-SHA:AES256-SHA:AES128-SHA
;uname=
obfuscate=true
certrequired=true
sendversion=true
;suggestVersion=
;suggestPositional=
;suggestPushToTalk=
;legacypasswordhash=false
;kdfiterations=-1
set autobanSuccessfulConnections=false.
autobanAttempts=10
autobanTimeframe=120
autobanTime=300
autobanSuccessfulConnections=true
loggroupchanges=false
logaclchanges=false
allowRecording=true
listenersperchannel=5
listenersperuser=2
forceExternalAuth=false
[Ice]
Ice.Warn.UnknownProperties=1
Ice.MessageSizeMax=65536
