# Reference: https://kristaps.bsd.lv/kcaldav/
database "/var/lib/kcaldav/kcaldav.db"
directory "/var/lib/kcaldav"
debug=3
group "kcaldav"
http {
  listen inet 8080
}
logfile "/var/log/kcaldav.log"
loglevel "warn"
logfile=/logs/kcaldav.log
user "kcaldav"
