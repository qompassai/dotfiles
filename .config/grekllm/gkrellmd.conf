# /qompassai/dotfiles/.config/grekllm/grekllmd.conf
# Qompass AI GKrellmd Config
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
update-hz 3
#max-clients 2
#address 127.0.0.1
#port 19150
allow-host	localhost
allow-host	127.0.0.1
allow-host	::1
#allow-host	192.168.0.*
#user	nobody
#group	proc
#pidfile /var/run/gkrellmd.pid
detach
syslog
#fs-interval 2
#nfs-interval 16
inet-interval 1
#mbmon-port port-number
io-timeout 30
reconnect-timeout 60
#mailbox /var/mail/bill
#mailbox ~/Mail/inbox
plugin-enable gkrelltopd
plugin-enable gkrellmwho2d
#net-timer ppp0
# system              0x1
# mail                0x10
# net                 0x20
# timer               0x40
# sensors             0x80
# sensors             0x100
# (w/o libsensors)
# inet                0x800
# battery             0x8000
debug level 0x1
