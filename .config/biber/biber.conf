<?xml version="1.0" encoding="UTF-8"?>
<!--
  Biber configuration template

  Install as:
    $XDG_CONFIG_HOME/biber/biber.conf

-->
<config>
  <!-- annotation-marker (default: +an) -->
  <annotation_marker>+an</annotation_marker>

  <!-- cache: command-only query which prints the PAR cache and exits. -->
  <!-- <cache>1</cache> -->

  <!-- clrmacros (default: disabled) -->
  <clrmacros>0</clrmacros>

  <collate_options>
    <option name="level" value="4"/>
    <option name="normalization" value="prenormalized"/>
    <option name="variable" value="non-ignorable"/>
  </collate_options>

  <convert_control>0</convert_control>

  <debug>0</debug>

  <decodecharsset>base</decodecharsset>

  <dieondatamodel>0</dieondatamodel>

  <!-- dot-include: enable only together with output-format=dot. -->
  <!-- <dot_include>section,xdata,crossref,xref</dot_include> -->

  <!-- fixinits (default: disabled; may alter intentional strings such as U.K.) -->
  <fixinits>0</fixinits>

  <!-- glob-datasources (default: enabled) -->
  <glob_datasources>1</glob_datasources>

  <!-- help: command-only action which prints help and exits. -->
  <!-- <help>1</help> -->

  <!-- input-directory: project-specific; uncomment and replace the path. -->
  <!-- <input_directory>/absolute/path/to/input</input_directory> -->

  <!-- input-encoding (default: UTF-8; normally supplied by the control file) -->
  <input_encoding>UTF-8</input_encoding>

  <!-- input-format: tool-mode only; default is bibtex. -->
  <!-- <input_format>bibtex</input_format> -->

  <!-- isbn10 (mutually exclusive with isbn13; default: disabled) -->
  <isbn10>0</isbn10>

  <isbn13>0</isbn13>

  <isbn_normalise>0</isbn_normalise>

  <listsep>and</listsep>

  <!-- logfile: invocation-specific; Biber otherwise derives the .blg name. -->
  <!-- <logfile>document</logfile> -->

  <!-- mincrossrefs (default: 0) -->
  <mincrossrefs>0</mincrossrefs>

  <named_annotation_marker>:</named_annotation_marker>

  <namesep>and</namesep>

  <no_bblxml_schema>0</no_bblxml_schema>

  <no_bltxml_schema>0</no_bltxml_schema>

  <!-- noconf: command-only bootstrap option; enabling it would ignore this file. -->
  <!-- <noconf>1</noconf> -->

  <no_default_datamodel>0</no_default_datamodel>

  <nodieonerror>0</nodieonerror>
  <nolog>0</nolog>
  <noremove_tmp_dir>0</noremove_tmp_dir>
  <!-- noskipduplicates (default: disabled) -->
  <noskipduplicates>0</noskipduplicates>

  <!-- nostdmacros (default: disabled) -->
  <nostdmacros>0</nostdmacros>

  <noxname>0</noxname>
  <onlylog>0</onlylog>
  <others_string>others</others_string>
  <output_align>0</output_align>
  <output_all_macrodefs>0</output_all_macrodefs>
  <output_annotation_marker>+an</output_annotation_marker>
  <!-- output-directory: project-specific; uncomment and replace the path. -->
  <!-- <output_directory>/absolute/path/to/output</output_directory> -->
  <output_encoding>UTF-8</output_encoding>
  <output_fieldcase>upper</output_fieldcase>

  <!-- output-field-order (tool-mode BibTeX output default) -->
  <output_field_order>options,abstract,names,lists,dates</output_field_order>

  <!-- output-field-replace: add comma-separated source:replacement pairs. -->
  <!-- <output_field_replace>location:address,journaltitle:journal</output_field_replace> -->

  <!-- output-file: invocation-specific; Biber otherwise derives the name. -->
  <!-- <output_file>/absolute/path/to/output.bbl</output_file> -->

  <!-- <output_format>bbl</output_format> -->

  <output_indent>2</output_indent>
  <output_legacy_dates>0</output_legacy_dates>
  <output_listsep>and</output_listsep>
  <output_named_annotation_marker>:</output_named_annotation_marker>
  <output_namesep>and</output_namesep>
  <output_no_macrodefs>0</output_no_macrodefs>
  <!-- <output_resolve>0</output_resolve> -->

  <output_resolve_crossrefs>0</output_resolve_crossrefs>
  <output_resolve_sets>0</output_resolve_sets>
  <output_resolve_xdata>0</output_resolve_xdata>
  <output_safechars>0</output_safechars>
  <output_safecharsset>base</output_safecharsset>
  <output_xdatamarker>xdata</output_xdatamarker>
  <output_xdatasep>-</output_xdatasep>
  <output_xname>0</output_xname>
  <output_xnamesep>=</output_xnamesep>
  <quiet>0</quiet>

  <!-- recodedata: custom file must be discoverable through kpsewhich. -->
  <!-- <recodedata>recode_data.xml</recodedata> -->

  <!-- show-tmp-dir: command-only query, useful with noremove-tmp-dir. -->
  <!-- <show_tmp_dir>1</show_tmp_dir> -->

  <sortcase>true</sortcase>

  <sortdebug>0</sortdebug>

  <!-- <sortlocale>en_US</sortlocale> -->

  <sortupper>true</sortupper>

  <!-- ssl-nointernalca: intentionally not enabled; changes the CA trust source. -->
  <!-- <ssl_nointernalca>0</ssl_nointernalca> -->

  <!-- ssl-noverify-host: intentionally not enabled; disables TLS host checks. -->
  <!-- <ssl_noverify_host>0</ssl_noverify_host> -->

  <!-- strip-comments (default: disabled; tool-mode only) -->
  <strip_comments>0</strip_comments>

  <!-- tool: select tool mode per invocation rather than globally. -->
  <!-- <tool>1</tool> -->

  <!-- tool-config: command-only query which prints a path and exits. -->
  <!-- <tool_config>1</tool_config> -->

  <!-- tool-noremove-missing-dependants (default: disabled) -->
  <tool_noremove_missing_dependants>0</tool_noremove_missing_dependants>

  <trace>0</trace>

  <validate_bblxml>0</validate_bblxml>
  <validate_bltxml>0</validate_bltxml>

  <!-- validate-config (enabled so Biber validates this XML against its schema) -->
  <validate_config>1</validate_config>

  <validate_control>1</validate_control>
  <validate_datamodel>1</validate_datamodel>
  <!-- <version>1</version> -->
  <winunicode>0</winunicode>
  <wraplines>0</wraplines>
  <xdatamarker>xdata</xdatamarker>
  <xdatasep>-</xdatasep>
  <xnamesep>=</xnamesep>
  <xsvsep>\s*,\s*</xsvsep>
</config>
