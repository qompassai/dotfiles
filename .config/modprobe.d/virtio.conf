####################################################
options virtio_net napi_tx=1 #NAPI TX for better TCP performance and reduced bufferbloat
options virtio_net napi_weight=64
options virtio_net csum=1
options virtio_net gso=1
options virtio-gpu modeset=1  # Virt GPU Passthrough
options virtio_mem unplug_online=1
options virtio_mem force_bbm=0 # Auto-detect big block mode (0 = auto-selection)
options virtio_mem bbm_block_size=0 # Auto-detect optimal big block size
