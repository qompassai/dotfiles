# References: https://manpages.debian.org/testing/swtpm-tools/swtpm_setup.conf.5.en.html | https://github.com/stefanberger/swtpm
create_certs_tool= /usr/bin/swtpm_localca
create_certs_tool_config = ${XDG_CONFIG_HOME}/swtpm/swtpm-localca.conf
create_certs_tool_options = ${XDG_CONFIG_HOME}/swtpm/swtpm-localca.options
active_pcr_banks = sha256
rsa_keysize = 4096
profile = {"Name": "default-v1"}
# profile_file =
local_profiles_dir = ${XDG_CONFIG_HOME}/swtpm/profiles/
