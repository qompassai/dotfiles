########################################################
settings:
  content.javascript.enabled:
    global: true
  colors.completion.fg:
    global: "#b8bb26"
  colors.completion.odd.bg:
    global: "#282828"
  colors.completion.even.bg:
    global: "#3c3836"
  colors.tabs.even.bg:
    global: "#1d2021"
  colors.tabs.odd.bg:
    global: "#1d2021"
  colors.statusbar.normal.bg:
    global: "#282828"
  colors.statusbar.insert.bg:
    global: "#458588"
  colors.statusbar.passthrough.bg:
    global: "#b16286"
  colors.statusbar.caret.bg:
    global: "#fe8019"
  colors.statusbar.command.bg:
    global: "#282828"
  tabs.position:
    global: top
  tabs.show:
    global: multiple
  completion.shrink:
    global: true
  hints.uppercase:
    global: true
  hints.chars:
    global: asdfhjklwertyuiopzxcvbnm
  messages.timeout:
    global: 3000
  statusbar.show:
    global: in-mode
  downloads.position:
    global: bottom
  url.start_pages:
    global: [about:blank]
  url.default_page:
    global: about:blank
  url.searchengines:
    DEFAULT: "https://duckduckgo.com/?q={}"

