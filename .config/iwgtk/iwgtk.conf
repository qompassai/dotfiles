[indicator.colors.station]
connected=lime
connecting=yellow
disconnected=gray
[indicator.colors.ap]
up=lime
down=gray
[indicator.colors.adhoc]
up=lime
down=gray
[indicator.colors.disabled]
device=gray
adapter=gray
[network.colors]
connected=lime
connecting=yellow
known=darkgreen
unknown=gray
hidden=gray
[known-network]
last-connection-time.format=%x\n%l:%M %p
[window]
dark=true
width=440
height=600
