# /qompassai/dotfiles/.config/smartdns/smartdns.conf
# Qompass AI SmartDNS Config
# Copyright (C) 2025 Qompass AI, All rights reserved
#################################################
address #, block all A and AAAA request.
address #6, block all AAAA request.
address -6, allow all AAAA request.
address /$(pass show smartdns/example_domain)/$(pass show smartdns/example_ip)
address /$(pass show smartdns/example_domain_multi)/$(pass show smartdns/example_ip1),$(pass show smartdns/example_ip2)
address /$(pass show smartdns/example_upstream_domain)/-
address /$(pass show smartdns/example_soa_domain)/#
audit-enable yes
audit-file "$(pass show smartdns/audit_file)"
audit-SOA yes
audit-size 128k
bind "$(pass show smartdns/bind_udp_address)"
bind [::]:"$(pass show smartdns/bind_ipv6_port)"
bind tcp "$(pass show smartdns/bind_tcp_address)"
bind tls "$(pass show smartdns/bind_tls_address)"
bind-https "$(pass show smartdns/bind_https_address)"
blacklist-ip "$(pass show smartdns/blacklist_ip_subnet)"
bogus-nxdomain "$(pass show smartdns/bogus_nxdomain_subnet)"
ignore-ip "$(pass show smartdns/ignore_ip_subnet)"
whitelist-ip "$(pass show smartdns/whitelist_ip_subnet)"
cache-checkpoint-time 86400
cache-file "$(pass show smartdns/cache_file)"
cache-mem-size "$(pass show smartdns/cache_mem_size)"
cache-persist yes
cache-persist-time 86400
cache-size 32768
prefetch-domain yes
serve-expired yes
serve-expired-reply-ttl 30
serve-expired-ttl 0
ca-file "$(pass show smartdns/ca_file)"
ca-path "$(pass show smartdns/ca_path)"
cname /$(pass show smartdns/example_cname_domain)/$(pass show smartdns/example_cname_target)
dns64 $(pass show smartdns/dns64_prefix)
https-record /$(pass show smartdns/https_record_domain)/ipv4hint=$(pass show smartdns/https_record_ipv4hint)
https-record noipv4hint,noipv6hint
srv-record /$(pass show smartdns/example_srv_domain)/$(pass show smartdns/example_srv_target),$(pass show smartdns/example_srv_port),$(pass show smartdns/example_srv_priority),$(pass show smartdns/example_srv_weight)
edns-client-subnet "$(pass show smartdns/edns_client_subnet_v4)"
edns-client-subnet "$(pass show smartdns/edns_client_subnet_v6)"
#client-rules "$(pass show smartdns/client_rule)"
conf-file "$(pass show smartdns/blacklist_ip_conf)"
conf-file "$(pass show smartdns/whitelist_ip_conf)" -group "$(pass show smartdns/group_office)"
conf-file "*.conf"
domain-rules /domain-set:$(pass show smartdns/domain_list_name)/ -speed-check-mode ping
domain-set -name "$(pass show smartdns/domain_list_name)" -type list -file "$(pass show smartdns/domain_list_file)"
ip-alias "$(pass show smartdns/ip_alias_source)" "$(pass show smartdns/ip_alias_targets)"
ip-alias ip-set:$(pass show smartdns/ip_list_name) $(pass show smartdns/ip_list_alias)
ip-alias ip-set:$(pass show smartdns/ip_list_name) ip-set:$(pass show smartdns/ip_map_list)
ipset /$(pass show smartdns/ipset_domain)/$(pass show smartdns/ipset_set)
ipset-timeout yes
ip-set -name "$(pass show smartdns/ip_list_name)" -file "$(pass show smartdns/ip_list_file)"
nftset /$(pass show smartdns/nftset_domain)/-
nameserver /domain-set:$(pass show smartdns/domain_list_name)/$(pass show smartdns/domain_list_group)
ddns-domain "$(pass show smartdns/ddns_domain)"
hosts-file "$(pass show smartdns/hosts_file)"
mdns-lookup yes
dualstack-ip-allow-force-AAAA yes
dualstack-ip-selection yes
dualstack-ip-selection-threshold "$(pass show smartdns/dualstack_threshold)"
log-console yes
log-file "$(pass show smartdns/log_file)"
log-level debug
log-num 5
log-size 128k
log-syslog yes
max-query-limit 65535
max-reply-ip-num 1
rr-ttl 300
rr-ttl-max 86400
rr-ttl-min 60
rr-ttl-reply-max 60
option:
   -force-aaaa-soa
   -force-https-soa
   -ipset ipsetname
   -no-cache
   -no-dualstack-selection
   -no-ip-alias
   -no-rule-addr
   -no-rule-ipset
   -no-rule-nameserver
   -no-rule-soa
   -no-rules
   -no-serve-expired
   -no-speed-check
plugin "$(pass show smartdns/ui_lib)" --p "$(pass show smartdns/ui_port)" -i 0.0.0.0 -r "$(pass show smartdns/wwwroot)"
proxy-server http://$(pass show smartdns/http_user):$(pass show smartdns/http_pass)@$(pass show smartdns/http_addr):$(pass show smartdns/http_port) -name proxy
proxy-server socks5://$(pass show smartdns/socks5_user):$(pass show smartdns/socks5_pass)@$(pass show smartdns/socks5_addr):$(pass show smartdns/socks5_port) -name proxy
resolv-hostname yes
server-name "$(pass show smartdns/server)"
user "$(pass show smartdns/user)"
speed-check-mode ping,tcp:80,tcp:443
server "$(pass show smartdns/upstream_ipv4)" -blacklist-ip -check-edns -group "$(pass show smartdns/upstream_group1)" -group "$(pass show smartdns/upstream_group2)"
server-tcp "$(pass show smartdns/upstream_ipv4_tcp)"
server-tls "$(pass show smartdns/upstream_ipv4_tls)"
server-tls "$(pass show smartdns/upstream_ipv4_tls2)"
server tls://$(pass show smartdns/upstream_tls_host):853
server https://$(pass show smartdns/upstream_https_host)/dns-query
server-https https://$(pass show smartdns/upstream_https_cloudflare)/dns-query
force-AAAA-SOA yes
force-qtype-SOA 65,28,65-68
