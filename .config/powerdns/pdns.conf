# /qompassai/dotfiles/.config/powerdns/pdns.conf
# Qompass AI PowerDNS Config
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
# ignore-unknown-settings=
8bit-dns=no
allow-axfr-ips	Allow zonetransfers only to these subnets
allow-axfr-ips=127.0.0.0/8,::1
allow-dnsupdate-from=127.0.0.0/8,::1
allow-notify-from=0.0.0.0/0,::/0
allow-unsigned-autoprimary=yes
allow-unsigned-notify=yes
##also-notify=
any-to-tcp=yes
api=no
# api-key=
autosecondary=no
axfr-fetch-timeout=10
axfr-lower-serial=no
cache-ttl=20
carbon-instance=auth
carbon-interval=30
carbon-namespace=pdns
carbon-ourname=
carbon-server=
chroot=
config-dir=/etc/powerdns
# config-name=
consistent-backends=yes
control-console=no
daemon=no
default-api-rectify=yes
#default-catalog-zone=
default-ksk-algorithm=ecdsa256
default-ksk-size=0
#default-publish-cdnskey=
# default-publish-cds=
default-soa-content=a.misconfigured.dns.server.invalid hostmaster.@ 0 10800 3600 604800 3600
# default-soa-edit=
# default-soa-edit-signed=
default-ttl=3600
# default-zsk-algorithm=
default-zsk-size=0
delay-notifications=0
direct-dnskey=no
direct-dnskey-signature=no
disable-axfr=no
disable-axfr-rectify=no
disable-syslog=no
distributor-threads=3
dname-processing=no
dnsproxy-udp-port-range=10000 60000
dnssec-key-cache-ttl=30
dnsupdate=no
dnsupdate-require-tsig=no
domain-metadata-cache-ttl=
# edns-cookie-secret=
edns-subnet-processing=no
enable-lua-records=no
entropy-source=/dev/urandom
expand-alias=no
forward-dnsupdate=yes
# forward-notify=
guardian=no
# include-dir=
# launch=
# load-modules=
local-address=0.0.0.0, ::
local-address-nonexist-fail=yes
local-port=53
log-dns-details=no
log-dns-queries=no
log-timestamp=yes
# logging-facility=
loglevel=4
loglevel-show=no
# lua-axfr-script=
lua-consistent-hashes-cleanup-interval=3600
lua-consistent-hashes-expire-delay=86400
# lua-dnsupdate-policy-script=
# lua-global-include-dir=
lua-health-checks-expire-delay=3600
lua-health-checks-interval=5
# lua-prequery-script=
lua-records-exec-limit=1000
lua-records-insert-whitespace=no
max-cache-entries=1000000
max-ent-entries=100000
max-generate-steps=0
max-include-depth=20
max-nsec3-iterations=100
max-packet-cache-entries=1000000
max-queue-length=5000
# max-signature-cache-entries=
max-tcp-connection-duration=0
max-tcp-connections=20
max-tcp-connections-per-client=0
max-tcp-transactions-per-conn=0
# module-dir=/usr/lib/powerdns
negquery-cache-ttl=60
no-shuffle=off
non-local-bind=no
only-notify=0.0.0.0/0,::/0
outgoing-axfr-expand-alias=no
overload-queue-length=0
prevent-self-notification=yes
primary=no
# proxy-protocol-from=
proxy-protocol-maximum-size=512
query-cache-ttl=20
query-local-address=0.0.0.0 ::
query-logging=no
queue-limit=1500
receiver-threads=1
resolve-across-zones=yes
resolver=no
retrieval-threads=2
reuseport=no
rng=auto
secondary=no
secondary-check-signature-freshness=yes
secondary-do-renotify=no
security-poll-suffix=secpoll.powerdns.com.
send-signed-notify=yes
# server-id=
setgid=powerdns
setuid=powerdns
signing-threads=3
# socket-dir=
svc-autohints=no
# tcp-control-address=
tcp-control-port=53000
tcp-control-range=127.0.0.0/8, 10.0.0.0/8, 192.168.0.0/16, 172.16.0.0/12, ::1/128, fe80::/10
# tcp-control-secret=
tcp-fast-open=0
tcp-idle-timeout=5
traceback-handler=yes
# trusted-notification-proxy=
udp-truncation-threshold=1232
upgrade-unknown-types=no
version-string=full
views=no
webserver=no
webserver-address=127.0.0.1
webserver-allow-from=127.0.0.1,::1
webserver-connection-timeout=5
webserver-hash-plaintext-credentials=no
webserver-loglevel=normal
webserver-max-bodysize=2
# webserver-password=
webserver-port=8081
webserver-print-arguments=no
workaround-11804=no
write-pid=yes
xfr-cycle-interval=60
xfr-max-received-mbytes=100
zone-cache-refresh-interval=300
zone-metadata-cache-ttl=60
