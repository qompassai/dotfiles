monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.pci.*"
        cpu.vm.name = "~.*"
      }
      {
        node.name = "~alsa_output.pci.*"
        cpu.vm.name = "~.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 1024
        api.alsa.headroom      = 2048
      }
    }
  },
  {
    matches = [
      {
        node.name = "~alsa_input.pci.*"
        cpu.vm.name = "~^(vmware)|(oracle)$"
      }
      {
        node.name = "~alsa_output.pci.*"
        cpu.vm.name = "~^(vmware)|(oracle)$"
      }
    ]
    actions = {
      update-props = {
        api.alsa.period-size   = 1024
        api.alsa.headroom      = 8192
      }
    }
  }
]
