
local rule = {
  matches = {
    {
      { "application.name", "matches", "Music Player Daemon*" },
    },
    {
      { "application.name", "equals", "mpd" },
    },
    {
      { "node.name", "matches", "mpd*" },
    },
  },
  apply_properties = {
    ["priority.session"] = 1000,
    ["priority.driver"] = 1000,
    ["node.pause-on-idle"] = false,
     ["audio.rate"] = 48000,
     ["api.alsa.period-size"] = 1024,
     ["api.alsa.headroom"] = 0,
  },
}
if alsa_monitor and alsa_monitor.rules then
  table.insert(alsa_monitor.rules, rule)
  Log.info("MPD priority rule loaded")
else
  Log.warning("alsa_monitor not available")
end
