access.rules = [
  {
    matches = [ { access                                   = "unrestricted" } ]
    actions = {
      update-props = {
        default_permissions                                = "rwxm"
      }
    }
  }
  {
    matches = [ { access                                   = "default" } ]
    actions = {
      update-props = {
        default_permissions                                = "rwxm"
      }
    }
  }
  {
    matches = [ { access                                   = "flatpak" } ]
    actions = {
      update-props = {
        default_permissions                                = "rx"
      }
    }
  }
  {
    matches = [
      {
        access                                             = "flatpak"
        media.category                                     = "Manager"
      }
    ]
    actions = {
      update-props = {
        access                                             = "flatpak-manager"
        default_permissions                                = "rwxm"
      }
    }
  }
  {
    matches = [ { access                                   = "restricted" } ]
    actions = {
      update-props = {
        default_permissions                                = "rx"
      }
    }
  }
]
device.profile.priority.rules = [
  {
    matches = [
      {
        device.name                                        = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        priorities = [
                                                           "a2dp-sink-aptx_ll"
                                                           "a2dp-sink-aac"
                                                           "a2dp-sink-sbc"
                                                           "a2dp-sink-aptx"
                                                           "a2dp-sink-aptx_hd"
                                                           "a2dp-sink-ldac"
                                                           "a2dp-sink-sbc_xq"
        ]
      }
    }
  }
]
monitor.alsa.rules = [
  {
    matches = [
      {
        cpu.vm.name                                        = "~.*"
        node.name                                         = "~alsa_input.pci.*"
      }
      {
        cpu.vm.name                                        = "~.*"
        node.name                                          = "~alsa_output.pci.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom                                  = 2048
        api.alsa.period-size                               = 1024
      }
    }
  }
  {
    matches = [
      {
        cpu.vm.name                                        = "~^(vmware)|(oracle)$"
        node.name                                          = "~alsa_input.pci.*"
      }
      {
        cpu.vm.name                                        = "~^(vmware)|(oracle)$"
        node.name                                          = "~alsa_output.pci.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.headroom                                  = 8192
        api.alsa.period-size                               = 1024
      }
    }
  }
  {
    matches = [
      {
        device.name                                        = "~alsa_card.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.ignore-dB                                 = false
        api.alsa.soft-mixer                                = false
        api.alsa.use-acp                                   = true
        api.alsa.use-ucm                                   = true
        device.disabled                                    = false
      }
    }
  }
  {
    matches = [
      {
        node.name                                          = "~alsa_input.*"
      }
      {
        node.name                                          = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        api.alsa.disable-batch                             = false
        api.alsa.disable-mmap                              = false
        api.alsa.headroom                                  = 0
        api.alsa.multirate                                 = true
        api.alsa.period-num                                = 2
        api.alsa.period-size                               = 1024
        api.alsa.start-delay                               = 0
        api.alsa.use-chmap                                 = false
        audio.allowed-rates                                = [ 32000 96000 ]
        audio.channels                                     = 2
        audio.format                                       = "S16LE"
        audio.position                                     = [ FL FR ]
        audio.rate                                         = 44100
        channelmix.disable                                 = false
        channelmix.fc-cutoff                               = 12000
        channelmix.hilbert-taps                            = 0
        channelmix.lfe-cutoff                              = 150
        channelmix.mix-lfe                                 = false
        channelmix.normalize                               = false
        channelmix.rear-delay                              = 12.0
        channelmix.stereo-widen                            = 0.0
        channelmix.upmix                                   = true
        channelmix.upmix-method                            = "psd"
        clock.name                                         = "api.alsa.0"
        dither.method                                      = "none"
        dither.noise                                       = 0
        latency.internal.ns                                = 0
        latency.internal.rate                              = 0
        monitor.channel-volumes                            = false
        node.disabled                                      = false
        node.pause-on-idle                                 = false
        priority.driver                                    = 100
        priority.session                                   = 100
        resample.disable                                   = false
        resample.quality                                   = 4
        session.suspend-timeout-seconds                    = 5
      }
    }
  }
]
monitor.bluez-midi.rules = [
  {
    matches = [
      {
        node.name                                          = "~bluez_midi.*"
      }
    ]
    actions = {
      update-props = {
        node.latency-offset-msec                           = 0
        node.pause-on-idle                                 = false
        priority.driver                                    = 100
        priority.session                                   = 100
        session.suspend-timeout-seconds                    = 5
      }
    }
  }
]
monitor.bluez.rules = [
  {
    matches = [
      {
        device.name                                        = "~bluez_card.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.aac.bitratemode                        = 0
        bluez5.a2dp.ldac.quality                           = "auto"
        bluez5.a2dp.opus.pro.application                   = "audio"
        bluez5.a2dp.opus.pro.bidi.application              = "audio"
         bluez5.a2dp.opus.pro.bidi.channels                = 1
        bluez5.a2dp.opus.pro.bidi.coupled-streams          = 0
        bluez5.a2dp.opus.pro.bidi.frame-dms                = 400
        bluez5.a2dp.opus.pro.bidi.locations                = [ FC ]
        bluez5.a2dp.opus.pro.bidi.max-bitrate    = 160000
        bluez5.a2dp.opus.pro.channels            = 3
        bluez5.a2dp.opus.pro.coupled-streams     = 1
        bluez5.a2dp.opus.pro.frame-dms           = 50
        bluez5.a2dp.opus.pro.locations           = [ FL FR LFE ]
        bluez5.a2dp.opus.pro.max-bitrate         = 600000
        bluez5.auto-connect                                = [ hfp_hf hsp_hs a2dp_sink hfp_ag hsp_ag a2dp_source ]
        bluez5.hw-volume                                   = [ hfp_hf hsp_hs a2dp_sink hfp_ag hsp_ag a2dp_source ]
      }
    }
  }
  {
    matches = [
      {
        device.form-factor                                 = "headset"
      }
    ]
    actions = {
      update-props = {
        bluez5.a2dp.ldac.quality                           = "auto"
        device.nick                                        = "Hearing Aid"
        device.profile                                     = "a2dp-sink"
      }
    }
  }
  {
    matches = [
      {
        node.name                                          = "~bluez_input.*"
      }
      {
        node.name                                          = "~bluez_output.*"
      }
    ]
    actions = {
      update-props = {
        bluez5.media-source-role                           = "input"
        channelmix.mix-lfe                                 = false
        channelmix.normalize                               = false
        monitor.channel-volumes                            = false
        node.pause-on-idle                                 = false
        priority.driver                                    = 100
        priority.session                                   = 100
        resample.quality                                   = 4
        session.suspend-timeout-seconds                    = 5
      }
    }
  }
]
monitor.libcamera.rules = [
  {
    matches = [
      {
        device.name                                        = "~libcamera_device.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled                                    = false
      }
    }
  }
  {
    matches = [
      {
        node.name                                          = "~libcamera_input.*"
      }
      {
        node.name                                          = "~libcamera_output.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled                                      = false
        node.pause-on-idle                                 = false
        priority.driver                                    = 100
        priority.session                                   = 100
      }
    }
  }
]
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.name                                        = "~v4l2_device.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled                                    = false
      }
    }
  }
  {
    matches = [
      {
        node.name                                          = "~v4l2_input.*"
      }
      {
        node.name                                          = "~v4l2_output.*"
      }
    ]
    actions = {
      update-props = {
        node.disabled                                      = false
        node.pause-on-idle                                 = false
        priority.driver                                    = 100
        priority.session                                   = 100
      }
    }
  }
]
node.filter-graph.rules = [
  {
    matches = [
      {
        media.class                                        = "Audio/Source"
      }
    ]
    actions = {
      create-filter-graph = [
        {
          nodes = [
            {
              type                                         = builtin
              label                                        = copy
              name                                         = passthrough
            }
          ]
        }
        {
          nodes = [
            {
              type                                         = ladspa
              name                                         = rnnoise
              plugin                                       = librnnoise_ladspa
              label                                        = noise_suppressor_stereo
            }
          ]
        }
      ]
    }
  }
]
stream.rules = [
  {
    matches = [
      { application.name                                   = "pw-play" }
    ]
    actions = {
      update-props = {
        state.default-volume                               = 1.0
        state.restore-props                                = false
        state.restore-target                               = false
      }
    }
  }
]
wireplumber.components.rules = [
  {
    matches = [
      {
        provides                                           = "~loopback.sink.*"
      }
    ]
    actions = {
      merge = {
        arguments = {
          capture.props = {
            audio.position                                 = [ FL FR ]
            media.class                                    = Audio/Sink
            policy.role-based.target                       = true
          }
          playback.props = {
            media.role                                     = "Loopback"
            node.passive                                   = true
          }
        }
        requires                                           = [ support.export-core pw.node-factory.adapter ]
      }
    }
  }
]

