monitor.bluez-midi.servers = [
                                                           "bluez_midi.server"
]
wireplumber.components = [
  {
    name = ensure-no-media-session,                        type = built-in
    provides                                               = check.no-media-session
  }
  {
    name = export-core, type                               = built-in
    provides = support.export-core
  }
  {
    name = settings-instance,                              type = built-in
    arguments                                              = { metadata.name = sm-settings }
    provides                                               = support.settings
    after                                                  = [ metadata.sm-settings ]
  }
  {
    name = libpipewire-module-adapter,                     type = pw-module
    provides                                               = pw.node-factory.adapter
    requires = [ pw.client-node ]
  }
  {
    name = libpipewire-module-client-device, type = pw-module
    provides = pw.client-device
    wants = [ support.export-core ]
  }
  {
    name = libpipewire-module-client-node, type = pw-module
    provides = pw.client-node
    wants = [ support.export-core ]
  }
  {
    name = libpipewire-module-filter-chain, type           = pw-module
    arguments = {
      audio.channels                                       = 2
      audio.position                                       = [ FL FR ]
      capture.props = {
        filter.smart                                       = true
        filter.smart.name                                  = "filter.sink.smart-equalizer"
        #filter.smart.after                                = []
        #filter.smart.before                               = []
        #filter.smart.target                               = { node.name = "alsa_output.pci-0000_00_01.0.analog-stereo" }
        media.class                                        = Audio/Sink
      }
      filter.graph = {
        links = [
          { output = "bass:Out", input                     = "treble:In" }
        ]
        nodes = [
          {
            control                                        = { "Freq" = 250.0, "Gain" = 0.0, "Q" = 1.0 }
            label   = bq_lowshelf
            name    = bass
            type    = builtin
          }
          {
            control                                        = { "Freq" = 6000.0, "Gain" = 0.0, "Q" = 1.0 }
            label                                          = bq_peaking
            name                                           = treble
            type                                           = builtin
          }
        ]
      }
      media.name                                           = "2ch Equalizer Sink"
      node.description                                     = "2ch Equalizer Sink"
      node.name                                            = "filter.sink.smart-equalizer"
      playback.props = {
        media.role                                         = "DSP"
        node.dont-reconnect                                = false
        node.passive                                       = true
        session.suspend-timeout-seconds                    = 0
      }
    }
    provides                                               = filter.sink.smart-equalizer
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.description = "Alert"
      node.name        = "loopback.sink.role.alert"
      capture.props = {
        device.intended-roles                              = [ "Alert" "Emergency" ]
        policy.role-based.action.lower-priority            = "cork"
        policy.role-based.action.same-priority             = "mix"
        policy.role-based.preferred-target                 = "Speaker"
        policy.role-based.priority                         = 100
      }
    }
    provides = loopback.sink.role.alert
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.description = "Voice Assistant"
      node.name        = "loopback.sink.role.assistant"
      capture.props = {
        device.intended-roles                              = [ "Assistant" ]
        policy.role-based.action.lower-priority            = "cork"
        policy.role-based.action.same-priority             = "mix"
        policy.role-based.priority                         = 40
      }
    }
    provides = loopback.sink.role.assistant
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.description = "Communication"
      node.name        = "loopback.sink.role.communication"
      capture.props = {
        device.intended-roles                              = [ "Communication" "Phone" ]
        policy.role-based.action.lower-priority            = "cork"
        policy.role-based.action.same-priority             = "mix"
        policy.role-based.priority                         = 50
      }
    }
    provides = loopback.sink.role.communication
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.description = "Multimedia"
      node.name        = "loopback.sink.role.multimedia"
      capture.props = {
        device.intended-roles                              = [ "Game" "Movie" "Multimedia" "Music" ]
        policy.role-based.action.lower-priority            = "mix"
        policy.role-based.action.same-priority             = "mix"
        policy.role-based.priority                         = 10
      }
    }
    provides = loopback.sink.role.multimedia
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.description = "Navigation"
      node.name        = "loopback.sink.role.navigation"
      capture.props = {
        device.intended-roles                              = [ "GPS" "Navigation" ]
        policy.role-based.action.lower-priority            = "duck"
        policy.role-based.action.same-priority             = "mix"
        policy.role-based.priority                         = 30
      }
    }
    provides = loopback.sink.role.navigation
  }
  {
    name = libpipewire-module-loopback, type = pw-module
    arguments = {
      node.description = "System Notifications"
      node.name        = "loopback.sink.role.notification"
      capture.props = {
        device.intended-roles                              = [ "Notification" ]
        policy.role-based.action.lower-priority            = "mix"
        policy.role-based.action.same-priority             = "mix"
        policy.role-based.priority                         = 20
      }
    }
    provides = loopback.sink.role.notification
  }
  {
    name = libpipewire-module-spa-node-factory, type = pw-module
    provides = pw.node-factory.spa
    requires = [ pw.client-node ]
  }
  {
