context.spa-libs = {
  api.alsa.*                                               = alsa/libspa-alsa
  api.bluez5.*                                             = bluez5/libspa-bluez5
  api.libcamera.*                                          = libcamera/libspa-libcamera
  api.v4l2.*                                               = v4l2/libspa-v4l2
  api.vulkan.*                                             = vulkan/libspa-vulkan
  audio.aec.*                                              = aec/libspa-aec
  audio.convert.*                                          = audioconvert/libspa-audioconvert
  audio.mixer.*                                            = audiomixer/libspa-audiomixer
  control.*                                                = control/libspa-control
  support.*                                                = support/libspa-support
  video.convert.*                                          = videoconvert/libspa-videoconvert
}
context.modules = [
  {
    name = libpipewire-module-rt
    args = {
        nice.level                                         = -11
         rt.prio      = 88
         rt.time.soft = -1
         rt.time.hard = -1
        # uclamp.min = 0
        # uclamp.max = 1024
    }
    flags = [ ifexists, nofail ]
  }
  { name = libpipewire-module-protocol-native }
  { name = libpipewire-module-metadata }
]
wireplumber.components.rules = [
  {
    matches = [
      {
        type = "script/lua"
      }
    ]
    actions = {
      merge = {
        requires = [ support.lua-scripting ]
      }
    }
  }
  {
    matches = [
      {
        provides = "~hooks.*"
        name = "!~monitors/.*"
      }
    ]
    actions = {
      merge = {
        before = [ support.standard-event-source ]
      }
    }
  }
  {
    matches = [
      { provides = "~monitor.*" }
    ]
    actions = {
      merge = {
        after = [ support.standard-event-source ]
      }
    }
  }
  {
    matches = [
      { name = "!session-services.lua" }
    ]
    actions = {
      merge = {
        before = [ support.session-services ]
      }
    }
  }
]

