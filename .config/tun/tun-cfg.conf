#################################################
AUTH="$(pass show tun/auth)"
BACKUP="$(pass show tun/backup)"
CIPHER="$(pass show tun/cipher)"
COMPRESSION=lz4
DNS="1.1.1.1,8.8.8.8"
PORT="$(pass show tun/port)"
MTU=1500
TIMEOUT=10
LOCAL=server.vpn
ROUTES='$(pass show tun/routes)'
PROTOCOL=wireguard
KEY_FILE="$(pass show tun/keyfile)"
ENDPOINTS="$(pass show tun/endpoints)"
EXCLUDE_ROUTES="10.0.0.0/8,192.168.1.0/24"
SPLIT_DOMAINS="$(pass show tun/splitdomain)"
IPV6=yes
LOG_PATH=/var/log/tun.log
LOG_LEVEL=info
HEALTH_INTERVAL=60
KEEPALIVE=25
HTTP_PROXY="$(pass show tun/proxy)"
NAT_TRAVERSAL=auto
FIREWALL=enabled
PRE_CONNECT_SCRIPT="$XDG_CONFIG_HOME/tun/pre-connect.sh"
POST_CONNECT_SCRIPT="$XDG_CONFIG_HOME/tun/post-connect.sh"
