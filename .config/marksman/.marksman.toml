## ##################################################
[core]
exclude = [
  "build/**",
  "dist/**",
  ".git/**",
  "node_modules/**",
  ".obsidian/**",
  ".venv/**",
]
follow_links = true
include = ["**/*.md", "**/*.mdx"]
markdown_extensions = [
  "definition-lists",
  "footnotes",
  "wiki-links",
  "front-matter",
  "task-lists",
  "strikethrough",
  "tables",
]
root_path = "."
[diagnostics]
enabled = true
ignored = ["frontmatter-missing"]
level = "information"
[index]
build_on_change = true
build_on_save = true
[server]
completion = true
hover = true
references = true
symbol_search = true
[workspace]
include = ["**/*.md", "**/*.markdown"]
exclude = ["node_modules/**", "**/tmp/**"]
