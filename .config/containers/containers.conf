[containers]
annotations = []
apparmor_profile = "container-default"
base_hosts_file = ""
cgroup_conf = ["memory.high=1073741824"]
cgroupns = "private"
cgroups = "enabled"
container_name_as_hostname = false
default_capabilities = []
default_sysctls = [
  "net.ipv4.ping_group_range=0 0",
]
default_ulimits = [
  "nofile=1280:2560",
]
devices = []
dns_options = []
dns_searches = []
dns_servers = []
env = [
  "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin",
]
env_host = true
host_containers_internal_ip = ""
http_proxy = true
init = false
init_path = "/usr/lib/podman/catatonit"
ipcns = "private"
interface_name = ""
keyring = true
label = true
label_users = true
log_driver = "journald"
log_size_max = -1
log_tag = ""
mounts = []
netns = ""
no_hosts = false
oom_score_adj = 0
pidns = "private"
pids_limit = 2048
prepare_volume_on_create = true
privileged = false
read_only = false
seccomp_profile = "$HOME/.config/containers/seccomp.jsonc"
shm_size = "65536k"
tz = ""
umask = "0022"
userns = "host"
utsns = "private"
# "<directory-on-host>:<directory-in-container>:<options>", for example:
# "/db:/var/lib/db:ro".
#volumes = []
#[engine.platform_to_oci_runtime]
#"wasi/wasm" = ["crun-wasm"]
#"wasi/wasm32" = ["crun-wasm"]
#"wasi/wasm64" = ["crun-wasm"]
[secrets]
#driver = "file"
[secrets.opts]
#root = "/example/directory"
[network]
default_rootless_network_cmd = "slirp4netns"
network_config_dir = "$HOME/.config/cni/net.d"
network_backend = "netavark"
cni_plugin_dirs = [
  "/usr/local/libexec/cni",
  "/usr/libexec/cni",
  "/usr/local/lib/cni",
  "/usr/lib/cni",
  "/opt/cni/bin",
]
netavark_plugin_dirs = [
  "/usr/local/libexec/netavark",
  "/usr/libexec/netavark",
  "/usr/local/lib/netavark",
  "/usr/lib/netavark",
]
firewall_driver = "nftables"
default_rootless_network_cmd = "slirp4netns"
network_config_dir = "$HOME/.config/cni/net.d"
dns_bind_port = 5353
pasta_options = []
[engine]
active_service = "production"
add_compression = ["gzip", "zstd", "zstd:chunked"]
compat_api_enforce_docker_hub = true
compose_providers=[]
compose_warning_logs = true
compression_format = "zstd"
compression_level = 10
cgroup_manager = "cgroupfs"
conmon_env_vars = [
  "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
]
conmon_path = [
  "/usr/libexec/podman/conmon",
  "/usr/local/libexec/podman/conmon",
  "/usr/local/lib/podman/conmon",
  "/usr/bin/conmon",
  "/usr/sbin/conmon",
  "/usr/local/bin/conmon",
  "/usr/local/sbin/conmon"
]
compat_api_enforce_docker_hub = true
database_backend = ""
detach_keys = "ctrl-p,ctrl-q"
enable_port_reservation = true
env = []
#events_logfile_path=""
events_logfile_max_size = "1m"
events_logger = "journald"
events_container_create_inspect_data = true
healthcheck_events = true
helper_binaries_dir = [
  "/usr/local/libexec/podman",
  "/usr/local/lib/podman",
  "/usr/libexec/podman",
  "/usr/lib/podman",
]
hooks_dir = [
  "$HOME/.configcontainers/oci/hooks.d",
]
cdi_spec_dirs = [
  "/etc/cdi",
  "/var/run/cdi",
"$HOME/.config/cdi"
]
image_default_format = ""
#image_default_transport = "docker://"
image_parallel_copies = 0
image_volume_mode = ""
infra_command = "/pause"
infra_image = ""
kube_generate_type = "pod"
lock_type = "shm"
multi_image_archive = true
namespace = ""
#network_cmd_path = ""
network_cmd_options = []
no_pivot_root = false
num_locks = 2048
pod_exit_policy = "continue"
pull_policy = "missing"
remote = true
retry = 3
retry_delay = "2s"
runtime = "crun"
runtime_supports_json = ["crun", "runc", "kata", "runsc", "youki", "harmony", "krun"]
runtime_supports_kvm = ["kata", "krun"]
runtime_supports_nocgroups = ["crun", "krun"]
image_copy_tmp_dir = "$HOME/.local/tmp"
service_timeout = 5
static_dir = "$HOME/.local/share/containers/storage/libpod"
stop_timeout = 10
exit_command_delay = 300
[engine.service_destinations]
uri = "unix:///run/user/1000/podman/podman.sock"
tmp_dir = "$HOME/.local/tmp"
volume_path = "$HOME/.local/share/containers/storage/volumes"
volume_plugin_timeout = 5
[engine.runtimes]
crun = [
  "/usr/bin/crun",
  "/bin/crun",
]
kata = [
  "/usr/bin/kata-runtime",
  "/bin/kata-runtime",
  "/usr/bin/kata-qemu",
  "/usr/bin/kata-fc",
]
runc = [
  "/usr/bin/runc",
  "/bin/runc",
  "/usr/lib/cri-o-runc/sbin/runc",
]
runsc = [
  "/usr/bin/runsc",
  "/bin/runsc",
]
youki = [
  "/usr/local/bin/youki",
  "/usr/bin/youki",
  "/bin/youki",
]
[engine.volume_plugins]
[machine]
cpus=1
disk_size=10
image = ""
memory=2048
user = "core"
volumes = [
  "$HOME:$HOME",
]
provider = "libkrun"
rosetta=false
[farms]
default = ""
[farms.list]
[podmansh]
shell = "/bin/sh"
container = "podmansh"
timeout = 30
