# =============================================================================
# tempest -- Python logging configuration (logging.conf)
# =============================================================================
# What this is: the standard Python logging config file (see the logging
# module's fileConfig format) used when tempest runs with
# --log-config /etc/tempest/logging.conf. ELI5: where the exam proctor's
# notes go -- which notebook (handlers), how detailed (levels), and in
# what handwriting (formatters).
# Defines loggers (root), handlers (file -> tempest.log, devel ->
# stdout, syslog), and formatters (simple, tests). When a logging config
# file is used, all other oslo.log options in tempest.conf are ignored.
# Source: upstream tempest 28.0.0 etc/logging.conf.sample (accessed
# 2026-09-28; https://github.com/openstack/tempest).
# Real location: /etc/tempest/logging.conf
# ---
[loggers]
keys=root

[handlers]
keys=file,devel,syslog

[formatters]
keys=simple,tests

[logger_root]
level=DEBUG
handlers=file

[handler_file]
class=FileHandler
level=DEBUG
args=('tempest.log', 'w+')
formatter=tests

[handler_syslog]
class=handlers.SysLogHandler
level=ERROR
args = ('/dev/log', handlers.SysLogHandler.LOG_USER)

[handler_devel]
class=StreamHandler
level=DEBUG
args=(sys.stdout,)
formatter=simple

[formatter_tests]
class = oslo_log.formatters.ContextFormatter

[formatter_simple]
format=%(asctime)s.%(msecs)03d %(process)d %(levelname)s: %(message)s
