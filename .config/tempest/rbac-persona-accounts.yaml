# =============================================================================
# tempest -- RBAC persona test accounts (rbac-persona-accounts.yaml)
# =============================================================================
# What this is: the account roster for tempest's RBAC (role-based access
# control) test personas: system/domain/project scoped users with
# admin/member/reader roles. ELI5: a cast list -- every role in the play
# (admin, member, reader) at every level (whole theater=system,
# troupe=domain, stage=project) gets its own actor.
# Format: a YAML list like accounts.yaml (username, password,
# user_domain_name, roles, plus one of: system, domain_name,
# project_name). Used by the RBAC test framework to pick credentials.
# Source: upstream tempest 28.0.0 etc/rbac-persona-accounts.yaml.sample
# (accessed 2026-09-28; https://github.com/openstack/tempest).
# Passwords below are the upstream sample placeholders -- replace with
# real credentials on the machine, never commit real ones.
# Real location: /etc/tempest/rbac-persona-accounts.yaml
# ---
