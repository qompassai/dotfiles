version: 4
homeassistant:
    enabled: false
frontend:
    enabled: true
     port: 8080
mqtt:
    base_topic: zigbee2mqtt
    server: 'mqtt://localhost'
     user: "$(pass show mqtt/user)"
     password: "$(pass show mqtt/pass)"

 serial:
     adapter: zstack
     enabled: false
advanced:
     channel: 11
    network_key: GENERATE
    pan_id: GENERATE
    ext_pan_id: GENERATE
