<diff-presets>
    <preset name="Default"
	    current-model="true"
	    store-in-file="true"
	    keep-cluster-objs="true"
	    keep-objs-perms="true"
	    dont-drop-missing-objs="false"
	    drop-missing-cols-constrs="false"
	    preserve-db-name="true"
	    drop-trunc-cascade="true"
	    reuse-sequences="true"
	    recreate-unmod-objs="false"
		replace-mod-objs="true"
	    import-sys-objs="false"
	    import-ext-objs="false"
	    ignore-import-errors="false"
	    ignore-duplic-errors="false"
	    run-in-transaction="true"
		match-by-signature="true"
		only-matching="true" 
		forced-filtering="constraint,rule,trigger,index,policy"/>
</diff-presets>
