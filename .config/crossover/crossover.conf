; /qompassai/dotfiles/.config/crossover/crossover.conf

[general]
bottle=QompassSalesforce

bottle_dir=/home/$USER/.cxoffice
debug_logging=0
[environment]
CX_NO_CRASH_DIALOG=1
LANG=en_US.UTF-8
LC_ALL=en_US.UTF-8
WINEDLLOVERRIDES=mscoree,mshtml=n

[wine]
WINEARCH=win64
WINVER=win11
DLLOverrides=msvcp140=n,b;vcruntime140=n,b
[graphics]
virtual_desktop=0
virtual_desktop_width=1920
virtual_desktop_height=1080
dpi_aware=1

[apps]
[salesforce_dataloader]
exe=/home/$USER/.cxoffice/QompassSalesforce/drive_c/Program Files/Dataloader/dataloader.exe
working_dir=/home/USER
arguments=
