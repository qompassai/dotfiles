# Reference: https://learn.microsoft.com/en-us/windows/wsl/wsl-config
[automount]
enabled = true
mountFsTab = true
root = /mnt
options = "metadata,uid=1000,gid=1000,umask=22,fmask=11"
[interop]
enabled = true
appendWindowsPath = true

[user]
default = $USER

[network]
hostname = $NETWORK
generateHosts = true
generateResolvConf = true

[gpu]
enabled = true
appendLibPath = true

[boot]
systemd=true

[ldconfig]
enabled = true
