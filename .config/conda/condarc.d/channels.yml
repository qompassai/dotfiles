# AI/ML optimized channels
channels:
  - anaconda
  - bioconda
  - conda-forge
  - defaults
  - fastai
  - huggingface
  - intel
  - nvidia
  - nvidia/label/cuda-12.0.0
  - nvidia/label/cuda-12.8.0
  - nvidia/label/dev
  - plotly
  - pytorch
  - pyviz
  - rapidsai
  - rapidsai/label/cuda12

# Channel settings
channel_priority: strict
show_channel_urls: true
use_only_tar_bz2: false

# Platform support
subdirs:
  - linux-64
  - noarch
