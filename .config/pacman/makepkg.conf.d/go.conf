#!/hint/bash
# shellcheck disable=2034,2155
## /qompassai/dotfiles/.config/pacman/makepkg.conf.d/go.conf
# Qompass AI Makepkg Go Config
# Copyright (C) 2025 Qompass AI, All rights reserved
##########################################################
export LDFLAGS="${LDFLAGS/-fuse-ld=lld/}"
export LDFLAGS="${LDFLAGS} -fuse-ld=bfd"
export GOROOT="/usr/lib/go"
export GOPATH="${XDG_DATA_HOME:-$HOME/.local/share}/go"
export GOBIN="${GOPATH}/bin"
export GOMODCACHE="${XDG_CACHE_HOME:-$HOME/.cache}/go/mod"
export GOCACHE="${XDG_CACHE_HOME:-$HOME/.cache}/go/build"
export GOTMPDIR="${XDG_CACHE_HOME:-$HOME/.cache}/go/tmp"
export GOFLAGS="-buildmode=pie -trimpath -ldflags=-linkmode=external -mod=readonly -modcacherw"
export CGO_ENABLED=1
export CGO_CFLAGS="${CFLAGS}"
export CGO_CPPFLAGS="${CPPFLAGS}"
export CGO_CXXFLAGS="${CXXFLAGS}"
export CGO_LDFLAGS="${LDFLAGS}"
export GOPROXY="https://proxy.golang.org,direct"
export GOSUMDB="sum.golang.org"
# export GOPRIVATE="github.com/qompassai/*"
# export GONOPROXY="github.com/qompassai/*"
export GOMAXPROCS=$(nproc)
mkdir -p "${GOTMPDIR}" "${GOCACHE}" "${GOMODCACHE}" "${GOBIN}" 2>/dev/null || true
