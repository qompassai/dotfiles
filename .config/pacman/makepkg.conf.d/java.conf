export GRAALVM_HOME="/usr/lib/jvm/java-25-graalvm"
export JAVA_HOME="${GRAALVM_HOME}"
export PATH="${GRAALVM_HOME}/bin:${PATH}"
export GRADLE_OPTS="-Xmx4g -XX:MaxMetaspaceSize=1g -Dorg.gradle.daemon=true"
export GRADLE_USER_HOME="${XDG_CACHE_HOME:-$HOME/.cache}/gradle"
export ORG_GRADLE_PROJECT_org_gradle_parallel=true
export ORG_GRADLE_PROJECT_org_gradle_workers_max=$(nproc)
export MAVEN_OPTS="-Xmx4g -XX:+TieredCompilation -XX:TieredStopAtLevel=1"
export NATIVE_IMAGE_OPTIONS="--future-defaults=all \
  -H:MaxHeapSize=4g \
  -march=x86-64-v3 \
  -O3 \
  --gc=G1 \
  --enable-preview \
  --strict-image-heap"
export NATIVE_IMAGE_USER_HOME="${XDG_CONFIG_HOME:-$HOME/.config}/native-image"
export NATIVE_IMAGE_CONFIG_FILE="${NATIVE_IMAGE_USER_HOME}/default.properties"
export PATH="${GRAALVM_HOME}/bin:${PATH}"
