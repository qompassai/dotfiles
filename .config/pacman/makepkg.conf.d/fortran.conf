#!/hint/bash
# shellcheck disable=2034,2155
## /qompassai/dotfiles/.config/pacman/makepkg.conf.d/fortran.conf
# Qompass AI Makepkg Fortran Config
# Copyright (C) 2025 Qompass AI, All rights reserved
##########################################################
export FC="gfortran"
export F77="gfortran"
export F90="gfortran"
export F95="gfortran"
FFLAGS="-march=x86-64-v3 -mtune=native -O2 -pipe -fno-plt \
        -Wp,-D_FORTIFY_SOURCE=3 -fstack-clash-protection -fcf-protection \
        -fno-omit-frame-pointer -mno-omit-leaf-frame-pointer \
        -mavx2 -mfma -mbmi -mbmi2 -mf16c -mavxvnni \
        -fno-math-errno -fno-signed-zeros -fno-trapping-math -fassociative-math \
        -frecursive -fimplicit-none -Wall -Wextra"

FCFLAGS="$FFLAGS"
DEBUG_FFLAGS="-g -fbacktrace -fbounds-check -fcheck=all"
export OMP_NUM_THREADS=$(nproc)
export OMP_STACKSIZE=256M
export OMP_PROC_BIND=true
export BLA_VENDOR="Intel10_64lp"
export MKLROOT="/opt/intel/oneapi/mkl/latest"
export MKL_THREADING_LAYER="GNU"
export MKL_INTERFACE_LAYER="LP64"
export BLAS_LIBS="-L${MKLROOT}/lib/intel64 -lmkl_gf_lp64 -lmkl_gnu_thread -lmkl_core -lgomp -lpthread -lm -ldl"
export LAPACK_LIBS="-L${MKLROOT}/lib/intel64 -lmkl_gf_lp64 -lmkl_gnu_thread -lmkl_core -lgomp -lpthread -lm -ldl"
export FPM_FC="gfortran"
export FPM_FFLAGS="$FFLAGS"
export FPM_LDFLAGS="$LDFLAGS"
export FORTRAN_MODDIR="/usr/include/fortran"
FOPTFLAGS="-funroll-loops -ftree-vectorize"
FFLAGS="$FFLAGS $FOPTFLAGS"

