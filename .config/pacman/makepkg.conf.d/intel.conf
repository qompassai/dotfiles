# shellcheck disable=2034
## /qompassai/dotfiles/.config/pacman/makepkg.conf.d/openvino.conf
# Qompass AI OpenVINO Configuration
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
export OPENVINO_CMAKE_FLAGS=(
    -DENABLE_SSE42=ON
    -DENABLE_AVX2=ON
    -DENABLE_AVX512F=OFF
    -DTHREADING=TBB_AUTO
    -DENABLE_TBBBIND_2_5=ON
    -DENABLE_LTO=ON 
    -DENABLE_INTEL_CPU=ON
    -DENABLE_INTEL_GPU=ON
    -DENABLE_INTEL_NPU=OFF
    -DENABLE_AUTO=ON
    -DENABLE_MULTI=ON
    -DENABLE_HETERO=ON
    -DENABLE_OV_ONNX_FRONTEND=ON
    -DENABLE_OV_PYTORCH_FRONTEND=ON
    -DENABLE_OV_TF_FRONTEND=ON
    -DENABLE_OV_TF_LITE_FRONTEND=ON
    -DENABLE_OV_PADDLE_FRONTEND=OFF
    -DENABLE_OV_JAX_FRONTEND=OFF
    -DENABLE_SYSTEM_TBB=ON
    -DENABLE_SYSTEM_PUGIXML=ON
    -DENABLE_SYSTEM_PROTOBUF=OFF
    -DENABLE_SYSTEM_OPENCL=ON
    -DENABLE_MLAS_FOR_CPU=ON
    -DENABLE_SAMPLES=OFF
    -DENABLE_TESTS=OFF
    -DENABLE_DOCS=OFF
    -DENABLE_PROFILING_ITT=OFF
)
export OV_CPU_THREADS_NUM=0
export OV_CPU_THROUGHPUT_STREAMS=0
export OV_CPU_BIND_THREAD=YES
export OMP_NUM_THREADS=$(nproc)
export MKL_CBWR=AUTO
OPENVINO_CXXFLAGS="-march=x86-64-v3 -mtune=native -mavx2 -mfma -O3 -ffast-math"
export DNNL_VERBOSE=0
export DNNL_MAX_CPU_ISA=AVX2

