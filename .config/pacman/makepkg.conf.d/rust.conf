export CARGO_HOME="${XDG_CACHE_HOME:-$HOME/.cache}/cargo"
export CARGO_TARGET_DIR="${BUILDDIR}/.cargo/target"
export CARGO_BUILD_JOBS=$(nproc)
export CARGO_INCREMENTAL=0
export CARGO_HTTP_CHECK_REVOKE=false
export RUSTFLAGS="-C target-cpu=x86-64-v3 -C opt-level=3 -C codegen-units=1 -C force-frame-pointers=yes -C linker=clang -C link-arg=-fuse-ld=lld"
export CARGO_PROFILE_RELEASE_LTO=true
export CARGO_PROFILE_RELEASE_CODEGEN_UNITS=1
export SCCACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/sccache"
export ZIG_GLOBAL_CACHE_DIR="${XDG_CACHE_HOME:-$HOME/.cache}/zig"

