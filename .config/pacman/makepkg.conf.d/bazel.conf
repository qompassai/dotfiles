#!/hint/bash
# shellcheck disable=2034,2155
## /qompassai/dotfiles/.config/pacman/makepkg.conf.d/bazel.conf
# Qompass AI Bazel Config
##########################################################
export CXXFLAGS="${CXXFLAGS//-std=c++*/}"
export CXXFLAGS="${CXXFLAGS//-std=gnu++*/}"
export XDG_CONFIG_HOME="${XDG_CONFIG_HOME:-$HOME/.config}"
export XDG_CACHE_HOME="${XDG_CACHE_HOME:-$HOME/.cache}"
export BAZEL_USER_RC="${XDG_CONFIG_HOME}/bazel/.bazelrc"
mkdir -p "${XDG_CONFIG_HOME}/bazel"
if [[ ! -f "${XDG_CONFIG_HOME}/bazel/.bazelrc" ]]; then
    cat > "${XDG_CONFIG_HOME}/bazel/.bazelrc" << 'EOF'
build --cxxopt=-std=c++20
build --cxxopt=-march=x86-64-v3
build --copt=-march=x86-64-v3
build --host_cxxopt=-std=c++20
build --host_cxxopt=-march=x86-64-v3
build --host_copt=-march=x86-64-v3
build --linkopt=-fuse-ld=lld
build --check_direct_dependencies=off
EOF
fi
