####################################################
export MAX_JOBS=$(nproc)
export NPY_NUM_BUILD_JOBS=$(nproc)
export PIP_NO_BUILD_ISOLATION=1
export PIP_NO_CACHE_DIR=1
export PIP_DISABLE_PIP_VERSION_CHECK=1
export PYTHONDONTWRITEBYTECODE=1
export PYTHONOPTIMIZE=2
export PYTHONNOUSERSITE=1
export UV_NO_BUILD_ISOLATION=1
export PYTHON_EXECUTABLE="/usr/bin/python"
export Python3_EXECUTABLE="/usr/bin/python"
export Python3_ROOT_DIR="/usr"
export CMAKE_PREFIX_PATH="/usr:${CMAKE_PREFIX_PATH}"
export Python3_INCLUDE_DIR="/usr/include/python3.14"
export Python3_LIBRARY="/usr/lib/libpython3.14.so"
export Python3_ROOT_DIR="/usr"
export PYTHONWARNINGS="ignore::RuntimeWarning:pycparser,ignore::UserWarning:setuptools"
