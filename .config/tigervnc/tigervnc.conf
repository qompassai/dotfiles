$USER      = $ENV{USER};
$HOME      = $ENV{HOME};
$geometry  = "2560x1440";
$dpi       = "125";
$session   = "hyprland"; 
# Security settings
$securitytypes = "vncauth,tlsvnc";
$localhost     = "yes";
$alwaysshared  = "yes";
$depth         = "24";
$preferredEncoding = "h264";
$jpegquality   = "9";
$compression   = "9";
$tlscertsdir   = $HOME . "/.config/tigervnc/certs";
$tlspriority   = "SECURE128";
$maxrects      = "2048";
$xstartup      = $HOME . "/.vnc/xstartup";
$PATH          = $ENV{PATH} . ":/usr/local/bin";
