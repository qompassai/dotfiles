# yaml-language-server: $schema=../schema/device_profile_v1.json
version: 1
kind: DeviceProfile
name: Test Profile
mapping:
  - name: Guide Button
    source_event:
      keyboard: KeyRightCtrl
    target_events:
      - gamepad:
          button: Guide
  - name: A to axis
    source_event:
      keyboard: KeyA
    target_events:
      - gamepad:
          axis:
            name: Hat1
            direction: left
  - name: A
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: left
          deadzone: 0.3
    target_events:
      - keyboard: KeyA
  - name: D
    source_event:
      gamepad:
        axis:
          name: LeftStick
          direction: right
          deadzone: 0.3
    target_events:
      - keyboard: KeyD
  - name: Joystick Mouse
    source_event:
      gamepad:
        axis:
          name: RightStick
    target_events:
      - mouse:
          motion: {}
  - name: Gyro Mouse
    source_event:
      gamepad:
        gyro:
          name: Gyro1
    target_events:
      - mouse:
          motion: {}
  - name: Gyro Stick
    source_event:
      gamepad:
        gyro:
          name: Gyro1
    target_events:
      - gamepad:
          axis:
            name: RightStick
  - name: Gyro Key
    source_event:
      gamepad:
        gyro:
          name: Gyro1
          axis: yaw
          direction: positive
          deadzone: 0.3
    target_events:
      - keyboard: KeyW
  - name: Steam QuickAccess Chord
    source_event:
      gamepad:
        button: QuickAccess
    target_events:
      - gamepad:
          button: Guide
      - gamepad:
          button: South
  - name: DBus QuickAccess
    source_event:
      gamepad:
        button: QuickAccess
    target_events:
      - dbus: ui_quick
  - name: Trigger to button
    source_event:
      gamepad:
        trigger:
          name: LeftTrigger
          deadzone: 0.4
    target_events:
      - gamepad:
          button: South
