[cert]
name = "qompass.ai."
dns_names = ["qompass.ai", "www.qompass.ai"]
exec = [
    "systemctl --user reload nginx",
    "logger 'ACME cert renewed for example.com'",
    "~/.local/bin/cert-renewal-notify --domain example.com"
]
acme_url = "https://acme-v02.api.letsencrypt.org/directory"
backup_acme_url = "https://acme.zerossl.com/v2/DV90"
chall_types = ["http-01", "dns-01", "tls-alpn-01"]
key_path = "$(pass show acmeredir/keypath)"
cert_path = "$(pass show acmeredir/certpath)"
status_file = "~/.local/state/acme-redirect/status.json"
backup_dir = "$(pass show acmeredir/backupdir)"

[monitor]
alert_email = "$(pass show acmeredir/alertmail)"
expiry_threshold_days = 30

[log]
log_file = "~/.local/state/acme-redirect/acme-redirect.log"
log_level = "info"
