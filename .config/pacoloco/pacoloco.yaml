cache_dir: /var/cache/pacoloco
port: 9129
download_timeout: 3600
purge_files_after: 2592000 
set_timestamp_to_logs: true
repos:
  archlinux:
    urls: ##  https://archlinux.org/mirrors/status/
      - http://mirror.lty.me/archlinux
      - http://mirrors.kernel.org/archlinux
  archlinux-reflector:
    mirrorlist: /etc/pacman.d/mirrorlist #
  quarry:
    http_proxy: http://bar.company.com:8989
#    url: http://pkgbuild.com/~anatolik/quarry/x86_64
prefetch:
  cron: 0 0 3 * * * * #(https://en.wikipedia.org/wiki/Cron#CRON_expression) | https://github.com/gorhill/cronexpr#implementation 
ttl_unaccessed_in_days: 30
ttl_unupdated_in_days: 300
# http_proxy: http://proxy.company.com:8888
user_agent: Pacoloco/1.2
