[hplip]
version=3.25.6
[dirs]
apparmor=/etc/apparmor.d
bin=/usr/bin
cupsbackend=/usr/lib/cups/backend
cupsfilter=/usr/lib/cups/filter
doc=/usr/share/doc/hplip-3.25.6
drv=/usr/share/cups/drv/hp
home=/usr/share/hplip
html=/usr/share/doc/hplip-3.25.6
icon=/usr/share/applications
ppd=/usr/share/ppd/HP
ppdbase=/usr/share/ppd
run=/var/run/user/1000
[configure]
apparmor_build=yes
class-driver=no
cups11-build=no
cups-drv-install=yes
cups-ppd-install=yes
dbus-build=yes
doc-build=yes
fax-build=yes
foomatic-drv-install=no
foomatic-ppd-install=no
foomatic-rip-hplip-install=no
gui-build=yes
hpcups-install=yes
hpcups-only-build=no
hpijs-install=no
hpijs-only-build=no
internal-tag=3.25.6
libusb01-build=no
lite-build=no
network-build=yes
policy-kit=yes
pp-build=yes
qt3=no
qt4=yes
qt5=yes
restricted-build=no
scanner-build=yes
shadow-build=no
udev_sysfs_rules=no
ui-toolkit=qt5
