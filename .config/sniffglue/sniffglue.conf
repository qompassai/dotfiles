# References: https://man.archlinux.org/man/extra/sniffglue/sniffglue.1.en
[capture]
interface = "eth0"
threads = 4
promisc = true
filter = "tcp or udp"
[logging]
log_file = "/var/log/sniffglue/sniffglue.log"
log_level = "info"
output_format = "text"
[sandbox]
user = "$(pass show sniffglue/user)"
chroot = "$(pass show sniffglue/chroot)"
[security]
seccomp_policy = "$(pass show sniffglue/seccomp)"
