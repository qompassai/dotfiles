;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;;
[unix_http_server]
file=/usr/share/supervisor/performance_analyzer/supervisord.sock
chmod=0770
[supervisord]
logfile=/usr/share/supervisor/performance_analyzer/supervisord.log
pidfile=/usr/share/supervisor/performance_analyzer/supervisord.pid
childlogdir=/usr/share/supervisor/performance_analyzer
[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface
[supervisorctl]
serverurl=/usr/share/supervisord.sock
[include]
files = /etc/supervisor/conf.d/*.conf
[program:performance_analyzer]
command=/usr/share/opensearch/performance-analyzer-rca/bin/performance-analyzer-agent /usr/share/opensearch
user=1000
autostart=true
autorestart=unexpected
exitcodes=1
[eventlistener:stop_supervisord]
command=bash -c "printf 'READY\n' && while read line; do kill -SIGQUIT $PPID; done < /dev/stdin"
events=PROCESS_STATE_FATAL
buffer_size=100
