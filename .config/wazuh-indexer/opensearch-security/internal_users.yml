---
# /qompassai/dotfiles/.config/wazuh-indexer/opensearch-security/internal_users.yml
# Qompass AI Wazuh-Indexer OpenSearch Security Internal Users Config
# Copyright (C) 2025 Qompass AI, All rights reserved
##################################################################################
_meta:
  type: "internalusers"
  config_version: 2
admin:
  hash: "$(pass show wazuh-indexer/adminhash)"
  reserved: true
  backend_roles:
  - "admin"
  description: "Admin user"
anomalyadmin:
  hash: "$(pass show wazuh-indexer/anomalyadminhash)"
  reserved: false
  opendistro_security_roles:
  - "anomaly_full_access"
  description: "Demo anomaly admin user, using internal role"
kibanaserver:
  hash: "$(pass show wazuh-indexer/anomalyadminhash)"
  reserved: true
  description: "Demo OpenSearch Dashboards user"
kibanaro:
  hash: "$(pass show wazuh-indexer/kibanarohash)"
  reserved: false
  backend_roles:
  - "kibanauser"
  - "readall"
  attributes:
    attribute1: "$(pass show wazuh-indexer/kibanaroattribute1)"

logstash:
  hash: "$(pass show wazuh-indexer/logstashhash)"
  reserved: false
  backend_roles:
  - "logstash"

readall:
  hash: "$(pass show wazuh-indexer/readallhash)"
  reserved: false
  backend_roles:
  - "readall"
snapshotrestore:
  hash: "$(pass show wazuh-indexer/snapshotrestorehash)"
  reserved: false
  backend_roles:
  - "snapshotrestore"
