# Reference https://man.archlinux.org/man/fuzzel.ini.5.en
anchor=center
dpi-aware=yes
dpi-aware=yes
font=Gabarito
hide-prompt=no
horizontal-pad=32
inner-pad=10
letter-spacing=1
line-height=24
prompt=">>  "
layer=overlay
terminal=ghostty -e
vertical-pad=16
width=40
[colors]
background=1D2233F0
text=E6F6FFff
selection=00F0FFcc
selection-text=1D2233ff
border=00BFFFcc 
match=7DF9FFff
selection-match=7DF9FFff    
prompt=00F0FFff
[border]
radius=17
width=2
[dmenu]
exit-immediately-if-empty=yes
