# Reference: https://www.gnupg.org/documentation/manuals/gnupg/Dirmngr-Options.html
#dirmngr --gpgconf-test
allow-ocsp
connect-timeout 30
debug-level advanced
# disable-http
# disable-ipv4
# disable-ipv6
disable-ldap
homedir ~/.gnupg
#honor-http-proxy
log-file ~/.gnupg/dirmngr.log
hkp-cacert /etc/ssl/certs/ca-certificates.crt
keyserver hkps://keys.openpgp.org
keyserver hkps://keyserver.ubuntu.com
#keyserver hkps://jirk5u4osbsr34t5.onion
no-use-tor
recursive-resolver
#standard-resolver
#use-tor
verbose
