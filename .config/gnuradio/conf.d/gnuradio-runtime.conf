[DEFAULT]
verbose = True
max_messages = 8192
buffer_size = 32768
[LOG]
log_level = info
debug_level = trace
log_file = stdout
debug_file = stderr
[PerfCounters]
on = False
export = False
clock = thread
clock = monotonic
[ControlPort]
on = False
edges_list = False
