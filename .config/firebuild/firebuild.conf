version = 1.0;
env_vars = {
  pass_through = [ "HOME", "PATH", "SHELL", "PWD"];

  fingerprint_skip = ["MAKE_TERMOUT", "MAKE_TERMERR", "MAKEFLAGS", "MFLAGS", "CARGO_MAKEFLAGS"];

  preset = [
    "CCACHE_DISABLE=1"
  ];
};
processes = {
  shortcut_allow_list = [];
  dont_shortcut = [
    "make", "ninja",
    // "sleep",
    "stat",
    "ls"
  ];
  dont_intercept = [
    "fakeroot",
    // "ccache",
    "gradle",
    "go",
    "sandbox-exec"
  ];
  skip_cache = [
    // "sh",
    // coreutils
    "arch", "basename", "cat", "chgrp", "chmod", "chown", "cp", "cut",
    "dd", "dir", "dirname", "expr", "head", "install", "link", "ln",
    "mkdir", "mv", "readlink", "realpath", "rm", "rmdir",
    "seq", "tail", "touch", "tr", "unlink",
    "[", "echo", "false", "printf", "pwd", "test", "true",
    "egrep", "fgrep", "grep", "rgrep", "sed"
  ];

  shells = [
    "/bin/bash",
    "/bin/dash",
    "/bin/sh",
    "bash",
    "dash",
    "sh"
  ];
};
ignore_locations = [
  "/dev/autofs_nowait",
  "/dev/full",
  "/dev/null",
  "/dev/random",
  "/dev/tty",
  "/dev/urandom",
  "/dev/zero",
  "/proc/cpuinfo",
  "/proc/filesystems",
  "/proc/net",
  "/proc/meminfo",
  "/proc/self",
  "/proc/stat",
  "/sys/devices",
  "/sys/fs/cgroup",
  "/var/run/syslog",
  "/var/run/usbmuxd"
];
read_only_locations = [
  "/bin", "/etc", "/lib", "/lib32", "/libx32", "/lib64", "/opt", "/proc/sys", "/sbin", "/snap", "/usr"
];
min_cpu_time = 0.000;
quirks = [
  "ignore-time-queries",
  "ignore-tmp-listing",
  "lto-wrapper",
  "ignore-statfs",
  "guess-file-params"
];
shortcut_tries = 20;

max_cache_size = 5.0

max_entry_size = 250.0
