server:
    chroot: ""
    directory: "${directory}"
    define-tag: "${define_tag}"
    access-control: ${access_control_127}
    access-control-tag: ${access_control_tag}
    access-control: ${access_control_ipv6}
    access-control: ${access_control_192}
    access-control: ${access_control_10}
    access-control: ${access_control_172}
    aggressive-nsec: yes
    auto-trust-anchor-file: "${auto_trust_anchor_file}"
    cache-max-ttl: ${cache_max_ttl}
    cache-min-ttl: ${cache_min_ttl}
    cookie-secret-file: "${cookie_secret_file}"
    delay-close: ${delay_close}
    deny-any: no
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    do-not-query-localhost: no
    domain-insecure: "${private_domain}"
    edns-buffer-size: ${edns_buffer_size}
    extended-statistics: yes
    fast-server-permil: 0
    fast-server-num: 3
    harden-algo-downgrade: yes
    harden-below-nxdomain: yes
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-large-queries: yes
    harden-referral-path: yes
    harden-short-bufsize: yes
    harden-unverified-glue: yes
    hide-identity: yes
    hide-version: yes
    infra-cache-min-rtt: ${infra_cache_min_rtt}
    infra-cache-slabs: ${infra_cache_slabs}
    infra-host-ttl: ${infra_host_ttl}
    insecure-lan-zones: no
    interface-automatic: yes
    interface-automatic-ports: "${interface_auto_ports}"
    interface: ${interface_auto}
    interface: ${interface_ipv6}
    interface: ${interface_localhost}
    jostle-timeout: ${jostle_timeout}
    key-cache-slabs: ${key_cache_slabs}
    key-cache-size: ${key_cache_size}
    local-data: "${local_data_analytics_github}"
    local-data: "${local_data_api_ai_1}"
    local-data: "${local_data_api_ai_2}"
    local-data: "${local_data_blocked_ip}"
    local-data: "${local_data_blocked_txt}"
    local-data: "${local_data_caffe}"
    local-data: "${local_data_doppio}"
    local-data: "${local_data_doppio2}"
    local-data: "${local_data_get_code_industry}"
    local-data: "${local_data_harbor}"
    local-data: "${local_data_harbor2}"
    local-data: "${local_data_pensare}"
    local-data: "${local_data_pensare2}"
    local-data: "${local_data_perforce}"
    local-data: "${local_data_primo}"
    local-data: "${local_data_primo2}"
    local-data: "${local_data_ssh_srv_pensare}"
    local-data: "${local_data_ssh_srv_harbor}"
    local-data: "${local_data_redis_srv}"
    local-data: "${local_data_quantum_ai_1}"
    local-data: "${local_data_quantum_ai_2}"
    local-data: "${local_data_quantum_srv}"
    local-data: "${local_data_telemetry_ms}"
    local-data: "${local_data_termux}"
    local-data: "${local_data_tracking_google}"
    local-data: "${local_data_view_localhost}"
    local-zone: "${local_zone_ai}" static
    local-zone: "${local_zone_quantum}" static
    local-zone: "${local_zone_ml}" static
    logfile: "${logfile}"
    log-local-actions: yes
    log-servfail: yes
    log-tag-queryreply: yes
    log-time-ascii: yes
    log-queries: yes
    max-reuse-tcp-queries: ${max_reuse_tcp_queries}
    max-udp-size: ${max_udp_size}
    minimal-responses: no
    msg-buffer-size: ${msg_buffer_size}
    msg-cache-size: ${msg_cache_size}
    msg-cache-slabs: ${msg_cache_slabs}
    neg-cache-size: ${neg_cache_size}
    num-queries-per-thread: ${num_queries_per_thread}
    outgoing-interface: ${outgoing_interface}
    outgoing-range: ${outgoing_range}
    outgoing-tcp-mss: ${outgoing_tcp_mss}
    prefer-ip6: no
    num-threads: ${num_threads}
    port: ${port}
    prefetch: yes
    prefetch-key: yes
    private-domain: "${private_domain}"
    qname-minimisation: yes
    qname-minimisation-strict: yes
    ratelimit: ${ratelimit}
    ratelimit-size: ${ratelimit_size}
    rrset-cache-size: ${rrset_cache_size}
    rrset-cache-slabs: ${rrset_cache_slabs}
    serve-expired: yes
    serve-expired-client-timeout: ${serve_expired_client_timeout}
    serve-expired-reply-ttl: ${serve_expired_reply_ttl}
    serve-expired-ttl: ${serve_expired_ttl}
    so-rcvbuf: ${so_rcvbuf}
    so-reuseport: yes
    so-sndbuf: ${so_sndbuf}
    statistics-interval: ${statistics_interval}
    statistics-cumulative: yes
    target-fetch-policy: "${target_fetch_policy}"
    tcp-idle-timeout: ${tcp_idle_timeout}
    tcp-reuse-timeout: ${tcp_reuse_timeout}
    tcp-upstream: yes
    tls-cert-bundle: "${tls_cert_bundle}"
    tls-ciphers: "${tls_ciphers}"
    tls-ciphersuites: "${tls_ciphersuites}"
    tls-service-key: "${tls_service_key}"
    tls-service-pem: "${tls_service_pem}"
    tls-session-ticket-keys: "${tls_session_ticket_keys}"
    trust-anchor-signaling: yes
    root-key-sentinel: yes
    unblock-lan-zones: no
    use-syslog: no
    username: "${username}"
    val-bogus-ttl: 60
    val-clean-additional: yes
    val-log-level: ${val_log_level}
    val-permissive-mode: no
    val-sig-skew-min: ${val_sig_skew_min}
    val-sig-skew-max: ${val_sig_skew_max}
    val-nsec3-keysize-iterations: "${val_nsec3_keysize_iterations}"
    verbosity: ${verbosity}

remote-control:
    control-enable: yes
    control-interface: ${control_interface}
    control-cert-file: "${control_cert_file}"
    control-key-file: "${control_key_file}"
    server-cert-file: "${server_cert_file}"
    server-key-file: "${server_key_file}"

rpz:
    name: "${rpz_name}"
    zonefile: "${rpz_zonefile}"
    rpz-action-override: "${rpz_action_override}"
    rpz-cname-override: "${rpz_cname_override}"

forward-zone:
    name: "."
    forward-tls-upstream: yes
    forward-first: yes
    forward-addr: ${forward_addr_local_tor}
    forward-addr: ${forward_addr_cloudflare_primary}
    forward-addr: ${forward_addr_quad9}
    forward-addr: ${forward_addr_cloudflare_secondary}
    forward-addr: ${forward_addr_cloudflare_ipv6_primary}
    forward-addr: ${forward_addr_cloudflare_ipv6_secondary}

forward-zone:
    name: "onion."
    forward-addr: ${forward_onion_addr}

