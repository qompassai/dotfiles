# ~/qompassai/dotfiles/.config/unbound/unbound.conf
# -------------------------------
# Copyright (C) 2025 Qompass AI, All rights reserved

 server:
    answer-cookie: yes
    chroot: ""
    directory: "/home/phaedrus/.config/unbound"
    define-tag: "tor gpg malware-filter"
    access-control: 127.0.0.0/8 allow
    access-control-tag: 127.0.0.1 "tor"
    access-control: ::1/128 allow
    access-control: 192.168.0.0/16 allow
    access-control: 10.0.0.0/8 allow
    access-control: 172.16.0.0/12 allow
    access-control: 10.66.66.0/24 allow
    access-control: 172.17.0.0/16 allow
    access-control: fd00:db8::/64 allow
    access-control: 2605:59c8:80d:2010::/64 allow
    aggressive-nsec: yes
    auto-trust-anchor-file: "/home/phaedrus/.config/unbound/var/lib/anchor.key"
    cache-max-ttl: 86400
    cache-min-ttl: 1800
    caps-whitelist: yes
    cookie-secret-file: "/home/phaedrus/.config/unbound/var/lib/cookie-secret"
    delay-close: 10000
    deny-any: no
    do-ip4: yes
    do-ip6: yes
    do-udp: yes
    do-tcp: yes
    do-not-query-localhost: no
    domain-insecure: "onion"
    edns-buffer-size: 1232
    extended-statistics: yes
    fast-server-permil: 50
    fast-server-num: 3
    harden-algo-downgrade: yes
    harden-below-nxdomain: yes
    harden-dnssec-stripped: yes
    harden-glue: yes
    harden-large-queries: yes
    harden-referral-path: yes
    harden-short-bufsize: yes
    harden-unverified-glue: yes
    hide-identity: yes
    hide-version: yes
    incoming-num-tcp: 1000
    infra-cache-min-rtt: 50
    infra-cache-slabs: 8
    infra-host-ttl: 900
    insecure-lan-zones: no
    interface-automatic: yes
    interface-automatic-ports: "53"
    interface: 0.0.0.0
    interface: ::0
    interface: 127.0.0.1
    jostle-timeout: 400
    key-cache-slabs: 8
    key-cache-size: 100m
    local-data: "analytics.github.com. A 0.0.0.0"
    local-data: "api.ai.local. A 192.168.1.23"
    local-data: "api.ai.local. A 192.168.1.36"
    local-data: "blocked.local. A 127.0.0.1"
    local-data: "blocked.local. TXT 'This domain has been blocked by DNS policy'"
    local-data: "caffe. A 192.168.1.50"
    local-data: "doppio. A 192.168.1.144"
    local-data: "doppio2. AAAA 2605:59c8:80d:2010::e99"
    #local-data: "get.code-industry.net. A 0.0.0.0"
    #local-data: "harbor. A 192.168.1.23"
    #local-data: "harbor2. AAAA fd3c:50a9:352d:10:9209:d0ff:fe2f:8ead"
    local-data: "pensare. AAAA fd3c:50a9:352d:10:57d9:557d:1d8a:427a"
    local-data: "primo. AAAA 2605:59c8:80d:2010:67c:16ff:feaa:b925"
    local-data: "primo2. A 98.97.45.229"
    local-data: "_ssh._tcp.ai.local. SRV 0 5 22 pensare.local."
    local-data: "_ssh._tcp.ai.local. SRV 0 5 22 harbor.local."
    local-data: "_redis._tcp.ai.local. SRV 0 5 6379 harbor.local."
    local-data: "quantum.ai.local. AAAA fd3c:50a9:352d:10:57d9:557d:1d8a:427a"
    local-data: "quantum.ai.local. AAAA fd3c:50a9:352d:10:9209:d0ff:fe2f:8ead"
    local-data: "_quantum._tcp.ai.local. SRV 0 5 8080 pensare.local."
    local-data: "telemetry.microsoft.com. A 0.0.0.0"
    local-data: "termux. A 192.168.1.140"
    local-data: "tracking.google.com. A 0.0.0.0"
    local-data: "view-localhost. A 127.0.0.1"
    local-data: "wg0.local. A 10.66.66.1"
    local-data: "wg0.local. AAAA fd00:db8::1"
    local-zone: "ai.local." static
    local-zone: "quantum.local." static
    local-zone: "docker.local." static
    local-zone: "ml.local." static
    local-zone: "wg.local." static
    logfile: "/home/phaedrus/.config/unbound/var/log/unbound.log"
    log-local-actions: yes
    log-servfail: yes
    log-tag-queryreply: yes
    log-time-ascii: yes
    log-queries: yes
    max-reuse-tcp-queries: 200
    max-udp-size: 1232
    minimal-responses: no
    msg-buffer-size: 65552
    msg-cache-size: 128m
    msg-cache-slabs: 8
    neg-cache-size: 10m
    num-queries-per-thread: 4096
    outgoing-interface: 0.0.0.0
    outgoing-num-tcp: 2000
    outgoing-range: 16384
    outgoing-tcp-mss: 1220
    prefer-ip6: yes
    num-threads: 6
    port: 53
    prefetch: yes
    prefetch-key: yes
    private-domain: "onion"
    qname-minimisation: yes
    qname-minimisation-strict: yes
    ratelimit: 1000
    ratelimit-size: 10000
    rrset-cache-size: 256m
    rrset-cache-slabs: 8
    serve-expired: yes
    serve-expired-client-timeout: 1800
    serve-expired-reply-ttl: 30
    serve-expired-ttl: 86400
    so-rcvbuf: 8m
    so-reuseport: yes
    so-sndbuf: 8m
    statistics-interval: 3600
    statistics-cumulative: yes
    target-fetch-policy: "3 2 1 0 0"
    tcp-idle-timeout: 30000
    tcp-reuse-timeout: 60000
    tcp-upstream: yes
    tls-cert-bundle: "/home/phaedrus/.config/qai/qssl/certs/ca-certificates.crt"
    tls-ciphers: "ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"
    tls-ciphersuites: "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256:TLS_AES_128_CCM_SHA256"
    tls-service-key: "/home/phaedrus/.config/unbound/ssl/dnssec.key"
    tls-service-pem: "/home/phaedrus/.config/unbound/ssl/dot.crt"
    tls-session-ticket-keys: "/home/phaedrus/.config/unbound/ssl/session-tickets-new.key"
    trust-anchor-signaling: yes
    root-key-sentinel: yes
    unblock-lan-zones: no
    use-caps-for-id: yes
    use-syslog: no
    username: "unbound"
    val-bogus-ttl: 60
    val-clean-additional: yes
    val-log-level: 2
    val-permissive-mode: no
    val-sig-skew-min: 3600
    val-sig-skew-max: 86400
    val-nsec3-keysize-iterations: "1024 150 2048 500 4096 2500"
    verbosity: 2

    remote-control:
        control-enable: yes
        control-interface: 127.0.0.1
        control-cert-file: "/home/phaedrus/.config/unbound/rc/rc.pem"
        control-key-file: "/home/phaedrus/.config/unbound/rc/rc.key"
        server-cert-file: "/home/phaedrus/.config/unbound/rc/rc_server.pem"
        server-key-file: "/home/phaedrus/.config/unbound/rc/rc_server.key"
    rpz:
        name: "malware"
        zonefile: "/home/phaedrus/.config/unbound/rpz/malware.zone"
        rpz-action-override: "nxdomain"
        rpz-cname-override: "blocked.local."

    forward-zone:
        name: "."
        forward-tls-upstream: yes
        forward-first: yes
        forward-addr: 2606:4700:4700::1111@853
        forward-addr: 2606:4700:4700::1001@853
        forward-addr: 1.1.1.1@853
        forward-addr: 9.9.9.9@853
        forward-addr: 1.0.0.1@853

    forward-zone:
        name: "onion."
        forward-addr: 127.0.0.1@9053
        forward-addr: ::1@9053
