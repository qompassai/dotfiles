# =============================================================================
# v4l2-relayd instance drop-in: virtual-camera
# =============================================================================
#
# What this app is:
#   `v4l2-relay` (package v4l2-relayd) plays GStreamer video sources into
#   v4l2loopback devices, creating virtual cameras (e.g. for video calls).
#   The systemd template unit v4l2-relayd@.service runs one daemon per
#   instance, and the systemd generator creates one instance for every
#   *.conf file in /etc/v4l2-relayd.d/ -- so THIS file defines an instance
#   named "virtual-camera" (v4l2-relayd@virtual-camera.service).
#
# How the pieces fit (verified against upstream 0.2.0 source):
#   1. The template unit loads EnvironmentFile=/etc/default/v4l2-relayd
#      (base defaults), then EnvironmentFile=-/etc/v4l2-relayd.d/%i.conf
#      (this file; the leading `-` means "optional"). Variables set here
#      override the base defaults for this instance only.
#   2. The unit refuses to start unless VIDEOSRC, FORMAT, WIDTH, HEIGHT,
#      FRAMERATE and CARD_LABEL are all non-empty (ExecCondition tests).
#   3. ExecStart feeds the daemon: -i "${VIDEOSRC}" for input,
#      -s "${SPLASHSRC}" for an optional splash pipeline, and -o with an
#      appsrc pipeline built from FORMAT/WIDTH/HEIGHT/FRAMERATE, writing
#      into the /dev/videoN device whose name matches CARD_LABEL.
#   4. EXTRA_OPTS is appended verbatim to the daemon command line.
#
# Doc references (accessed 2026-09-28):
#   1. Upstream project (source of the generator, template unit, default
#      env file and daemon option table):
#      https://gitlab.com/vicamo/v4l2-relayd
#   2. AUR package (build/install recipe, same upstream tarball):
#      https://aur.archlinux.org/v4l2-relayd.git
#   3. AUR RPC metadata for the package:
#      https://aur.archlinux.org/rpc/v5/info/v4l2-relayd
#
# Notes / unverifiable details:
#   - The base defaults in /etc/default/v4l2-relayd already define this
#     exact configuration, so this drop-in mainly documents and pins the
#     instance explicitly. Change the values to create a second, different
#     virtual camera (e.g. a screen-share source).
#   - VIDEOSRC is any GStreamer source element description. "videotestsrc"
#     is the upstream default (a test pattern); real uses are e.g.
#     "v4l2src device=/dev/video0" (a physical webcam) or "ximagesrc"
#     (screen capture).
#   - SPLASHSRC is explicitly empty: the unit only adds `-s` when it is
#     non-empty. Upstream's own splash example is kept as a comment.
#   - EXTRA_OPTS is explicitly empty: the unit already passes -i/-o/-s
#     itself, so the only useful extra flags are -d/--debug (debug
#     logging) and -D/--background (pointless under systemd) and -v
#     (prints the version and exits). Upstream's `#EXTRA_OPTS=-d`
#     example is kept as a comment.
#
# ELI5:
#   This file is the character sheet for one pretend camera. VIDEOSRC says
#   where the moving pictures come from, FORMAT/WIDTH/HEIGHT/FRAMERATE say
#   how big and fast each picture is, CARD_LABEL is the name tag apps see
#   ("Virtual Camera"), and the splash/extra lines are optional decorations.

# Virtual video device name (apps list this as the camera's name).
CARD_LABEL="Virtual Camera"

# Extra options appended to the v4l2-relayd command line (see header).
EXTRA_OPTS=

# Output pixel format.
FORMAT=YUY2

# Output frame rate, as a fraction.
FRAMERATE=30/1

# Output height in pixels.
HEIGHT=720

# Optional splash-screen GStreamer pipeline (empty = disabled).
SPLASHSRC=
# Upstream example:
#SPLASHSRC="filesrc location=/path/to/splash.png ! pngdec ! imagefreeze num-buffers=4 ! videoscale ! videoconvert"

# Input GStreamer source element (test pattern by default).
VIDEOSRC="videotestsrc"

# Output width in pixels.
WIDTH=1280
