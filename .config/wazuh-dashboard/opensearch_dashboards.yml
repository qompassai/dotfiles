##############################################################################################
server.host: "$(pass show wazuh-dash/host)"
server.port: "$(pass show wazuh-dash/port)"
opensearch.hosts: "$(pass show wazuh-dash/oshost)"
opensearch.ssl.verificationMode: certificate
opensearch.username: "$(pass show wazuh-dash/osuser)"
opensearch.password: "$(pass show wazuh-dash/ospass)"
opensearch.requestHeadersAllowlist: ["securitytenant","Authorization"]
opensearch_security.multitenancy.enabled: true
opensearch_security.readonly_mode.roles: ["kibana_read_only"]
server.ssl.enabled: true
server.ssl.key: "$(pass show wazuh-dash/sslkey)"
server.ssl.certificate: "$(pass show wazuh-dash/sslcert)"
opensearch.ssl.certificateAuthorities: ["$(pass show wazuh-dash/sslcaauth)"]
uiSettings.overrides.defaultRoute: /app/wz-home
opensearch_security.cookie.ttl: 900000
opensearch_security.session.ttl: 900000
opensearch_security.session.keepalive: true
