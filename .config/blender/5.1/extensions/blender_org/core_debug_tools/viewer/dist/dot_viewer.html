<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Graph Viewer</title><style>* {
        margin: 0;
        border: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        width: 100%;
        overflow: hidden;
      }

      #svg-div > svg {
        width: 100vw;
        height: 100vh;
      }

      #info {
        margin: 1rem;
      }

      #overlay {
        position: absolute;
        right: 1rem;
        top: 1rem;
      }

      #save-svg-btn {
        padding: 0.4rem;
        border-radius: 0.3rem;
        background-color: #e4f1ff;
        transition: 100ms;
      }

      #save-svg-btn:hover {
        background-color: #bacadb;
        transition: 100ms;
      }</style><script src="dot_viewer.js"></script></head><body><div id="info">Generating graph...</div><div id="svg-div"></div><div id="overlay"><button id="save-svg-btn" style="display: none">Save SVG</button></div><script>const injected_dot_graph = null;
      dot_viewer.init(injected_dot_graph);</script></body></html>
