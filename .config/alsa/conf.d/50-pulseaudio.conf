pcm.pulse {
	@args [ DEVICE ]
	@args.DEVICE {
		type string
		default ""
	}
	type pulse
	device $DEVICE
	hint {
		show {
			@func refer
			name defaults.namehint.basic
		}
		description "PulseAudio Sound Server"
	}
}
ctl.pulse {
	@args [ DEVICE ]
	@args.DEVICE {
		type string
		default ""
	}
	type pulse
	device $DEVICE
}
