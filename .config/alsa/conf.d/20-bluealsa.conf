defaults.bluealsa.device "00:00:00:00:00:00"
defaults.bluealsa.profile "a2dp"
defaults.bluealsa.codec "unchanged"
defaults.bluealsa.volume "unchanged"
defaults.bluealsa.softvol "unchanged"
defaults.bluealsa.delay 0
defaults.bluealsa.service "org.bluealsa"
defaults.bluealsa.ctl.device "FF:FF:FF:FF:FF:FF"
defaults.bluealsa.ctl.extended "yes"
defaults.bluealsa.ctl.bttransport "yes"
defaults.bluealsa.ctl.dynamic "yes"
ctl.bluealsa {
	@args [ DEV EXT BTT DYN SRV ]
	@args.DEV {
		type string
		default {
			@func refer
			name defaults.bluealsa.ctl.device
		}
	}
	@args.EXT {
		type string
		default {
			@func refer
			name defaults.bluealsa.ctl.extended
		}
	}
	@args.BTT {
		type string
		default {
			@func refer
			name defaults.bluealsa.ctl.bttransport
		}
	}
	@args.DYN {
		type string
		default {
			@func refer
			name defaults.bluealsa.ctl.dynamic
		}
	}
	@args.SRV {
		type string
		default {
			@func refer
			name defaults.bluealsa.service
		}
	}
	type bluealsa
	device $DEV
	extended $EXT
	bttransport $BTT
	dynamic $DYN
	service $SRV
	hint {
		show {
			@func refer
			name defaults.namehint.extended
		}
		description "Bluetooth Audio Control Device"
	}
}
pcm.bluealsa {
	@args [ DEV PROFILE CODEC VOL SOFTVOL DELAY SRV ]
	@args.DEV {
		type string
		default {
			@func refer
			name defaults.bluealsa.device
		}
	}
	@args.PROFILE {
		type string
		default {
			@func refer
			name defaults.bluealsa.profile
		}
	}
	@args.CODEC {
		type string
		default {
			@func refer
			name defaults.bluealsa.codec
		}
	}
	@args.VOL {
		type string
		default {
			@func refer
			name defaults.bluealsa.volume
		}
	}
	@args.SOFTVOL {
		type string
		default {
			@func refer
			name defaults.bluealsa.softvol
		}
	}
	@args.DELAY {
		type integer
		default {
			@func refer
			name defaults.bluealsa.delay
		}
	}
	@args.SRV {
		type string
		default {
			@func refer
			name defaults.bluealsa.service
		}
	}
	type plug
	slave.pcm {
		type bluealsa
		device $DEV
		profile $PROFILE
		codec $CODEC
		volume $VOL
		softvol $SOFTVOL
		delay $DELAY
		service $SRV
	}
	hint {
		show {
			@func refer
			name defaults.namehint.extended
		}
		description "Bluetooth Audio"
	}
}
