"Dhcp6": {
    "interfaces-config": {
        "interfaces": [ ]
    },
    "control-socket": {
        "socket-type": "unix",
        "socket-name": "kea6-ctrl-socket"
    },
    "lease-database": {
        "type": "memfile",
        "lfc-interval": 3600
    },
     "hosts-database": {
         "type": "mysql",
         "name": "kea",
         "user": "kea",
         "password": "$(pass show kea/dhcpy)",
         "host": "localhost",
         "port": 3306
     },
    "expired-leases-processing": {
        "reclaim-timer-wait-time": 10,
        "flush-reclaimed-timer-wait-time": 25,
        "hold-reclaimed-time": 3600,
        "max-reclaim-leases": 100,
        "max-reclaim-time": 250,
        "unwarned-reclaim-cycles": 5
    },
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "preferred-lifetime": 3000,
    "valid-lifetime": 4000,
    "option-data": [
         {
             "name": "dns-servers",
             "code": 23,
             "csv-format": "true",
             "space": "dhcp6",
             "data": "2001:db8:2::45, 2001:db8:2::100"
         }
        {
            "name": "dns-servers",
            "data": "2001:db8:2::45, 2001:db8:2::100"
        },
        {
            "code": 12,
            "data": "2001:db8::1"
        },
        {
            "name": "new-posix-timezone",
            "data": "EST5EDT4\\,M3.2.0/02:00\\,M11.1.0/02:00"
        },
        {
            "name": "preference",
            "data": "0xf0"
        },
        {
            "name": "bootfile-param",
            "data": "root=/dev/sda2, quiet, splash"
        }
    ],
     "hooks-libraries": [
       {
    //       "library": "/usr/lib/kea/hooks/libdhcp_legal_log.so",
    //       "parameters": {
    //           "base-name": "kea-forensic6"
    //       }
    //   },
    //   {
    //       "library": "/usr/lib/kea/hooks/libdhcp_flex_id.so",
    //       "parameters": {
    //           "identifier-expression": "relay6[0].option[37].hex"
    //       }
    //   },
    //   {
    //       "library": "/usr/lib/kea/hooks/libdhcp_mysql.so"
    //   }
    // ],
    "subnet6": [
        {
            "id": 1,

            "subnet": "2001:db8:1::/64",
            "pools": [ { "pool": "2001:db8:1::/80" } ],
            "pd-pools": [
                {
                    "prefix": "2001:db8:8::",
                    "prefix-len": 56,
                    "delegated-len": 64
                    // "excluded-prefix": "2001:db8:8:0:80::",
                    // "excluded-prefix-len": 72
                }
            ],
            // "relay": {
            //    "ip-addresses": [ "2001:db8:2:34::1" ]
            // },
            "option-data": [
                {
                    "name": "dns-servers",
                    "data": "2001:db8:2::dead:beef, 2001:db8:2::cafe:babe"
                }
            ],
            "reservations": [
                {
                    "duid": "01:02:03:04:05:0A:0B:0C:0D:0E",
                    "ip-addresses": [ "2001:db8:1::100" ]
                },
                {
                    "hw-address": "00:01:02:03:04:05",
                    "ip-addresses": [ "2001:db8:1::101" ],
                    "option-data": [
                        {
                            "name": "dns-servers",
                            "data": "3000:1::234"
                        },
                        {
                            "name": "nis-servers",
                            "data": "3000:1::234"
                        }],
                    "client-classes": [ "special_snowflake", "office" ]
                },
                {
                    "duid": "01:02:03:04:05:06:07:08:09:0A",
                    "ip-addresses": [ "2001:db8:1:0:cafe::1" ],
                    "prefixes": [ "2001:db8:2:abcd::/64" ],
                    "hostname": "foo.example.com",
                    "option-data": [
                        {
                            "name": "vendor-opts",
                            "data": "4491"
                        },
                        {
                            "name": "tftp-servers",
                            "space": "vendor-4491",
                            "data": "3000:1::234"
                        }
                    ]
                },
                {
                    "flex-id": "'somevalue'",
                    "ip-addresses": [ "2001:db8:1:0:cafe::2" ]
                }
            ]
        }
              {
                  "subnet": "2001:db8:2::/64",
                  "pools": [ { "pool": "2001:db8:2::/80" } ]
              },
              {
                  "subnet": "2001:db8:3::/64",
                  "pools": [ { "pool": "2001:db8:3::/80" } ]
              },
              {
                  "subnet": "2001:db8:4::/64",
                  "pools": [ { "pool": "2001:db8:4::/80" } ]
              }
    ],
    "loggers": [
    {
        "name": "kea-dhcp6",
        "output-options": [
            {
                "output": "kea-dhcp6.log"

                 "pattern": "%-5p %m\n",
                 "flush": false,
                 "maxsize": 1048576,
                // "maxver": 8
            }
        ],
        "severity": "INFO",
        "debuglevel": 0
    }
  ]
}
}
