ENABLE_SHARE=0
SHARE_INTERFACE=""
INTERFACE_IP="192.168.145.1"
DNS_SERVERS="10.202.0.1,1.1.1.1"
WIFI_INTERFACE="wlan0"
WIFI_SSID="$(pass show speedify/ssid)"
WIFI_PASSWORD="$(pass show speedify/p)"
# WIFI_MODE can either be "2.4" for 2.4GHz or "5" for 5GHz.
# WIFI_CHANNEL will default to 1 for 2.4GHz or 36 for 5GHz
#WIFI_MODE="5"
#WIFI_CHANNEL="36"
WIFI_COUNTRY="US"
SKIP_MASQUERADE=1
SKIP_HOSTAPD_CONFIG=1
