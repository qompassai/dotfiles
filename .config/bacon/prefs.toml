####################################################

help_line = true
listen = true
reverse = true
show_changes_count = true
summary = true
wrap = false
# grace_period = "15ms"
# on_change_strategy = "kill_then_restart"
# on_change_strategy = "wait_then_restart"
[jobs.bacon-ls]
command = [
  "cargo",
  "clippy",
  "--workspace",
  "--tests",
  "--all-targets",
  "--all-features",
  "--message-format",
  "json-diagnostic-rendered-ansi",
]
analyzer = "cargo_json"
need_stdout = true

[exports.cargo-json-spans]
auto = true
exporter = "analyzer"
line_format = "{diagnostic.level}|:|{span.file_name}|:|{span.line_start}|:|{span.line_end}|:|{span.column_start}|:|{span.column_end}|:|{diagnostic.message}|:|{diagnostic.rendered}|:|{span.suggested_replacement}"
path = ".bacon-locations"

[exports.locations]
cargo-json-spans = true
auto = true
exporter = "locations"
path = ".bacon-locations"
line_format = "{kind} {path}:{line}:{column} {message}"
[sound]
enabled = false
base_volume = "100%"

[keybindings]
esc = "back"
g = "scroll-to-top"
shift-g = "scroll-to-bottom"
k = "scroll-lines(-1)"
j = "scroll-lines(1)"
ctrl-c = "quit"
q = "quit"
F5 = "rerun"
alt-s = "toggle-summary"
alt-w = "toggle-wrap"
alt-b = "toggle-backtrace"
Home = "scroll-to-top"
End = "scroll-to-bottom"
Up = "scroll-lines(-1)"
Down = "scroll-lines(1)"
PageUp = "scroll-pages(-1)"
PageDown = "scroll-pages(1)"
Space = "scroll-pages(1)"
a = "job:check-all"
i = "job:initial"
c = "job:clippy-all"
d = "job:doc-open"
t = "job:test"
 r = "job:run"
ctrl-e = "export:analysis"
