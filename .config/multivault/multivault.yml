# /qompassai/dotfiles/.config/multivault/multivault.yml
# Qompass AI Multivault Config
# Copyright (C) 2025 Qompass AI, All rights reserved
#################################################
gpg:
  key_home: /tmp/keys
  key_name: default
  key_expiry: 365d
vault:
  vault_url: https://vault.internal.qompass.ai
  timeout: 20s
  secrets_path: app/secrets
ldap:
  url: ldaps://ldap.qompass.ai
  connection:
    ssh_hop: login
    forward_port: 9000
    tls_verify: true
  dc: qompass.ai
  base_dn: dc=qompass,dc=ai
  user:
    ou: people
    uid: uid
    gpg: pgpFingerprint
    groups:
      - researchers
      - devops
    masters:
      - siam: vorstand
  admin:
    group_type: openldap
    ou: sudoers
    cn: cn
    member: sudoUser
    admin_email: admin@qompass.ai
audit:
  audit_log: /var/log/multivault_audit.log
policy:
  policy_files:
    - /etc/multivault/policies/rbac.yaml
    - /etc/multivault/policies/acl.yaml

