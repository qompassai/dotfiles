services:
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    environment:
      PORT: "11011"
      PUID: "1000"
      PGID: "1000"
      TZ: "America/Los_Angeles"
    volumes:
      - /srv/cleanuparr/config:/config
      - /srv/downloads:/downloads
      - /srv/media:/media
