
base {
	log_debug = on;
	log_info = on;
	log = stderr;
	// log = "";
	// log = "syslog:local7";
	daemon = on;
	user = redsocks;
	group = redsocks;
	 chroot = "/var/chroot";
	redirector = iptables;
	tcp_keepalive_time = 0;
	tcp_keepalive_probes = 0;
	tcp_keepalive_intvl = 0;
	reuseport = on;
}
redsocks {
	bind = "127.0.0.1:12345";
	 listenq = 128;
	 min_accept_backoff = 100;
	 max_accept_backoff = 60000;
	relay = "127.0.0.1:1080";
	type = socks5;
	// interface = tun0;
	autoproxy = 0;
	timeout = 10;
	 password = "$(pass show rs2/p)";
}

redudp {
	bind = "127.0.0.1:10053";
	relay = "10.0.0.1:1080";
	login = "$(pass show redudp/u)";
	password = "$(pass show redudp/p)";
	type = shadowsocks;
	dest = "8.8.8.8:53";
	udp_timeout = 30;
	 udp_timeout_stream = 180;
}
tcpdns {
	bind = "192.168.1.1:1053";
	tcpdns1 = "8.8.4.4:53";
	tcpdns2 = "8.8.8.8" ;
	timeout = 4; 
}

autoproxy {
    // interface = wlan0;
    no_quick_check_seconds = 60;
    quick_connect_timeout = 3;
}

ipcache {
    cache_size = 4;
    stale_time = 900;
    port_check = 1;
    cache_file = "/tmp/ipcache.txt";
    autosave_interval = 3600;
}
