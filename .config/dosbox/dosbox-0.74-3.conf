# References: https://www.dosbox.com/DOSBoxManual.html
[autoexec]
[cpu]
core=dynamic
cputype=auto
cycles=max
cycledown=20
cycleup=10
[dos]
keyboardlayout=auto
ems=true
umb=true
xms=true
[dosbox]
captures=capture
language=
machine=svga_s3
memsize=16
[gus]
gus=false
gusrate=44100
gusbase=240
gusirq=5
gusdma=3
ultradir=C:\ULTRASND
[ipx]
ipx=false
[joystick]
autofire=false
buttonwrap=false
joysticktype=auto
swap34=false
timed=true
[midi]
midiconfig=
mididevice=default
mpu401=intelligent
[mixer]
blocksize=1024
nosound=false
prebuffer=25
rate=44100
[render]
aspect=false
frameskip=0
scaler=normal2x
[sblaster]
dma=1
hdma=5
irq=7
oplemu=default
oplmode=auto
oplrate=44100
sbbase=220
sbmixer=true
sbtype=sb16
[sdl]
autolock=true
fulldouble=false
fullresolution=original
fullscreen=false
mapperfile=mapper-0.74-3.map
output=surface
priority=higher,normal
sensitivity=100
usescancodes=true
waitonerror=true
windowresolution=original
[speaker]
disney=true
pcrate=44100
pcspeaker=true
tandy=auto
tandyrate=44100
[serial]
serial1=dummy
serial2=dummy
serial3=disabled
serial4=disabled
