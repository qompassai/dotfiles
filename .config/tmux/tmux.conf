# qompassai/dotfiles/.config/tmux.conf
# Qompass AI Tmux Config
# Copyright (C) 2025 Qompass AI, All rights reserved
####################################################
set-environment -g GDK_BACKEND $GDK_BACKEND
set-environment -g QT_QPA_PLATFORM $QT_QPA_PLATFORM
set-environment -g SSH_AUTH_SOCK $SSH_AUTH_SOCK
set-environment -g WAYLAND_DISPLAY $WAYLAND_DISPLAY
set-environment -g XDG_CURRENT_DESKTOP $XDG_CURRENT_DESKTOP
set-environment -g XDG_SESSION_TYPE $XDG_SESSION_TYPE
set -g allow-passthrough on
set -g default-terminal "screen-256color"
set -g escape-time 0
set -g mode-keys vi
set -g mouse on
set -g set-clipboard on
set -g status on
set -g status-interval 5
set -g status-justify centre
set -g status-left "#[bold]#S"
set -g status-left-length 60
set -g status-right "#[fg=green]#(whoami) #[fg=yellow]%Y-%m-%d #[fg=cyan]%H:%M:%S"
set -g status-right-length 120
set -g status-bg default
set -g visual-activity off
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set-option -as terminal-features ",tmux-256color:RGB"
set-option -as terminal-features ",xterm-256color:RGB"
set-option -ga terminal-overrides ",*:Tc"
set-option -g aggressive-resize on
set-option -g message-style 'bg=default'
set-option -g mode-style 'bg=default'
set-option -g pane-active-border-style 'bg=default'
set-option -g pane-border-format " #P "
set-option -g pane-border-status top
set-option -g pane-border-style 'bg=default'
set-option -g status-bg default
setw -g window-status-current-format "#[bold][#I:#W]"
setw -g window-status-format " #I:#W "
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind-key ^D detach-client
bind-key ^S split-window -p 50 -c "#{pane_current_path}"
bind-key ^V split-window -h -p 50 -c "#{pane_current_path}"
bind-key p run-shell "wl-paste | tmux load-buffer - && tmux paste-buffer"
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded!"
bind-key s split-window -p 50 -c "#{pane_current_path}"
bind-key v split-window -h -p 50 -c "#{pane_current_path}"
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy"
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
bind -n MouseDragEnd1Pane if-shell -F "#{mouse_any_flag}" "copy-mode -M" ""
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\\1/p")'
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"
if-shell "[ -f ~/.config/tmux/tmux.conf ]" 'source ~/.config/tmux/tmux.conf'
